# Hub copy for /articles/ai-agents/. See technical-documentation.yaml for the fields.
opening_source:
  url: "https://en.wikipedia.org/wiki/Pipeline_(Unix)"
  fact: "Ken Thompson added the pipe() system call and pipes to the shell and several utilities in Version 3 Unix (1973)."
  checked: 2026-11-17
lead: "An AI agent is a loop around a model, and AI agent architecture is the design of that loop and the harness that runs it. This topic maps the parts in order, from what an agent is to how one fails."
intro: |
  Ken Thompson added [pipes](https://en.wikipedia.org/wiki/Pipeline_(Unix)) to Unix in 1973, in Version 3. A pipeline chains programs so the output of one becomes the input of the next.

  A shell pipeline is fixed by the person who types it. An agent composes its own at run time, because the model reads the result of one tool call and decides which call comes next.

  A single input can therefore take a different path on the next run, and the code around the model has to expect that and recover from it.
argument: "The engineering in an agent sits outside the model, in the harness that runs the loop and the handling for when it goes wrong."
sections:
  - heading: "What an agent is"
    spokes:
      - post: ai-agent-taxonomy
        note: "Groups agents into five types by autonomy and scope, to decide how much autonomy a task needs."
      - post: agent-vs-ai-assistant
        note: "Draws the line at who chooses the next step, with an experiment in which six assistants were told to act alone."
      - post: agent-design-space
        note: "Sets Anthropic's six agent design patterns beside a second list and gives a grid for placing any pattern."
  - heading: "The loop and the harness"
    spokes:
      - post: agent-loop-anatomy
        note: "Breaks the loop into four phases, runs one in a short script, and shows how two SDKs stop it."
      - post: agent-harnesses
        note: "Lists what a harness contains and explains why a framework alone may not supply it."
      - post: lambda-calculus-ai
        note: "Uses lambda calculus problems with mechanically checkable answers to expose reasoning errors in model output."
  - heading: "Protocols"
    spokes:
      - post: model-context-protocol
        note: "Explains how MCP connects a model to data sources and tools."
      - post: mcp-server-tutorial
        note: "Builds a docs search server in Python and tests it without a model."
  - heading: "A single agent or several"
    spokes:
      - post: multi-agent-vs-single-agent
        note: "Weighs one agent against several on failure modes and latency."
  - heading: "Failure"
    spokes:
      - post: agent-error-handling
        note: "Covers the error patterns that break agents in production and the handling that contains them."
      - post: ai-agent-failures
        note: "Catalogs why agents fail in production and what the field is doing about it."
bridges:
  - hub: agent-memory
    text: "The loop's remember step has a topic of its own, and [AI agent memory](/articles/agent-memory/) covers what gets written and read back."
  - hub: coding-agents
    text: "A coding agent is the agent a developer uses daily, and the [coding agents](/articles/coding-agents/) topic covers the files that configure one."
  - hub: ai-engineering
    text: "Each turn of the loop spends tokens and latency, which the [LLM inference](/articles/ai-engineering/) topic measures."
faqs:
  - q: "How do the parts of an AI agent fit together?"
    a: "The model chooses the next tool call, the loop carries the result back to it, and the harness runs the loop. The [agent loop](/articles/agent-loop-anatomy/) page covers the four phases, and the [agent harness](/articles/agent-harnesses/) page covers the layer around them."
