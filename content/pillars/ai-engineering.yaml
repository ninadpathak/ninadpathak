# Hub copy for /articles/ai-engineering/. See technical-documentation.yaml for the fields.
opening_source:
  url: "https://en.wikipedia.org/wiki/Demoscene"
  fact: "A 64K intro is a demo with an executable file size limit of 64 kibibytes, or 65,536 bytes. fr-08, a 64k PC demo by Farbrausch, was released at The Party 2000."
  checked: 2026-11-17
lead: "LLM inference is the step where a trained model turns a prompt into output tokens, and it sets the latency and cost of a product built on the model. This topic covers the mechanisms behind both, plus the context window and the output format."
intro: |
  A [64K intro](https://en.wikipedia.org/wiki/Demoscene) is a demo whose executable is limited to 65,536 bytes, and Farbrausch released fr-08 in that category at The Party in 2000. The demoscene turned a fixed budget into a craft.

  Inference work runs on budgets of that kind. A token budget caps what a request may spend, and a latency budget caps how long the first word may take.

  A demo coder gives up bytes, and an inference engineer can give up answer quality. That loss has to be measured before it ships.
argument: "Latency and cost come from a small set of mechanisms, and each one trades against quality in a way that can be measured."
sections:
  - heading: "Latency"
    spokes:
      - post: time-to-first-token
        note: "Covers how to measure and reduce the wait before the first word appears."
      - post: speculative-decoding
        note: "Explains how a smaller draft model predicts tokens for a larger one to speed up generation."
      - post: voice-agent-latency
        note: "Adds up a voice agent turn stage by stage and argues that endpointing is where to spend effort first."
  - heading: "Throughput and cost"
    spokes:
      - post: llm-inference-optimization
        note: "Covers which optimizations are engine defaults in late 2026 and how to size the KV cache."
      - post: kv-cache-eviction
        note: "Explains the KV cache, sizes it from a model config, and compares what each eviction policy keeps when it fills."
      - post: mixture-of-experts
        note: "Explains how a mixture-of-experts model activates a fraction of its parameters per token, and what that costs in memory."
      - post: llm-token-budgets
        note: "A guide to token budgets as a way to keep LLM spend predictable."
  - heading: "Context and output"
    spokes:
      - post: llm-context-windows
        note: "Explains why the middle of a long context gets less attention, what context rot is and what a long context costs."
      - post: llm-structured-outputs
        note: "Separates JSON mode from structured outputs and function calling by what each one guarantees."
bridges:
  - hub: agent-memory
    text: "Memory holds what the context window cannot, and the [AI agent memory](/articles/agent-memory/) topic covers that system."
  - hub: rag
    text: "Retrieval decides which tokens enter the context in the first place, covered in the [RAG pipeline](/articles/rag/) topic."
faqs:
  - q: "Where should inference optimization start?"
    a: "Start by measuring the wait a user sees, which is [time to first token](/articles/time-to-first-token/). The guide to [LLM inference optimization](/articles/llm-inference-optimization/) then says which techniques are already engine defaults."
