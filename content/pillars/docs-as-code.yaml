faqs:
  - q: "What does docs as code mean?"
    a: "It means managing documentation changes with engineering practices such as version control, pull requests, previews, automated checks, and repeatable builds."
  - q: "Does docs as code require documentation to live in the product repository?"
    a: "No. A separate repository can work well if product changes still trigger documentation work and reviewers can inspect both the source change and rendered result."
