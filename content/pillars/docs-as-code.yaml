slug: docs-as-code
status: published
title: "Docs as Code: Git Workflows, Testing, and Maintenance"
h1: "Docs as Code"
description: "Use Git, previews, automated checks, and explicit ownership to keep documentation accurate as the product changes."
intro: |
  Docs as code is useful when it shortens the distance between a product change and the
  documentation that explains it. Git alone does not provide that outcome. The workflow
  also needs previews, focused review, automated mechanical checks, ownership, and a
  release trigger.

  This hub covers that operating system, including the places where automation should
  stop and a technical reviewer must make the decision.
checklist_heading: "Build the smallest reliable workflow"
checklist:
  - "Store reviewable source files beside the code or in a repository with clear ownership."
  - "Generate a preview for every documentation pull request."
  - "Check links, Markdown structure, spelling rules, and the production build in CI."
  - "Test executable examples separately from prose checks."
  - "Connect product releases to documentation issues and named maintainers."
  - "Preserve URLs, metadata, and redirects during platform migrations."
sections:
  - heading: "Release communication"
    blurb: "Keep developers informed when behavior changes."
    posts:
      - how-to-write-a-changelog-developers-actually-read
      - writing-release-notes-that-developers-trust
planned:
