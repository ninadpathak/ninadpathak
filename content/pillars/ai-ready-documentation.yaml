faqs:
  - q: "Does llms.txt guarantee that AI tools will cite a documentation site?"
    a: "No. It is a proposed discovery format, not a ranking or inclusion guarantee. Any claim about its effect should be tested against observable crawler and citation behavior."
  - q: "What makes documentation easier for a RAG system to retrieve?"
    a: "Clear section boundaries, specific headings, local context, stable metadata, exact terminology, and a chunking strategy tested against real questions all improve the odds of retrieving the right evidence."
