  - "How to Organize a Documentation Site"
faqs:
  - q: "What should developer documentation include?"
    a: "At minimum, give users a clear starting path, task-based guides, accurate reference information, runnable examples, troubleshooting help, and version context. The exact mix depends on the product and the jobs developers need to complete."
  - q: "How should a small team start improving its documentation?"
    a: "Choose one important user task, follow the current documentation from a clean environment, record every missing assumption and failure, then repair that path before reorganizing the entire site."
