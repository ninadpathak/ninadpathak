faqs:
  - q: "What is the difference between API reference and API guides?"
    a: "Reference records the behavior of endpoints, fields, schemas, and errors. Guides connect those pieces into a task such as authenticating, syncing data, or handling a webhook."
  - q: "Can OpenAPI generate complete API documentation?"
    a: "It can generate a strong reference baseline, but it does not replace onboarding, task guides, integration decisions, troubleshooting, or tested end-to-end examples."
