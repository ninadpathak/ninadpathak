slug: api-documentation
status: published
title: "API Documentation: Reference, Guides, and Working Requests"
h1: "API Documentation"
description: "Build API documentation that takes a developer from authentication to a successful request—and helps them recover when it fails."
intro: |
  An endpoint reference is only one part of API documentation. Developers also need a
  path through authentication, complete requests, realistic responses, errors,
  pagination, webhooks, SDK behavior, and version changes.

  The guides in this hub use one coherent sample API so examples can be run and compared
  instead of treated as decorative snippets.
checklist_heading: "Before you publish an API"
checklist:
  - "Document authentication before the first endpoint example."
  - "Provide one complete request and response that works with replaceable credentials."
  - "Explain every error developers can reasonably recover from."
  - "Show pagination, limits, ordering, retries, and idempotency where they apply."
  - "Test generated reference output against the source OpenAPI document."
  - "Connect breaking changes and deprecations to a migration path."
sections: []
