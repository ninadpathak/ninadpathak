# Hub copy for /articles/rag/. See technical-documentation.yaml for the fields.
opening_source:
  url: "https://en.wikipedia.org/wiki/Okapi_BM25"
  fact: "Okapi was implemented at London's City University in the 1980s and 1990s; Robertson and colleagues presented 'Okapi at TREC-3' at TREC 1994."
  checked: 2026-11-17
lead: "A RAG pipeline retrieves text from an index and puts it in the prompt before the model answers. This hub follows the pipeline from embeddings through evaluation."
intro: |
  BM25 comes from the Okapi system at City University in London, which Stephen Robertson's team presented as [Okapi at TREC-3](https://en.wikipedia.org/wiki/Okapi_BM25) in 1994. It ranks documents by the query words they contain, and it is the keyword half of hybrid search today.

  A RAG pipeline puts that 1994 function beside a dense vector index and fuses the two rankings. The stages after it rerank the candidates and pass the survivors to the model.

  The parallel with classic search breaks at the consumer. A person scanning ten results can skip a bad one, and a model reads whatever lands in the prompt as evidence.
argument: "Retrieval quality is decided before generation, so each retrieval stage gets measured on its own before the generated answer is judged."
sections:
  - heading: "Foundations"
    spokes:
      - post: vector-embeddings
        note: "Explains embeddings with a model run on six short texts, and shows why similarity scores mislead."
      - post: fine-tuning-vs-rag
        note: "Decides between fine-tuning and retrieval by which part of the problem each one solves."
  - heading: "Retrieval quality"
    spokes:
      - post: hybrid-search
        note: "Fuses BM25 and vector retrieval with reciprocal rank fusion, with runnable code and benchmark scores."
      - post: rag-reranking
        note: "Tests a bi-encoder against two cross-encoders on one set of candidates and reports what reranking fixed."
      - post: contextual-retrieval
        note: "Covers Anthropic's method of prepending a model-written note to each chunk, with what it measured and what it costs."
  - heading: "Cost"
    spokes:
      - post: semantic-caching
        note: "Explains how a cache keyed on meaning returns stored responses for similar queries, and where it fails."
  - heading: "Evaluation"
    spokes:
      - post: rag-evaluation
        note: "Covers RAGAs along with recall and precision, the metrics for judging a retrieval system."
  - heading: "Benchmarks"
    spokes:
      - post: browser-vector-search
        note: "Compares PGlite and SQLite-vec for vector search in the browser, and says what to measure on real data."
bridges:
  - hub: agent-memory
    text: "Agent memory reuses this retrieval stack for a different job, and the [AI agent memory](/articles/agent-memory/) hub covers where the two differ."
  - hub: ai-engineering
    text: "A retrieved token costs latency and money like any other, and the [LLM inference](/articles/ai-engineering/) hub covers that budget."
faqs:
  - q: "What is a RAG pipeline?"
    a: "A RAG pipeline retrieves text from an index and puts it in the prompt before the model answers. Its stages run from embedding and search through reranking to evaluation."
  - q: "What is hybrid search?"
    a: "Hybrid search fuses BM25 keyword retrieval with vector retrieval. Reciprocal rank fusion is the fusion method the guide in this hub implements."
  - q: "How do you evaluate a RAG pipeline?"
    a: "Measure retrieval apart from generation. Recall and precision score what was retrieved, and the evaluation guide in this hub covers RAGAs for the rest."
