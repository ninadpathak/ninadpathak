# Hub copy for /articles/developer-experience/. See technical-documentation.yaml for the fields.
opening_source:
  url: "https://www.joelonsoftware.com/2008/09/15/stack-overflow-launches/"
  fact: "Dated September 15, 2008: 'I thought the combination of my audience (#15 on Bloglines) and Jeff's (#89) would bring enough great developers'."
  checked: 2026-11-17
lead: "Developer content is the technical writing a company publishes for engineers, from blog posts to documentation. This topic covers what to publish and how to write it, then who should do the writing."
intro: |
  Stack Overflow launched on September 15, 2008, and Joel Spolsky [wrote that day](https://www.joelonsoftware.com/2008/09/15/stack-overflow-launches/) that he expected his audience combined with Jeff Atwood's to bring enough developers to the site. Those audiences came from Joel on Software and Coding Horror, two personal blogs written by working programmers.

  A company blog asks for that kind of attention with a product to sell. Its reader is an engineer who can run the example, so each claim gets checked against the product before the next one is trusted.

  The Stripe engineering blog is the worked example in this topic of a company whose writing passed that check.
argument: "Developers check claims, so content earns trust by being runnable and loses it by overclaiming."
sections:
  - heading: "What to publish"
    spokes:
      - post: stripe-technical-blog
        note: "Shows what the Stripe engineering blog publishes now and why the writing works as an advantage."
      - post: devtools-documentation
        note: "What a buyer checks in a devtools company's docs before a trial, with survey figures and a script that probes vendor quickstarts."
      - post: documentation-velocity
        note: "Reads DORA's 2022 table on documentation quality, says how far it can be pushed, and shows how to measure one document on your own team."
  - heading: "How to write it"
    spokes:
      - post: technical-writing-for-engineers
        note: "Takes four rules from aerospace's Simplified Technical English, checks two of them with a script, and names the habits a script can't check."
      - post: writing-for-ai-products
        note: "Covers what AI product docs now need, such as prompts and evals, and how to judge a writer for an AI company."
      - post: eleven-rejected-essay-drafts
        note: "Rereads the log of eleven essay openings a model wrote for my writing skill, reruns the brief on Haiku 5.5, and shows which rejected faults the author's name alone brings back."
      - tool: linter
        note: "Paste a draft and get a report on the patterns that lose technical readers, such as condescension words."
  - heading: "Who writes it"
    spokes:
      - post: engineer-to-writer
        note: "Sorts engineering habits into the ones that help technical writing and the ones to drop."
bridges:
  - hub: technical-documentation
    text: "Documentation is the content developers trust first, and the [technical documentation](/articles/technical-documentation/) topic has a template for each page type."
  - hub: ai-search-optimization
    text: "An AI assistant now reads developer content on a developer's behalf, and [AI search optimization](/articles/ai-search-optimization/) covers what makes a page quotable."
faqs:
  - q: "Who should write developer content?"
    a: "Someone who runs the product before writing about it, which is how I work. The guide to [technical writing for AI products](/articles/writing-for-ai-products/) lists what I would check in a writer for an AI company."
