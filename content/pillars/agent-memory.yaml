# Hub copy for /articles/agent-memory/. See technical-documentation.yaml for the fields.
opening_source:
  url: "https://en.wikipedia.org/wiki/HTTP_cookie"
  fact: "Lou Montulli had the idea of using cookies in web communications in June 1994, at Netscape, for MCI's e-commerce application; they solved the virtual shopping cart."
  checked: 2026-11-17
lead: "AI agent memory is the state an application saves outside the model and feeds back into later requests. A model call keeps nothing between requests, so the application decides what to write down and what to read back."
intro: |
  Lou Montulli had the idea of using [cookies](https://en.wikipedia.org/wiki/HTTP_cookie) in web communications in June 1994, while Netscape was building an e-commerce application for MCI. HTTP kept no state between requests, and a cookie gave a shopping cart somewhere to live.

  A model call is stateless in that way too, so what an agent should know from last week has to be put into the request. A cookie holds a value the server wrote on purpose, though, and agent memory is distilled from conversation, where a later fact can contradict an earlier one.

  I ran a team of 13 writers at Mem0, which sells a memory layer, so weigh this topic with that in mind.
argument: "Memory is a pipeline the application owns from the write to the read, and each stage has its own failure."
sections:
  - heading: "What memory is"
    spokes:
      - post: ai-memory-management
        note: "Covers the memory layers and who decides what gets written, with runnable examples of eviction and scope."
      - post: agent-memory-types
        note: "Names the four memory types, says where the names come from, and shows why the type decides the lookup."
      - post: context-windows-vs-memory
        note: "Treats the context window as a per-request budget and memory as state retrieved into a later request."
      - post: rag-vs-memory
        note: "Draws the line between retrieval for one request and state kept across requests, and shows how to run both."
  - heading: "Short-term memory and compression"
    spokes:
      - post: short-term-agent-memory
        note: "Covers what compaction keeps and loses in the context window, with a tested example of a dropped instruction."
      - post: memory-compression
        note: "Compares three compression strategies for deciding what stays when context is finite."
  - heading: "Persistence and audit"
    spokes:
      - post: memory-serialization
        note: "Explains why an agent forgets on restart and the serialization patterns that carry state across sessions."
      - post: memory-versioning
        note: "Builds append-only memory versioning so an agent's reasoning can be traced in an audit."
      - post: agent-memory-evidence
        note: "Argues that a memory record should carry how the agent knew, ahead of any shared format."
  - heading: "Several agents, and voice"
    spokes:
      - post: shared-vs-isolated-memory
        note: "Sets shared against isolated memory for multi-agent systems, with what OpenAI's Agents SDK and Claude Code do by default and a lost-update run."
      - post: voice-agent-memory
        note: "Covers memory across a real-time streaming pipeline, where a voice agent has constraints a text chatbot lacks."
  - heading: "The field and its tools"
    spokes:
      - post: agent-memory-2026
        note: "Compares four agent memory frameworks by who writes a memory and what shape it is stored in, from their current docs."
      - post: hyperagents-memory
        note: "Walks through how HyperAgents layers memory and keeps session continuity."
      - post: deerflow-memory
        note: "Walks through DeerFlow's memory as its repository documents it: one Markdown file per fact, a write gate and optional backends."
bridges:
  - hub: rag
    text: "A memory read path is a retrieval problem, and the [RAG pipeline](/articles/rag/) topic covers the search stack it runs on."
  - hub: ai-engineering
    text: "Context window limits are the reason memory exists, and the [LLM inference](/articles/ai-engineering/) topic covers what a long context costs."
  - hub: coding-agents
    text: "Claude Code's memory files are one product's version of this design, covered in the [coding agents](/articles/coding-agents/) topic."
faqs:
  - q: "Does an agent need memory if it has RAG and a large context window?"
    a: "Yes, when state has to survive across requests. The page on [context window vs memory](/articles/context-windows-vs-memory/) treats context as a per-request budget, and [RAG vs memory](/articles/rag-vs-memory/) shows that RAG selects evidence for one request."
