# Hub copy for /articles/ai-search-optimization/. See technical-documentation.yaml for the fields.
opening_source:
  url: "https://en.wikipedia.org/wiki/Robots.txt"
  fact: "Martijn Koster proposed the standard in February 1994 on the www-talk mailing list; it relies on voluntary compliance."
  checked: 2026-11-17
lead: "AI search optimization for documentation is the work of making a page fetchable by AI crawlers and quotable by answer engines. This topic covers the two parts a publisher controls, which are crawler access and page structure."
intro: |
  Martijn Koster proposed [robots.txt](https://en.wikipedia.org/wiki/Robots.txt) on the www-talk mailing list in February 1994. The standard is a plain text file, and it relies on voluntary compliance by the crawlers that read it.

  GPTBot and OAI-SearchBot read that file today. The crawler guide in this topic checked 12 developer documentation hosts on October 22, 2026, and every robots.txt that existed allowed every AI agent the checker knows.

  What happens after the fetch is the engine's choice. It may quote one passage or leave the page out.
argument: "A publisher controls access and page structure and nothing after that, so the access and extraction checks in this topic each come with a free tool that reruns them."
sections:
  - heading: "Access"
    blurb: "A crawler that cannot fetch the page ends the process here."
    spokes:
      - post: ai-crawlers
        note: "Separates the robots.txt rules that block AI training from the rules that block AI search, with what 12 documentation sites allow."
      - tool: ai-crawler-checker
        note: "Paste a robots.txt and see which AI platforms it lets cite the site and which it lets train on it."
  - heading: "Extraction and files"
    blurb: "Once the page is fetched, an engine has to lift an answer that still makes sense alone."
    spokes:
      - post: llms-txt
        note: "Covers what the llms.txt proposal requires and what server logs say about its use, with four real files checked."
      - tool: llms-txt-validator
        note: "Checks a file against the v2 proposal and keeps specification findings apart from conventions."
      - tool: llms-txt-generator
        note: "Drafts an llms.txt from a sitemap for editing in the browser."
      - post: aeo-for-developer-docs
        note: "Sets AEO and GEO beside SEO, then gives six checks that decide whether docs can be found and quoted."
      - tool: ai-overviews-checker
        note: "Runs nine sourced structural checks on a page for snippet eligibility and extractable answers."
  - heading: "Agents as readers"
    spokes:
      - post: agents-reading-docs
        note: "A close read of Fern's claim that agents make over half the requests to the docs it hosts, and what the numbers leave out."
      - post: vercel-agent-study-by-harness
        note: "Recomputes the 1,033 agent runs Vercel and Ora traced and splits them by harness, where every Markdown request comes from one of the two."
      - post: mintlify-llms-txt-benchmark
        note: "Regenerates Mintlify's 2,400-run llms.txt benchmark from its published rows, where the link removes the 404s and Markdown saves more of the cost."
bridges:
  - hub: technical-documentation
    text: "These checks cannot help a page that ordinary search fails to crawl, so the SEO checklist in the [technical documentation](/articles/technical-documentation/) topic comes first."
  - hub: ai-agents
    text: "An MCP server is one more way to serve documentation to an agent, and the [AI agent architecture](/articles/ai-agents/) topic has a tutorial that builds a docs search server."
faqs:
  - q: "What can a publisher control in AI search?"
    a: "A publisher controls which crawlers may fetch a page and how the page is structured for quoting. The guide to [AI crawlers](/articles/ai-crawlers/) covers the robots.txt rules, and placement in an answer stays with the engine."
  - q: "Is AI search optimization different from SEO?"
    a: "Google says optimizing for its generative AI search is still SEO, so the work starts with an indexed page that can show a snippet. The comparison of [AEO vs SEO](/articles/aeo-for-developer-docs/) lists the six checks that follow from that."
