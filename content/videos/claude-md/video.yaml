transcript: Okay, so CLAUDE.md is Claude Code's instruction file, and AGENTS.md is the open format Codex reads for the same job. By default, Claude Code reads AGENTS.md only if there's no CLAUDE.md, so with both in a repo, each agent reads just its own file. So I keep AGENTS.md as the shared file, since more agents read it, and my CLAUDE.md starts with @AGENTS.md. Claude Code expands that import at launch, so one file serves both agents. In that file, I write the commands and rules an agent can't infer from the code, and keep it under two hundred lines.
