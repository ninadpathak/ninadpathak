transcript: A team wanted an agent to route tickets, and three months in, it was a fragile loop doing one prompt's job. The question is who drives the loop, since an AI agent picks its next step, and an AI assistant leaves it to you. Each pass is a model call, and the loop can fail in ways that are hard to predict. So I'd want an agent when each step depends on what the last one found, like tracing a checkout bug. To check, I ask if a human could do it in under five minutes with the right tools, and if so, I'd build an assistant.
