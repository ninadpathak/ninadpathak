transcript: Okay, so an agent harness is the runtime layer around the model, and you need one because an API call is stateless. A research agent might make thirty to fifty calls in one task, so the harness runs the loop while the model only reasons. The hard part is checkpointing, because without it a run that fails at step eighteen restarts from the beginning. So I'd save state after each step and make the tools idempotent, which means a repeated call gives the same result. Then a failed run resumes from its last checkpoint instead of starting over.
