transcript: Okay, so AEO, GEO and SEO sound like three jobs for my docs, but they share one goal, which is getting a page into an answer. Google says optimizing for its AI search is still SEO, so my page needs to be indexed and able to show a snippet, with no special schema. What AEO adds is two checks, and the first is crawler access, because OpenAI runs separate crawlers for search and training, so I can allow one and block the other. The second is that each passage makes sense quoted alone, so my opening answers the title and each section names its subject.
