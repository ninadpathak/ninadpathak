transcript: Does a big context window give an agent memory? It doesn't, because the window starts empty each session, so AI memory management stores facts outside the model and decides what to forget. When that store fills, least-recently-used eviction keeps recent small talk and drops the user's deployment region, because recency has nothing to do with importance. So I'd score each entry by its relevance to the task and by whether the user asked to remember it. To start, I'd store session state explicitly and add eviction on day one, before a long customer session fills the context.
