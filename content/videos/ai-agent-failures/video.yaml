transcript: AI agents fail in production not because the technology is immature, but because the patterns for running them are still being invented. Underneath, running an agent is a distributed systems problem. When a refund call times out, the agent retries without checking if the first one landed, so the refund goes out twice. Splitting work across agents makes it worse, because five agents at ninety percent reliability multiply out to fifty-nine percent. So before adding agents, I'd put in a circuit breaker that halts the loop past an error threshold, and observability on each tool result.
