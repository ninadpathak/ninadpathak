transcript: Okay, so a quick start guide gets one reader to one working result by the shortest supported path. So I list each tool's minimum version first, because an old version breaks step one with nothing pointing at the cause. Then each command gets its exact output beside it, so the reader can tell within one step whether they're on track. In my GitHub example, curl needs fail-with-body, because without it a four-oh-four still exits zero, and jq prints null. And before I publish, I run every command in a fresh directory and compare its output with the page.
