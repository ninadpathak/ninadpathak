transcript: How does a beautifully edited docs page ship with a broken path, when the review argued over commas and heading length? The command was still untested, so I'd start documentation review with the product, and polish the prose after the behavior survives. For each claim that can break the task, like who can create API keys, I'd want a source outside the draft. Then I'd run the page from its documented starting state and trigger the error it claims to solve. So on your next docs pull request, check the product and the reader's route, then the rendered page and release state, before the wording.
