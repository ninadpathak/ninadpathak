transcript: Okay, so a design doc template is a fixed outline for proposing a change before I build it, so reviewers can compare it with the options I rejected. It first states the problem, like an export service whose records live in memory, so a restart erases them. Every alternative needs a reason it was rejected, and the first is doing nothing, because if I can't say what that costs, reviewers can't weigh my proposal against it. So before review, I run the checker, which fails a doc marked Accepted that still lists an open question.
