transcript: When a Claude Code session ends, the conversation is gone, but the next one starts with the project's instructions. That's because Claude Code memory lives in files on disk, not in the conversation. The first is CLAUDE.md, which you write, and it's read only at startup, so a mid-session edit waits for the next session. The second is auto memory, which Claude Code writes as it works, with MEMORY.md indexing its topic files. An outdated note is worse than none, because the agent trusts it and writes code that breaks. So I'd run /memory to see what's loaded and remove stale instructions.
