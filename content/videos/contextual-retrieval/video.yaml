transcript: Why can a search for Acme's Q3 revenue miss the right chunk? Because a chunk split from its filing loses the company and the quarter. Contextual retrieval fixes that at indexing time, by having Claude explain each chunk using the full document. That explanation goes in front of the chunk, so embeddings and BM25 can find it by the company and the quarter. In Anthropic's tests, that cut top-20 retrieval failure by 49%, but every chunk now costs more to index. So I'd check metadata first, and add the explanations only where a chunk still reads as anonymous.
