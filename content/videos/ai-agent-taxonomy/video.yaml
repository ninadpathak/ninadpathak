transcript: Each step up the five types of AI agents raises cost and blast radius by roughly an order of magnitude. That's because each step decides more without a human, so a reactive chatbot can only give a bad answer, but an autonomous agent can act on it ten times. The steps run from reactive and tool-using agents, through loop agents and multi-agent systems, to persistent-goal agents. So to pick one, I ask if it takes actions, keeps state across interactions, or needs several agents. If it's only text, the first two steps probably suffice, and each yes adds cost.
