transcript: Kill a DeerFlow workflow partway through, and it resumes where it left off, because each stage writes its outputs to a session file. Each agent's working memory lives in its prompt and resets between stages, so the next one reads that file back in. The file is plain JSON, so you can open it to see which stages finished and what each produced. Findings that should outlast the session go to a store you plug in, like pgvector, which the next run queries first. So for a research pipeline that has to be auditable and resumable, I'd reach for DeerFlow.
