transcript: Okay, so an MCP server gives an AI client tools, and the model calls each tool by name. With the Python SDK, each type-hinted function becomes a tool, and its docstring is what the model reads to choose one. A tool's arguments come from the model as plain strings, so I'd resolve every path before checking it's inside the docs folder. The tool's output format matters too, because when read_doc returned plain text, Claude cited the right line in one run of four. With numbered lines it was four of four, so I'd return what the model has to cite ready to copy.
