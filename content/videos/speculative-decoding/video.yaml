transcript: "Okay, so my 70B makes one token at a time, reading all its weights from memory while the compute sits idle. So I use speculative decoding, where a 1B model drafts the next few tokens. My 70B checks them all in one pass, and because the weights load once, that costs about the same as making one token. It keeps what it agrees with and fixes the first miss, so three right out of five gives me four tokens. Since my 70B has the final say, the output doesn't change, and a good draft makes it two to three times faster."
