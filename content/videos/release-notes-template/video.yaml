transcript: Okay, so a release notes template puts the upgrade decision before the details. My summary at the top says who has to act and what to do, including when rollback stops being safe. In my SDK example, the summary tells Python users they can ignore the release, so they stop after one line. Then each breaking change gets a migration step and a check that proves it worked, plus a deadline with a calendar date. Before publishing, my checker fails a note with a missing rollback line or a vague deadline, so in CI it can't merge until it passes.
