transcript: You go to change a line, but its reason lives in a handbook, so the code gets hard to change. That's why my code documentation gives each answer one of three homes. A comment holds local reasoning, like the stable ordering a later edit could quietly break. A docstring states what a function accepts or returns, so the generated reference stays beside the code. But generated pages can't reliably say what to do when a valid request fails, so that goes in a guide. So I'd ask what the reader needs at that moment, because that decides where it belongs.
