transcript: For years, moving the database onto the user's device meant giving up backend vector search. Now WebAssembly builds of PGlite and SQLite-vec run vector search in the browser. PGlite runs Postgres with pgvector, whose index walks a graph instead of checking every vector. In its stable release, SQLite-vec scans every vector instead, and quantization speeds that up but costs some recall. PGlite is a real relational database, so I'd pick it when results must join metadata, and SQLite-vec for a bounded docs corpus. Then I'd time both on my own vectors in my target browser, because the faster one depends on vector count and recall.
