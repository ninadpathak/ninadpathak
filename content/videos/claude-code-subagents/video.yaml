transcript: Okay, so when Claude Code checks every link in a docs folder, the search results land in your conversation and sit there all session. A Claude Code subagent is a Markdown file that runs that search in its own context window and returns only its final report. It starts without your conversation history, so the prompt in that file has to carry every rule the job needs. The tools line is enforced, because a read-only subagent told to fix links got no such tool available on every Edit call. So I'd rely on the tools line over the prompt.
