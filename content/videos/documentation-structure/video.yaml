transcript: Take a docs site with the same authentication steps under Getting Started, Developers and API. Menus like that follow the org chart, so I'd build the documentation structure around reader routes, through setup and use, then failure and change. Then I'd give authentication one canonical home, so the guide owns creating and rotating a key, and the reference owns status codes. Before moving pages, I'd hand a reviewer a task like a failing webhook check, and rename the route if two labels look equally right. So check that each label narrows the reader's next decision, because one that only shows ownership belongs in repository metadata.
