transcript: Picture a model that aces a Python quiz but can still fall apart renaming a function used across forty files. That's why I'd compare the best LLMs for coding on SWE-bench Verified, where a model has to resolve an actual GitHub issue. Claude 4.6 Opus leads that benchmark, but the right model still depends on the kind of work. For an unattended agent on multi-file pull requests I'd reach for Claude, and to reason over a whole repository, Gemini 3.1 Pro. So rather than one model for everything, I'd route autocomplete to a small fast model.
