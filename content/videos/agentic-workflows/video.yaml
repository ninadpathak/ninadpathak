transcript: Ask an agent to add caching to the API, and it picks one kind and builds everything around that guess. So I run an agentic workflow, where I frame and scope the task first and review its diff before it lands. The frame is a brief that says what done looks like, with the goal and an acceptance check. Scoping keeps the diff small enough to read in one sitting, because an unreviewable diff can't be trusted. So before a change lands, I'd read the diff rather than the summary, because the summary is only what the agent believes it did.
