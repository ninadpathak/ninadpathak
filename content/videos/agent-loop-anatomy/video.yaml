transcript: Okay, so an agent loop is four phases, and a failure in any one looks like the whole agent failing. First it perceives, reading its context, then it thinks, deciding which tool to call, and then it acts, calling that tool. Last, it remembers, updating its state with the result, so the next cycle has accurate context. Each phase fails in its own way, so infinite loops start in act, and lost tool results start in remember. So I'd check perceive first, then remember, because what reads as bad reasoning can be a perception or memory problem.
