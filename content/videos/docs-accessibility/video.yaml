transcript: What leaves a reader stuck on a docs page that looks finished? Accessibility testing answers that, because a screen reader follows only the structure in the markup, not a bold-text heading. And if only a screenshot shows the request returned 200, that reader can't confirm success, so I'd say it in nearby text. So I'd run a checker on the generated HTML, then tab through and zoom the page, because automation can't judge focus or reflow. Then I'd make that a release gate, running the checker in the same preview step that checks links and examples.
