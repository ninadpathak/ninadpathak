transcript: Okay, so the agent design space maps how production agents cluster around their constraints rather than neat types. A single-loop agent retrieves context, calls a tool and answers, which fits a docs-search assistant where wrong answers cost little. Multi-turn, workflow, supervisor and persistent-goal agents run progressively longer, so more of their state must survive a restart. So the design space isn't a menu, and the mistake is stretching a simple pattern past its scope. For a new agent, I ask whether it acts or just generates, keeps state, or needs several agents.
