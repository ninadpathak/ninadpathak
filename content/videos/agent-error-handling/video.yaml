transcript: Okay, so error handling in AI agents breaks when a tool fails, because the agent gets a raw error string and improvises. It might retry a charge that already went through, so the customer pays twice. So I'd classify each error first and let my code pick the recovery, not the model. A transient error like a rate limit gets retried, and a permanent one like an invalid API key fails fast. A timeout is ambiguous, since the server may have processed it, so I'd attach an idempotency key, which makes the tool safe to call twice.
