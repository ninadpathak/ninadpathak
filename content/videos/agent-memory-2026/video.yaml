transcript: An agent can act on stale state without realizing its memory is wrong, so agent memory needs more than storage. RAG answers questions about documents, but a support agent that learns a customer is on the enterprise plan should still bill them that way tomorrow. To find it again, memory is a stack of storage, retrieval and ranking, and only what survives ranking reaches the context window. But perfect recall isn't enough, since the right facts in the wrong order can make the agent decide worse. So I'd test whether the agent does better with memory than without, including updates and contradictions.
