transcript: Under a heading like Configuration, a reader learns only the topic, but Configure the client with an API key says what they'll do. So the rule for documentation headings is that a heading tells a scanning reader what its section contains. For a procedure, I'd name the task or its result, like Create the project and install the CLI. But that doesn't mean a verb in every heading, because a concept or reference section gets a descriptive noun phrase, like Webhook signature headers. So before you publish, read the headings without the body copy, and check that each one says why its section exists.
