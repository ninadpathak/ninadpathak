transcript: Why would an agent forget what it just did, when its logs look normal? It's a category error, because agents run three memory types, working memory for the current turn, episodic for what happened, and semantic for what's true. An agent kept events in semantic memory, so asking what changed in the last hour returned config edits ranked by topic, not time. So I'd route facts to a semantic store, and events to an episodic store fetched by time. When it contradicts itself, I'd investigate episodic ranking, and when it's confidently wrong, I'd update the knowledge base.
