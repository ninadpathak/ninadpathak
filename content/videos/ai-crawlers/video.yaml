transcript: Okay, so AI crawlers in robots.txt aren't one bot, because OpenAI and Anthropic each run a separate agent for each job. GPTBot and ClaudeBot collect training data, while OAI-SearchBot and Claude-SearchBot index my docs for search. So I can block GPTBot and still show up in ChatGPT search, because OpenAI says each setting is independent. But a crawler obeys only the group that names it, so a GPTBot group for drafts drops the wildcard rule that kept it out of admin. So for docs, I'd leave every search agent open and decide on training separately, in its own group.
