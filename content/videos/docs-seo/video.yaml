transcript: Suppose a developer searches stripe 401 invalid API key, and two docs pages answer it. That's where docs SEO starts, because one page should own each task, so I'd fold the other into it. A crawler then has to reach it through a plain link, and I'd read the source HTML, because a browser can make a broken page look healthy. Then its canonical tag, sitemap and links should name one URL, because disagreement usually means parts of the site prefer different URLs. So I'd save a baseline first, then fix each blocking failure in that order, so I can explain what moved.
