transcript: Even a model that answers perfectly in one request can know nothing about it in the next. That's because a context window is a budget for one request, while memory is state stored outside the model and retrieved later. So a chat app that seems to remember is resending earlier turns into the context each time. And a bigger window doesn't guarantee recall, because even when a long contract fits, a clause halfway through can still go unused. So I'd ask how long the information must survive, keeping this request's evidence in context and storing what later requests need outside the model.
