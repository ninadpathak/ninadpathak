transcript: Okay, so I treat API documentation as pages with one job each, from the quickstart to the error guide. An OpenAPI file can generate the reference, but explaining what to do after a four-oh-nine is still my job. So my reference lists each response the endpoint returns, with its cause and its fix. A four-oh-nine means the idempotency key was reused with a different body, so the fix is a new key. Then a script sends each documented case to the running service, so a changed status code fails the check before a developer hits it.
