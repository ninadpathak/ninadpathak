- name: Semantic Caching
  slug: semantic-caching
  opening_definition: Semantic caching is an application cache that reuses a stored result when a new request is sufficiently similar in meaning to an earlier request. It applies when semantically equivalent inputs should produce the same valid response; it is unsafe when small differences in identity, time, permissions, or wording can change the correct answer.
  body_html: |
    <h2>A similarity decision replaces an exact-key decision</h2>
    <p>An ordinary cache retrieves a value by an exact key. A semantic cache embeds the new request, searches earlier request vectors, and reuses a result when the best match passes an application-defined acceptance rule.</p>
    <p>The pattern addresses repeated natural-language questions that differ in phrasing. It also creates a new failure mode: two nearby vectors can represent requests whose correct answers differ.</p>
    <h2>Password instructions can be reusable; account status cannot</h2>
    <p>A request for password-reset steps and a request for where to change a password may safely share a public help-center answer. A question about an account suspension cannot reuse another user’s response merely because the questions are semantically similar.</p>
    <p>The cache key therefore needs more than an embedding. Tenant, permissions, product version, locale, source freshness, and response type may all belong in the eligibility check.</p>
    <h2>Semantic caching is not prompt caching or retrieval</h2>
    <p>Prompt caching reuses computation for an identical input prefix, while semantic caching may return an earlier application result for different text. Retrieval fetches evidence for a new answer; a semantic cache may bypass generation altogether.</p>
    <p>The <a href="/articles/semantic-caching-rag-optimization/">semantic caching guide</a> develops the design and failure cases, while the <a href="/articles/prompt-caching-what-it-is-and-when-the-math-works/">prompt caching guide</a> covers the distinct provider-side mechanism. The common misuse is choosing one global similarity threshold without evaluating false hits on the decisions the application actually makes.</p>
    <h2>Invalidation is harder than matching</h2>
    <p>A cached answer may cease to be correct even when an incoming question remains similar. Source documents change, policies expire, and personalized facts move independently of the request wording.</p>
    <p>Entries therefore need provenance and an invalidation key tied to the data behind the response. Evaluation should count harmful false hits separately from harmless misses because reusing the wrong answer is usually worse than paying to generate a fresh one.</p>
  title: 'Semantic Caching: Reducing LLM Costs and Latency'
  description: Semantic caching intercepts prompts and returns cached responses for queries that have
    similar meaning, saving LLM API costs.
  short_definition: An optimization technique that stores previous LLM responses and uses vector similarity
    to return those cached answers for new queries that have the same semantic meaning, bypassing the
    LLM entirely.
  long_definition: Traditional caching (like Redis) requires an exact string match to return a cached
    result. If a user asks 'How do I reset my password?' and later asks 'What is the process to change
    my password?', a traditional cache misses. Semantic caching solves this by embedding the incoming
    user query into a vector and performing a fast nearest-neighbor search against previously answered
    queries. If the similarity score exceeds a defined threshold, the system immediately returns the cached
    response. This drastically reduces API costs, cuts latency to milliseconds, and protects backend LLMs
    from repetitive load.
  how_it_works: "A typical semantic cache pipeline:\n<ul>\n  <li><strong>Embedding:</strong> The incoming\
    \ user query is embedded into a dense vector using a fast, cheap model.</li>\n  <li><strong>Vector\
    \ Search:</strong> The vector is compared against a database of previous queries using Cosine Similarity.</li>\n\
    \  <li><strong>Threshold Check:</strong> If the similarity score is above 0.95, the cached LLM response\
    \ is returned instantly.</li>\n  <li><strong>Cache Miss:</strong> If no match is found, the query\
    \ goes to the expensive LLM, and the new response is cached.</li>\n</ul>"
  use_cases:
  - Customer support chatbots dealing with high volumes of repetitive questions.
  - Reducing API costs for enterprise RAG deployments.
