- name: Cross-Encoder Reranking
  slug: cross-encoder-reranking
  opening_definition: Cross-encoder reranking is a search stage in which one model reads a query and a candidate document together and assigns that pair a relevance score. It applies after a faster retriever has produced a manageable candidate set, especially when relevance depends on exact wording, negation, or relationships that independent embeddings may miss.
  body_html: |
    <h2>Joint attention spends more work on fewer candidates</h2>
    <p>A cross-encoder places the query and one candidate in the same model input. Because their tokens can interact through attention, the model can judge details that a single geometric comparison between independently produced vectors may hide.</p>
    <p>The cost is repeated inference: every query-candidate pair needs a forward pass. That makes cross-encoders natural rerankers and poor first-stage retrievers for a large collection.</p>
    <h3>A negated requirement can reverse the vector order</h3>
    <p>For the query “authentication without API keys,” a semantically similar API-key guide may rank above a page about workload identity. A cross-encoder can inspect the negation and the candidate text together, then move the workload-identity page upward.</p>
    <p>A <a href="/glossary/bi-encoder/">bi-encoder</a> creates reusable vectors for candidate retrieval. A large generative model can also score documents, but generation is not required for the pairwise relevance task.</p>
    <h3>The candidate set limits what reranking can repair</h3>
    <p>The <a href="/articles/reranking-in-rag-why-your-top-k-results-are-probably-wrong/">RAG reranking guide</a> explains the two-stage architecture. Cross-encoder reranking does not apply if the relevant document never enters the candidate set, and the common misuse is tuning the reranker while ignoring first-stage recall.</p>
    <p>A useful diagnosis records the relevant document’s position before and after reranking. That separates a reranker that fails to reorder a good candidate from a retriever that never supplied one.</p>
    <h3>Reranking depth is a budget decision</h3>
    <p>Scoring more candidates gives the cross-encoder more opportunities to recover the best passage, but the request cost grows with the number and length of pairs. Documents may need trimming or passage-level scoring to fit the model input.</p>
    <p>Evaluation should separate candidate recall from reranker ordering. If the answer-bearing passage appears in the candidate set but finishes too low, the reranker is implicated; if it never appears, changing the cross-encoder cannot fix the retrieval failure.</p>
  title: Cross-Encoder Reranking in RAG Systems
  description: A cross-encoder reads a query and candidate together to score relevance after first-stage retrieval.
  related_terms:
