- name: Flow Engineering
  slug: flow-engineering
  opening_definition: Flow engineering is the practice of decomposing an LLM task into an explicit sequence of generation, execution, checking, and revision steps. It applies when intermediate artifacts can be tested or inspected and a controlled workflow is more reliable than one model call; it does not require the model to choose its own route.
  body_html: |
    <h2>AlphaCodium gave the pattern a memorable name</h2>
    <p>The term was popularized by the <a href="https://arxiv.org/abs/2401.08500">AlphaCodium work on code generation</a>, which used a staged process rather than asking a model to solve a programming problem in one pass. The broader idea is simple: move reliability work out of a heroic prompt and into an observable sequence.</p>
    <p>A flow can collect requirements, draft an artifact, run a deterministic check, return the failure, and ask for a bounded revision. The checker adds information only when it tests something the generation step did not assume.</p>
    <h2>Deterministic orchestration separates a flow from an agent</h2>
    <p>In a flow, application code usually determines the next stage. In an agentic loop, the model may choose the next action from the current state.</p>
    <p>Chain-of-thought is internal reasoning, while flow engineering produces external artifacts and transitions that the host can inspect.</p>
    <h2>A schema repair flow has an honest stopping condition</h2>
    <p>For structured extraction, one stage produces JSON, a validator checks it against a schema, and a repair stage receives the actual validation errors. The workflow stops when validation passes or a retry limit is reached.</p>
    <p>The <a href="/articles/agentic-workflow-playbook/">agentic workflow playbook</a> shows a larger delivery flow with human review. Flow engineering is unnecessary when a deterministic parser already solves the task, and the common misuse is adding model stages that merely restate the same unchecked output.</p>
    <h2>The artifact between stages is the real interface</h2>
    <p>A useful flow specifies what each stage receives, what it must return, and which failure moves the process elsewhere. Passing a free-form transcript between every stage makes the sequence difficult to test and allows an early error to spread invisibly.</p>
    <p>Structured artifacts such as a requirements list, patch, test report, or citation map make the handoff inspectable. The flow earns its extra calls only when a later stage can reject or improve an earlier artifact using new information.</p>
  title: Flow Engineering for LLM Applications
  description: Flow engineering involves designing iterative, multi-step LLM architectures rather than
    relying on a single zero-shot prompt.
  short_definition: The practice of designing deterministic, multi-step architectures where an LLM's output
    is iteratively refined, tested, and corrected through a predefined pipeline.
  long_definition: 'Popularized by projects like AlphaCodium, flow engineering assumes that LLMs are relatively
    weak at zero-shot, complex reasoning but exceptionally strong when forced to iterate. Instead of writing
    one massive prompt hoping for the perfect output, flow engineers design a state machine. The LLM is
    forced through a sequence: generating a plan, writing draft code, running that code against a compiler,
    reading the error trace, and attempting a fix. By rigidly structuring this ''flow'', developers can
    dramatically increase the reliability and performance of an underlying model without needing to upgrade
    to a more expensive, larger parameter model.'
  how_it_works: "A classic flow engineering pipeline for code generation looks like:\n<ul>\n  <li><strong>Phase\
    \ 1 (Reflection):</strong> The model reads the problem and outputs its understanding of the constraints.</li>\n\
    \  <li><strong>Phase 2 (Planning):</strong> The model outlines the algorithmic approach without writing\
    \ syntax.</li>\n  <li><strong>Phase 3 (Generation):</strong> The model generates the actual code based\
    \ strictly on the plan.</li>\n  <li><strong>Phase 4 (Execution & Critique):</strong> The code is run\
    \ in a sandbox. A separate prompt passes the execution trace (success or stack trace) back to the\
    \ model for refinement.</li>\n</ul>"
  use_cases:
  - Competitive programming and automated software engineering.
  - Complex data extraction where the schema must be validated iteratively.
  - High-stakes content generation requiring rigorous fact-checking loops.
  related_terms:
