- name: Agentic Router
  slug: agentic-router
  opening_definition: An agentic router is a decision layer that directs an incoming request to a model, agent, tool, workflow, or human path. It applies when destinations have meaningfully different capabilities, costs, permissions, or failure modes; it adds needless complexity when one destination can handle the full request set under the same policy.
  body_html: |
    <h2>Routing separates task selection from task execution</h2>
    <p>Agentic routing is an architectural pattern rather than a single named algorithm. It emerged as LLM systems gained specialized models, tools, and agents that should not all receive every request.</p>
    <p>The router solves selection; the chosen destination performs the work.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">ROUTE OR ESCALATE</span><strong>The router chooses a policy-compatible destination</strong><small>Execution begins only after selection.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Read the request and known policy fields</strong><small>Preserve identity, permissions, and the original task.</small></div></div>
        <div class="flowchart-root"><div class="flowchart-node"><strong>Resolve explicit routes first</strong><small>Use ordinary code when a stable field already decides.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">destination is supported</span><div class="flowchart-node"><strong>Dispatch with the original request</strong><small>The selected executor receives the evidence behind the route.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">route is uncertain</span><div class="flowchart-node"><strong>Clarify or escalate</strong><small>Do not hide uncertainty behind the top predicted label.</small></div></div>
        </div>
        <p class="flowchart-note">The router owns destination choice. The selected model, tool, workflow, or person owns execution.</p>
      </div>
    </div>
    <h3>A router is not a planner or a mixture-of-experts gate</h3>
    <p>A planner decomposes one task into steps. A tool selector chooses an operation inside an agent loop.</p>
    <p>A mixture-of-experts gate activates internal model components, while an agentic router chooses among externally visible execution paths.</p>
    <p>These layers may coexist, but their metrics differ. A router is judged by destination choice, a planner by the adequacy of its decomposition, and an executor by the result it produces.</p>
    <h3>Rules should win when the boundary is already explicit</h3>
    <p>If a request carries a product identifier, region, or user-selected workflow, ordinary code can route it without a model. A learned classifier earns its cost only for ambiguity the available fields do not resolve.</p>
    <p>Hybrid routing often uses rules for permissions and known cases, then a model for the remainder. That keeps safety decisions deterministic while preserving flexibility for natural-language intent.</p>
    <h2>Routing errors have asymmetric costs</h2>
    <p>Sending a simple question to an expensive general model wastes money, but sending a refund request to an under-authorized answer bot can block the user. Evaluation should weight each error by what the wrong destination can do, not report accuracy alone.</p>
    <h3>Support triage makes the failure cost visible</h3>
    <p>A billing question can go to a read-only account agent, while a refund request must take a path with stronger authentication and an approval step. Routing both to the same broad agent increases its permissions and makes failures harder to contain.</p>
    <p>The <a href="/articles/multi-agent-vs-single-agent-tradeoffs/">single-agent versus multi-agent analysis</a> helps decide whether those destinations should exist at all. The common misuse is adding an LLM classifier where a stable field or explicit user choice would route more reliably.</p>
    <h3>A fallback path must preserve the original request</h3>
    <p>When the router is uncertain, it can ask a clarifying question, choose a constrained general path, or escalate to a human. Silently choosing the top label hides uncertainty and makes later failures look like executor failures.</p>
    <p>The fallback should receive the original request and the router’s evidence, not only its predicted label. That preserves the information needed to correct a bad route.</p>
  title: 'Agentic Routers: Optimizing Multi-Agent Workflows'
  description: An agentic router directs a request to a model, agent, tool, workflow, or human path under an explicit policy.
  related_terms:
