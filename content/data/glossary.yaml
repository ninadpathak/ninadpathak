    slug: semantic-caching
  last_updated: '2026-08-17'
- name: JSON Mode vs. Structured Outputs
  slug: json-mode-vs-structured-outputs
  opening_definition: >-
    JSON mode is a model setting intended to produce syntactically valid JSON, while structured outputs constrain a response to a supplied schema. The distinction applies when an application needs machine-readable model output: JSON mode addresses parsing, whereas structured outputs also address required fields, types, enums, and nesting defined by that schema.
  body_html: |
    <h2>Valid JSON can still be the wrong object</h2>
    <p>Provider APIs first offered JSON-focused generation to prevent prose around a machine-readable response. Schema-constrained structured outputs tightened the contract by limiting generation to shapes allowed by a developer-supplied schema.</p>
    <p>JSON mode can return <code>{"temperature":"warm"}</code> when the application expects a numeric Celsius field. The text parses, but it violates the application contract.</p>
    <p>A schema can require <code>temperature_c</code> as a number and reject undeclared fields.</p>
    <table>
      <thead><tr><th>Requirement</th><th>JSON mode</th><th>Structured outputs</th></tr></thead>
      <tbody>
        <tr><td>Valid JSON syntax</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Required fields and types</td><td>Application must validate them</td><td>Generation is constrained to the supported schema</td></tr>
        <tr><td>Enum and nesting contract</td><td>Not guaranteed by JSON syntax</td><td>Constrained when the provider supports those schema features</td></tr>
        <tr><td>Factual correctness</td><td>Not guaranteed</td><td>Not guaranteed</td></tr>
      </tbody>
    </table>
    <h3>Function calling adds an operation to the schema</h3>
    <p><a href="/glossary/tool-calling/">Tool calling</a> uses structured arguments to request a named operation. A structured response may simply be returned to the application without invoking anything.</p>
    <p>Validation after generation is another option, but it may require repair or retry when the model produces an invalid shape.</p>
    <h3>Schema compliance is not semantic correctness</h3>
    <p>A response can match every type and still contain the wrong customer identifier or an unsupported conclusion. The host must validate permissions, ranges, referential integrity, and business rules that JSON Schema does not prove.</p>
    <p>The <a href="/articles/structured-outputs-llms-json-mode-function-calling/">structured outputs guide</a> compares the API patterns in depth. JSON mode is enough when any valid JSON value is acceptable, while structured outputs fit stable contracts.</p>
    <p>The common misuse is presenting schema compliance as proof that the underlying facts are correct.</p>
    <h3>Refusals and incomplete generations need a separate path</h3>
    <p>An API may return a refusal or stop before completing a schema-constrained object. Application code should inspect the provider’s finish state and refusal representation before attempting to parse ordinary output.</p>
    <p>Schema versions also need coordination with consumers. Tightening an enum or making a field required can break a downstream client even when the model follows the new contract perfectly.</p>
  title: JSON Mode vs. Structured Outputs in LLMs
  description: JSON mode targets valid JSON syntax, while structured outputs constrain a response to a supported schema.
  related_terms:
  - name: Tool Calling
    slug: tool-calling
