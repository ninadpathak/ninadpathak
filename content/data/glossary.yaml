- name: Matryoshka Representation Learning (MRL)
  slug: matryoshka-representation-learning
  opening_definition: Matryoshka Representation Learning is a training method that makes prefixes of one embedding vector useful at several dimensionalities. It applies when a model was trained with nested representation objectives and a system needs flexible storage or multi-stage retrieval; arbitrary truncation of a conventional embedding is not Matryoshka representation learning.
  body_html: |
    <h2>One vector is trained to contain nested resolutions</h2>
    <p>Aditya Kusupati and coauthors <a href="https://arxiv.org/abs/2205.13147">introduced Matryoshka Representation Learning in 2022</a>. The method trains predictive representations at multiple prefix lengths, borrowing its name from nesting dolls.</p>
    <p>Earlier dimensions must carry a useful coarse representation while later dimensions add detail.</p>
    <p>A system can index a shorter prefix for a broad candidate search and retain the longer vector for a more precise second pass. That flexibility comes from the training objective, not from the array-slicing operation itself.</p>
    <h2>Truncation, quantization, and dimensionality reduction are not interchangeable</h2>
    <p>Truncation discards trailing dimensions. <a href="/glossary/product-quantization/">Product quantization</a> compresses vector subspaces into codebook identifiers, while a separately learned dimensionality-reduction transform maps vectors into a new space.</p>
    <p>Each changes storage and retrieval behavior differently.</p>
    <h2>A two-stage catalog search shows the intended use</h2>
    <p>A catalog can search compact prefixes to retrieve a broad candidate set, then rescore those candidates with longer embeddings from the same MRL model. The design makes sense only after recall is evaluated at both stages on representative queries.</p>
    <p>The <a href="/articles/embedding-models-compared/">embedding model guide</a> covers model selection and vector dimensions. The common misuse is chopping any embedding to a convenient size and assuming the result preserves meaning because an MRL-trained model could do so.</p>
    <h2>The prefix length becomes a deployment parameter</h2>
    <p>Choosing a shorter prefix can reduce index storage and distance-computation work, but the effect depends on the model, corpus, and retrieval task. A product-name lookup may tolerate a compact representation that loses distinctions needed for legal or scientific search.</p>
    <p>The useful comparison holds the model and evaluation queries constant, then measures recall as dimensions are removed. A smaller vector is not automatically cheaper end to end if lower recall forces a much larger candidate set or reranking stage.</p>
  title: Matryoshka Representation Learning (MRL) in Vector Search
  description: MRL is a training technique that allows vector embeddings to be truncated without losing
    their core semantic meaning.
  short_definition: A technique for training embedding models so that the most critical semantic information
    is front-loaded into the earliest dimensions of the vector, allowing the vector to be truncated to
    save space without catastrophic accuracy loss.
  long_definition: In standard embedding models, semantic meaning is distributed equally across all dimensions
    (e.g., all 1,536 dimensions in an OpenAI vector). If you truncate the vector to save database space,
    the representation is destroyed. Matryoshka Representation Learning (MRL) forces the model to learn
    representations at multiple granularities simultaneously during training—like Russian nesting dolls.
    This guarantees that the first 256 dimensions contain a highly compressed, accurate summary of the
    full 1536 dimensions. Engineers can use this to perform massive, fast, cheap vector searches using
    the small dimensions, and then rerank the top results using the full dimensions.
  how_it_works: "<ul>\n  <li><strong>Training:</strong> The model's loss function evaluates the accuracy\
    \ of the embedding not just at its full size, but at mathematically smaller subsets (e.g., 2048, 1024,\
    \ 512, 256 dimensions).</li>\n  <li><strong>Truncation at Index Time:</strong> Developers can simply\
    \ slice off the end of the array (e.g., `vector[:256]`) before storing it in a vector database, cutting\
    \ storage costs by 80%.</li>\n  <li><strong>Multi-stage Retrieval:</strong> A fast coarse search is\
    \ done on the 256-dimension vectors, followed by rescoring using the full vectors.</li>\n</ul>"
  use_cases:
  - Dramatically reducing memory overhead in large-scale vector databases.
  - Deploying vector search on edge devices with limited memory constraints.
  related_terms:
  - name: Cross-Encoder Reranking
    slug: cross-encoder-reranking
  - name: Product Quantization (PQ)
    slug: product-quantization
  last_updated: '2026-08-17'
- name: Cross-Encoder Reranking
  slug: cross-encoder-reranking
  opening_definition: Cross-encoder reranking is a search stage in which one model reads a query and a candidate document together and assigns that pair a relevance score. It applies after a faster retriever has produced a manageable candidate set, especially when relevance depends on exact wording, negation, or relationships that independent embeddings may miss.
  body_html: |
    <h2>Joint attention spends more work on fewer candidates</h2>
    <p>A cross-encoder places the query and one candidate in the same model input. Because their tokens can interact through attention, the model can judge details that a single geometric comparison between independently produced vectors may hide.</p>
    <p>The cost is repeated inference: every query-candidate pair needs a forward pass. That makes cross-encoders natural rerankers and poor first-stage retrievers for a large collection.</p>
    <h2>A negated requirement can reverse the vector order</h2>
    <p>For the query “authentication without API keys,” a semantically similar API-key guide may rank above a page about workload identity. A cross-encoder can inspect the negation and the candidate text together, then move the workload-identity page upward.</p>
    <p>A <a href="/glossary/bi-encoder/">bi-encoder</a> creates reusable vectors for candidate retrieval. A large generative model can also score documents, but generation is not required for the pairwise relevance task.</p>
    <h2>The candidate set limits what reranking can repair</h2>
    <p>The <a href="/articles/reranking-in-rag-why-your-top-k-results-are-probably-wrong/">RAG reranking guide</a> explains the two-stage architecture. Cross-encoder reranking does not apply if the relevant document never enters the candidate set, and the common misuse is tuning the reranker while ignoring first-stage recall.</p>
    <h2>Reranking depth is a budget decision</h2>
    <p>Scoring more candidates gives the cross-encoder more opportunities to recover the best passage, but the request cost grows with the number and length of pairs. Documents may need trimming or passage-level scoring to fit the model input.</p>
    <p>Evaluation should separate candidate recall from reranker ordering. If the answer-bearing passage appears in the candidate set but finishes too low, the reranker is implicated; if it never appears, changing the cross-encoder cannot fix the retrieval failure.</p>
  title: Cross-Encoder Reranking in RAG Systems
  description: A cross-encoder processes a user query and a document simultaneously to output a highly
    accurate relevance score, used in the final stage of RAG.
  short_definition: An architecture where an embedding model processes both the user's query and a target
    document simultaneously through its attention layers to generate a highly precise relevance score.
  long_definition: In standard vector search (Bi-Encoders), the user query and the document are embedded
    separately and compared using simple geometry (Cosine Similarity). While incredibly fast, this misses
    deep linguistic nuances because the words in the query never interact with the words in the document
    during processing. A Cross-Encoder passes the query and the document *together* into a Transformer
    model (e.g., `[CLS] Query [SEP] Document [SEP]`). The self-attention mechanism compares every word
    in the query against every word in the document simultaneously, producing a single, highly accurate
    similarity score. Because this is computationally expensive, it is used strictly as a 'Reranker'—re-evaluating
    only the top 50 results retrieved by the faster Bi-Encoder.
  how_it_works: "<ul>\n  <li><strong>Stage 1 (Retrieval):</strong> A fast Bi-Encoder retrieves the top\
    \ 100 potential documents from a vector database of millions.</li>\n  <li><strong>Stage 2 (Concatenation):</strong>\
    \ The system pairs the exact user query with each of the 100 documents.</li>\n  <li><strong>Stage\
    \ 3 (Cross-Encoding):</strong> A Cross-Encoder model processes each pair, allowing deep contextual\
    \ interactions between the query and document tokens.</li>\n  <li><strong>Stage 4 (Reranking):</strong>\
    \ The model outputs a float score (0 to 1) for each pair. The list is sorted, and the absolute top\
    \ 5 results are sent to the LLM.</li>\n</ul>"
  use_cases:
  - Fixing 'Top-K' retrieval failures in enterprise RAG pipelines.
  - Improving search relevance for highly technical or domain-specific language where exact phrasing matters.
  related_terms:
  - name: Bi-Encoder Architecture
    slug: bi-encoder
  - name: Semantic Chunking
    slug: semantic-chunking
  last_updated: '2026-08-17'
- name: Late Chunking
  slug: late-chunking
  opening_definition: Late chunking is an embedding method that encodes a long document before pooling token representations into chunk vectors. It applies when chunk meanings depend on context elsewhere in the same document and the embedding model can process the required span; it differs from embedding each isolated chunk after splitting the text.
  body_html: |
    <h2>Jina AI moved the split after contextual encoding</h2>
    <p>Florian Günther and coauthors <a href="https://arxiv.org/abs/2409.04701">described late chunking in 2024</a> to preserve document-wide context in chunk embeddings. In an early-chunking pipeline, splitting happens before the transformer sees the text.</p>
    <p>Late chunking lets the transformer contextualize tokens across the longer document first, then pools token ranges that correspond to chunk boundaries.</p>
    <h2>A pronoun reveals what early chunking loses</h2>
    <p>Consider a section that begins, “It retries the request with exponential backoff.” If the product component named in the preceding section is absent from the chunk, an isolated embedding may represent retries but not what performs them.</p>
    <p>Encoding both sections together can carry that antecedent into the later chunk’s token representations.</p>
    <p><a href="/glossary/semantic-chunking/">Semantic chunking</a> chooses boundaries according to topical change. Late chunking changes when embeddings are computed.</p>
    <p>The two techniques can coexist because they solve different problems.</p>
    <h2>Long-document support is a condition, not a footnote</h2>
    <p>The <a href="/articles/how-anthropics-contextual-retrieval-changes-rag-architecture/">contextual retrieval analysis</a> covers a different method that prepends generated context before indexing each chunk. Late chunking is unsuitable when documents exceed the embedding model’s usable context or when each record is already self-contained.</p>
    <p>The common misuse is calling any post-embedding text split late chunking, even though the chunk vectors were never pooled from contextualized token representations.</p>
    <h2>Document boundaries still need a policy</h2>
    <p>Encoding an entire file is not always the right unit. A long collection of unrelated tickets may fit the model window but gain nothing from sharing context, while one chapter split across files may need a larger logical boundary.</p>
    <p>The pipeline must also map each pooled vector back to its exact source span. Without that mapping, retrieval may find a context-aware vector but the application cannot quote or cite the text that the vector represents.</p>
  title: 'Late Chunking: Context-Aware Vector Embeddings'
  description: Late chunking embeds an entire document first before splitting it into chunks, preserving
    global context in vector search.
  short_definition: A RAG optimization where an entire document is processed by the embedding model first
    to capture global context, and only then split into individual searchable chunks.
  long_definition: 'Standard RAG pipelines use ''Early Chunking'': they arbitrarily slice a PDF into 500-word
    blocks, and then embed each block separately. This destroys context—a chunk in the middle of chapter
    3 might lose all reference to the main subject established in chapter 1, making it un-findable in
    a vector search. Late Chunking (pioneered by models like Jina AI''s v2/v3 architecture) solves this
    by passing the *entire* document (up to 8k or 32k tokens) through the Transformer model. The model
    computes contextualized representations for every single token based on the whole document. Only after
    this global contextualization occurs are the tokens pooled together into smaller 500-word chunks for
    storage.'
  how_it_works: "<ul>\n  <li><strong>Global Processing:</strong> A long-context embedding model reads\
    \ the entire document in one pass.</li>\n  <li><strong>Token-Level Embedding:</strong> The model generates\
    \ an embedding for every single token, enriched by the context of the entire text.</li>\n  <li><strong>Boundary\
    \ Definition:</strong> The text is split into chunks (e.g., by paragraph or sentence).</li>\n  <li><strong>Mean\
    \ Pooling:</strong> The token embeddings within each boundary are averaged together to create the\
    \ final chunk vector. The resulting vector inherently 'knows' the broader context of the document\
    \ it came from.</li>\n</ul>"
  use_cases:
  - Processing complex financial reports or legal contracts where individual clauses depend heavily on
    the overarching document theme.
  - Solving the 'lost in the middle' retrieval problem in traditional RAG.
  related_terms:
  - name: Semantic Chunking
    slug: semantic-chunking
  - name: Context Engineering
    slug: context-engineering
  last_updated: '2026-08-17'
- name: GraphRAG
  slug: graphrag
  opening_definition: GraphRAG is a retrieval-augmented generation approach that derives a graph of entities, relationships, or claims from source material and uses graph-based representations during retrieval and answer construction. It applies when questions depend on connections or corpus-wide themes that isolated text chunks do not expose well; it is not a generic name for every RAG system with metadata.
  body_html: |
    <h2>Microsoft’s GraphRAG work targeted corpus-level questions</h2>
    <p>Microsoft Research <a href="https://www.microsoft.com/en-us/research/project/graphrag/overview/">developed GraphRAG</a> to answer questions that require understanding a dataset as a whole, not merely retrieving a few passages similar to a query. Its pipeline extracts a graph from text, identifies communities, and builds summaries that can support broader questions.</p>
    <p>The term is now used loosely across products, so an implementation should state what its nodes and edges mean, how they were extracted, and which retrieval path uses them.</p>
    <h2>A relationship question shows why chunks can be insufficient</h2>
    <p>Suppose incident reports mention a service, its owning team, a dependency, and a sequence of failures across separate documents. Vector search may retrieve individually similar reports.</p>
    <p>A graph can connect the service to the dependency and the team, making the cross-document path explicit.</p>
    <h2>GraphRAG is not a knowledge graph with an LLM attached</h2>
    <p>A knowledge graph may contain curated facts independent of retrieval-augmented generation. Ordinary RAG can answer local factual questions directly from passages, while GraphRAG adds extraction cost and another layer whose errors must be traced back to source text.</p>
    <p>The <a href="/articles/rag-evaluation-metrics-what-actually-matters/">RAG evaluation guide</a> explains why retrieval and answer quality need separate checks. GraphRAG does not apply when direct passage retrieval already answers the task, and the common misuse is treating an extracted edge as a verified fact rather than a claim that still needs provenance.</p>
    <h2>Extraction quality governs every later graph query</h2>
    <p>Entity resolution must decide whether two names refer to the same thing, and relationship extraction must preserve the source that supports each edge. A confident community summary cannot repair a graph that merged two products or reversed a dependency.</p>
    <p>A useful evaluation samples nodes, edges, and summaries against the underlying documents before measuring answer quality. Graph structure is valuable when it exposes a path the question needs, not merely because it produces an impressive visualization.</p>
  title: 'GraphRAG: Knowledge Graphs for Retrieval Augmented Generation'
  description: GraphRAG combines vector search with Knowledge Graphs to allow LLMs to reason across complex
    relationships and entire datasets.
  short_definition: An advanced retrieval technique that extracts entities and relationships from documents
    to build a Knowledge Graph, allowing an LLM to answer complex queries that span across multiple disparate
    documents.
  long_definition: Traditional RAG uses vector similarity to find specific text snippets. If a user asks
    a global question like, 'What are the common themes among all the product complaints last quarter?',
    standard RAG fails because no single text chunk contains that summary. GraphRAG (Knowledge Graph Retrieval-Augmented
    Generation), popularized by Microsoft Research, solves this by running an LLM over the entire dataset
    during the ingestion phase. It extracts 'entities' (e.g., Product X, Bug Y) and their 'relationships'
    (e.g., 'causes'), constructing a massive network graph. When the user queries the system, it traverses
    this graph to pull in connected nodes, enabling true multi-hop reasoning and holistic summarization.
  how_it_works: "<ul>\n  <li><strong>Indexing Phase:</strong> An LLM processes the source documents and\
    \ extracts structured nodes (Entities) and edges (Relationships).</li>\n  <li><strong>Community Detection:</strong>\
    \ The graph is clustered into hierarchical 'communities' based on closely related nodes.</li>\n  <li><strong>Pre-Summarization:</strong>\
    \ The LLM generates a summary for each community ahead of time.</li>\n  <li><strong>Retrieval Phase:</strong>\
    \ When a query is made, the system matches it to the relevant community summaries and graph nodes,\
    \ passing a holistic, interconnected context to the final LLM.</li>\n</ul>"
  use_cases:
  - Answering 'sensemaking' questions that require connecting dots across hundreds of documents.
  - Enterprise search where relationships between employees, projects, and codebases are more important
    than exact keyword matches.
  related_terms:
  - name: Context Engineering
    slug: context-engineering
  - name: Cross-Encoder Reranking
    slug: cross-encoder-reranking
  last_updated: '2026-08-17'
- name: Tool Calling
  slug: tool-calling
  opening_definition: Tool calling is an LLM application pattern in which a model selects a host-provided operation and returns structured arguments for that operation. It applies when the model must request data or an action outside its generated text; the application, not the model, remains responsible for validating the arguments, executing the tool, and returning the result.
  body_html: |
    <h2>A tool call is a request, not an execution</h2>
    <p>Tool calling became a common API capability when model providers exposed function descriptions and JSON Schema parameters alongside a prompt. The capability solved a concrete boundary problem: a model can propose an operation, but only application code has credentials, network access, and authority to perform it.</p>
    <p>The host sends the available tool names and schemas. The model returns a tool choice and arguments, the host validates and executes them, and the tool result enters the next model turn.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">REQUEST LOOP</span><strong>Who owns each step in a tool call?</strong><small>The trust boundary stays in application code.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>User asks for an external action</strong><small>The model receives schemas for allowed tools.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">answerable</span><div class="flowchart-node"><strong>Return text</strong><small>No external operation is needed.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">tool needed</span><div class="flowchart-node"><strong>Return name and arguments</strong><small>This is still untrusted model output.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">invalid</span><div class="flowchart-node"><strong>Reject or repair</strong><small>The host enforces schema and policy.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">valid</span><div class="flowchart-node"><strong>Execute and observe</strong><small>The result returns to the model or user.</small></div></div>
        </div>
        <p class="flowchart-note">A model can ask to delete a record. Only the host should decide whether that request is allowed.</p>
      </div>
    </div>
    <h2>Function calling, structured output, and MCP solve different boundaries</h2>
    <p>Function calling is a provider name for tool calling. <a href="/glossary/json-mode-vs-structured-outputs/">Structured output</a> constrains the shape of a response but does not imply that any function will run.</p>
    <p>The <a href="/glossary/model-context-protocol/">Model Context Protocol</a> standardizes how clients discover and invoke tools across a connection; it does not replace the tool-call loop inside the host.</p>
    <h2>A safe weather lookup has two validation layers</h2>
    <p>Suppose a model returns <code>{"city":"Pune","units":"metric"}</code> for a <code>get_weather</code> tool. Schema validation can reject an unknown unit, while application policy can reject a location the user is not authorized to query.</p>
    <p>A valid JSON object is not proof that the request is safe.</p>
    <p>The <a href="/articles/model-context-protocol-explained/">MCP architecture guide</a> shows how this boundary extends across clients and servers. Tool calling is unnecessary for facts already present in context, and its common misuse is treating a schema-valid request as permission to execute it.</p>
  title: Tool Calling (Function Calling) in LLMs
  description: Tool calling allows LLMs to interact with external APIs by reliably outputting structured
    JSON arguments.
  short_definition: A capability fine-tuned into modern LLMs that allows them to intelligently select
    an external tool and output the exact JSON arguments required to execute it.
  long_definition: LLMs natively output unstructured text. Tool Calling (originally introduced as Function
    Calling by OpenAI) is the process of providing an LLM with a schema of available tools (like a weather
    API or a database query function). The model evaluates the user's prompt, determines if one of the
    tools is necessary to fulfill the request, and instead of replying with conversational text, it halts
    generation and outputs a perfectly structured JSON object matching the tool's expected arguments.
    The application executes the external code using those arguments and feeds the result back into the
    model to generate the final human-readable response.
  how_it_works: "<ul>\n  <li><strong>Schema Injection:</strong> The developer passes a JSON Schema outlining\
    \ the available tools (e.g., `get_weather(location, unit)`) alongside the system prompt.</li>\n  <li><strong>Model\
    \ Decision:</strong> The LLM decides it cannot answer the user query based on internal weights and\
    \ chooses to invoke a tool.</li>\n  <li><strong>JSON Output:</strong> The model outputs a specific\
    \ token (like `<tool_call>`) followed by `{\"location\": \"Seattle\", \"unit\": \"celsius\"}`.</li>\n\
    \  <li><strong>Execution:</strong> The developer's backend intercepts this, runs the actual Python\
    \ code, and appends the result (e.g., `15°C`) to the message history for the LLM to read.</li>\n</ul>"
  use_cases:
  - Empowering autonomous agents to interact with the real world (sending emails, modifying databases).
  - Fetching real-time data that an LLM could not possibly know (stock prices, current news).
  related_terms:
  - name: Agentic Engineering
    slug: agentic-engineering
  - name: Model Context Protocol (MCP)
    slug: model-context-protocol
  last_updated: '2026-08-17'
- name: PagedAttention
  slug: pagedattention
  opening_definition: PagedAttention is a KV-cache memory-management technique introduced by the vLLM project that stores cache blocks in non-contiguous physical memory through an indirection table. It applies to batched autoregressive model serving where variable-length sequences cause fragmentation and duplicated cache data; it does not change the model’s attention semantics or make the context window larger.
  body_html: |
    <h2>vLLM borrowed virtual-memory ideas for the KV cache</h2>
    <p>Woosuk Kwon and coauthors <a href="https://arxiv.org/abs/2309.06180">introduced PagedAttention with vLLM in 2023</a>. Autoregressive serving keeps key and value tensors for earlier tokens, but request lengths are unpredictable.</p>
    <p>Reserving one contiguous region for each sequence wastes memory through over-allocation and fragmentation.</p>
    <p>PagedAttention divides the cache into fixed-size blocks and maps logical blocks for each sequence to available physical blocks. New blocks can be allocated as a sequence grows, and shared prefixes can refer to shared physical data where the runtime supports it.</p>
    <h2>The page table changes placement, not attention</h2>
    <p><a href="/glossary/kv-cache-eviction/">KV-cache eviction</a> discards cached token state under a memory limit. PagedAttention manages where retained state lives.</p>
    <p>Prompt caching reuses prefix computation across requests, while PagedAttention is a serving-time memory layout that can help implement such sharing.</p>
    <h2>Uneven chat lengths create the practical case</h2>
    <p>A batch may contain one short completion and one conversation that continues for many tokens. Block allocation lets the longer request grow without reserving its maximum possible contiguous cache in advance.</p>
    <p>The <a href="/articles/llm-inference-optimization/">inference optimization guide</a> places memory management beside batching and decoding techniques. The common misuse is claiming PagedAttention improves model quality; its purpose is to use serving memory more efficiently while preserving the same attention computation.</p>
    <h2>Block size creates its own tradeoff</h2>
    <p>Smaller blocks can reduce unused space at the end of a sequence but require more block-table entries and management work. Larger blocks reduce bookkeeping while increasing internal waste for short or recently finished sequences.</p>
    <p>The best choice depends on the serving runtime and request-length distribution. A throughput claim without batch behavior and memory utilization does not show whether paging, scheduling, or another change produced the result.</p>
  title: 'PagedAttention: Optimizing LLM Memory Serving'
  description: PagedAttention is the memory management algorithm behind vLLM that fragments the KV cache
    to eliminate memory waste.
  short_definition: An attention algorithm inspired by operating system memory paging that non-contiguously
    stores an LLM's KV cache, dramatically increasing the throughput of AI servers.
  long_definition: During LLM inference, the model stores the state of previously processed tokens in
    the Key-Value (KV) cache to avoid recalculating them. Historically, AI serving frameworks allocated
    a large, contiguous block of GPU memory for the maximum possible length of the request. Because request
    lengths are unpredictable, this led to massive internal memory fragmentation and wasted capacity (often
    up to 60% of GPU memory sitting idle). PagedAttention, introduced by the vLLM project, solves this
    by breaking the KV cache into fixed-size 'blocks' or 'pages' that can be stored non-contiguously anywhere
    in the GPU memory. This allows the server to dynamically allocate exact memory as the sequence grows,
    sharing blocks across multiple concurrent requests.
  how_it_works: "<ul>\n  <li><strong>Virtual Memory:</strong> Like an OS, PagedAttention uses a block\
    \ table to map virtual logical blocks of tokens to physical blocks in the GPU memory.</li>\n  <li><strong>Dynamic\
    \ Allocation:</strong> Memory is allocated on-demand, block by block, rather than pre-allocating the\
    \ theoretical maximum.</li>\n  <li><strong>Copy-on-Write:</strong> When using techniques like parallel\
    \ sampling or beam search, multiple requests can share the exact same physical memory blocks for their\
    \ common prompt prefixes, only allocating new blocks when the generated text diverges.</li>\n</ul>"
  use_cases:
  - Maximizing throughput and reducing costs for high-traffic LLM inference APIs.
  - Efficiently serving complex agentic workflows that require multiple parallel completions from the
    same base prompt.
  related_terms:
  - name: KV Cache Eviction
    slug: kv-cache-eviction
  - name: Test-Time Compute (TTC)
    slug: test-time-compute
  last_updated: '2026-08-17'
- name: KV Cache Eviction
  slug: kv-cache-eviction
  opening_definition: KV-cache eviction is the removal of selected key-value states retained from earlier tokens during autoregressive inference. It applies when a serving system cannot keep the full cache for a long sequence or many concurrent requests; eviction trades memory savings for a risk that later tokens can no longer attend to information the policy removed.
  body_html: |
    <h2>The cache grows once per generated token</h2>
    <p>During autoregressive generation, the model retains key and value tensors from earlier tokens so it does not recompute them for every next token. That cache grows with sequence length and consumes serving memory that could otherwise hold more requests.</p>
    <p>Eviction policies keep a subset of token states according to recency, attention-derived importance, fixed landmarks, or another rule. The engineering question is which information can be removed without damaging the tasks the system must perform.</p>
    <h2>Eviction, compression, and paging solve different constraints</h2>
    <p><a href="/glossary/pagedattention/">PagedAttention</a> changes how retained cache blocks are placed. Quantization stores cache values with fewer bits, while eviction removes token states entirely.</p>
    <p>A smaller context input can avoid creating some states in the first place, but that is context selection rather than cache eviction.</p>
    <h2>A name at the start of a conversation is a hard test</h2>
    <p>If a long support conversation introduces an account identifier early and asks for it again much later, an eviction policy that keeps only recent tokens may lose the relevant state. A credible evaluation varies the position and type of required evidence instead of verifying a fixture constructed to match the policy.</p>
    <p>The <a href="/articles/kv-cache-eviction-accuracy/">KV-cache eviction analysis</a> explains the accuracy risks without presenting an unsupported hardware benchmark. The common misuse is publishing a memory or latency gain without the model, sequence distribution, hardware, policy settings, and task-level quality result needed to interpret it.</p>
    <h2>Attention weight is not the same as future importance</h2>
    <p>A token that receives little attention now may become essential after the topic changes or the user refers back to it. Policies based on recent attention therefore make a prediction about future use, not an objective judgment that a token is irrelevant.</p>
    <p>Evaluation should include delayed references, information near different positions, and tasks that depend on several separated facts. A policy that succeeds only when the fixture places important tokens where the policy already prefers carries no evidence beyond its construction.</p>
  title: KV Cache Eviction Policies
  description: KV Cache eviction drops low-impact tokens from an LLM's memory to handle infinite context
    windows on limited GPU hardware.
  short_definition: Algorithms that selectively delete less important tokens from an LLM's Key-Value cache
    during inference to prevent GPU memory exhaustion during long conversations.
  long_definition: As context windows push past 100k tokens, the memory required to store the Key-Value
    (KV) cache grows linearly and quickly overwhelms even the largest GPUs. KV Cache Eviction policies
    dynamically prune this memory during generation. Based on the observation that attention within an
    LLM is extremely sparse (a model only actually 'looks at' a fraction of the previous tokens to predict
    the next one), these policies drop tokens that receive low attention scores. Techniques like 'Heavy
    Hitter Oracle' (H2O) retain only the most critical tokens (like the system prompt and the most recent
    turns), effectively simulating an infinite context window within a strict memory budget.
  how_it_works: "<ul>\n  <li><strong>Attention Scoring:</strong> During generation, the algorithm monitors\
    \ the attention weights across all tokens in the cache.</li>\n  <li><strong>Heavy Hitters:</strong>\
    \ Tokens that consistently accumulate high attention scores (often the initial instructions or specific\
    \ entities) are marked as 'Heavy Hitters' and preserved.</li>\n  <li><strong>Eviction:</strong> Tokens\
    \ with near-zero attention scores are permanently evicted from the GPU memory.</li>\n  <li><strong>Rolling\
    \ Window:</strong> A fixed sliding window preserves the absolute most recent tokens to maintain immediate\
    \ fluency.</li>\n</ul>"
  use_cases:
  - Running infinite-length chatbots or agents on consumer-grade GPUs (e.g., LocalLLaMA).
  - Processing massive codebases or books where only specific variables and structural boundaries actually
    matter for the final output.
  related_terms:
  - name: PagedAttention
    slug: pagedattention
  - name: Context Engineering
    slug: context-engineering
  last_updated: '2026-08-17'
- name: Semantic Chunking
  slug: semantic-chunking
  opening_definition: Semantic chunking is a document-segmentation method that places boundaries where meaning or topic changes rather than at a fixed character or token interval. It applies when coherent sections vary in length and retrieval quality depends on keeping related statements together; it is unnecessary when the source already provides reliable, task-sized structural units.
  body_html: |
    <h2>The boundary follows a change in meaning</h2>
    <p>A semantic chunker commonly embeds sentences or groups of sentences, compares neighboring representations, and splits where similarity drops. Other implementations use an LLM or discourse model to identify boundaries.</p>
    <p>The name describes the goal, not one standardized algorithm.</p>
    <p>The technique addresses a failure of fixed windows: a boundary can cut a condition away from the instruction it qualifies or combine two unrelated sections merely because they fit the same size limit.</p>
    <h2>An API warning belongs with the step it limits</h2>
    <p>Imagine a procedure whose final sentence warns that token rotation invalidates active sessions. A fixed boundary may place the warning in the next chunk, while a semantic boundary can keep the consequence with the rotation step.</p>
    <p><a href="/glossary/late-chunking/">Late chunking</a> changes when embeddings are computed, not how boundaries are chosen. Recursive chunking follows structural separators, and simple overlap repeats text across adjacent chunks.</p>
    <h2>Coherence does not excuse unbounded chunks</h2>
    <p>The <a href="/articles/how-anthropics-contextual-retrieval-changes-rag-architecture/">contextual retrieval analysis</a> shows how chunk context can be improved at index time. Semantic chunking does not apply when each database record is already atomic, and the common misuse is letting one broad topic produce a chunk too large for precise retrieval.</p>
    <h2>Boundary quality must be tested through retrieval</h2>
    <p>A chunk can read coherently and still be a poor retrieval unit. It may contain several answers, omit a heading that disambiguates the subject, or exceed the amount of text the downstream model can use effectively.</p>
    <p>A representative query set should reveal whether the answer-bearing passage is retrieved and whether the returned chunk includes enough context to support an answer. Average chunk length alone cannot establish that the boundaries are useful.</p>
  title: Semantic Chunking vs. Naive Chunking in RAG
  description: Semantic chunking splits documents dynamically based on sentence embedding distance rather
    than arbitrary character limits.
  short_definition: A method of splitting text for vector databases that evaluates the embedding distance
    between sentences, ensuring that logically coherent thoughts are kept together in a single chunk.
  long_definition: Traditional 'naive' chunking splits documents by an arbitrary character count (e.g.,
    500 tokens). This often slices a complex paragraph in half, destroying the context and guaranteeing
    poor vector retrieval. Semantic chunking solves this by using a lightweight embedding model to measure
    the 'distance' between consecutive sentences. If the distance suddenly spikes, the system recognizes
    a shift in topic and draws the chunk boundary there. This results in dynamically sized chunks that
    map perfectly to the original author's logical boundaries, drastically reducing hallucinations during
    the generation phase of RAG.
  how_it_works: "<ul>\n  <li><strong>Sentence Splitting:</strong> The document is broken down into individual\
    \ sentences.</li>\n  <li><strong>Embedding:</strong> Each sentence is individually embedded into a\
    \ vector.</li>\n  <li><strong>Distance Calculation:</strong> The system calculates the cosine distance\
    \ between Sentence A and Sentence B, then B and C.</li>\n  <li><strong>Boundary Creation:</strong>\
    \ When the distance between two sentences exceeds a predefined threshold (e.g., 95th percentile),\
    \ a chunk boundary is placed between them.</li>\n</ul>"
  use_cases:
  - Processing highly unstructured documents like transcripts or chat logs where formatting cues are missing.
  - Improving recall accuracy in RAG systems built on dense academic papers.
  related_terms:
  - name: Late Chunking
    slug: late-chunking
  - name: Cross-Encoder Reranking
    slug: cross-encoder-reranking
  last_updated: '2026-08-17'
- name: Hypothetical Document Embeddings (HyDE)
  slug: hypothetical-document-embeddings-hyde
  opening_definition: Hypothetical Document Embeddings, or HyDE, is a zero-shot retrieval method that asks a language model to draft a hypothetical answer-like document, embeds that draft, and uses its vector to retrieve real documents. It applies when a short query and relevant passages occupy different language or detail levels; the generated document is a search representation, not evidence.
  body_html: |
    <h2>HyDE bridges the query-document language gap</h2>
    <p>Luyu Gao and coauthors <a href="https://arxiv.org/abs/2212.10496">introduced HyDE in 2022</a> for zero-shot dense retrieval. A user query may be too short or phrased unlike the documents that answer it.</p>
    <p>Generating a plausible document gives the encoder a richer representation that may sit closer to relevant corpus passages.</p>
    <p>The system embeds the generated text, retrieves real documents, and answers from those sources. The hypothetical text has done its job once it has improved the search query.</p>
    <h2>Acronym-heavy documentation creates a useful case</h2>
    <p>For “why does my login expire?”, a hypothetical passage might mention session lifetime, refresh tokens, and token revocation. Those terms can retrieve the correct authentication documentation even when the original question contains none of them.</p>
    <h2>Query expansion may generate terms; HyDE generates a document</h2>
    <p>Traditional query expansion adds related words or alternate queries. HyDE generates answer-shaped prose and embeds it.</p>
    <p>Self-querying retrieval instead extracts structured filters and a semantic query from the request.</p>
    <p>The <a href="/articles/hybrid-search-bm25-vector-search/">hybrid search guide</a> covers another way to handle vocabulary mismatch. HyDE is a poor fit when invented specifics can pull retrieval toward the wrong domain, and the common misuse is quoting the hypothetical document as though a source had said it.</p>
    <h2>The generated text must remain outside the evidence set</h2>
    <p>A safe implementation labels the hypothetical document internally and keeps it separate from retrieved sources. If the generation invents a product name or technical term, retrieval may follow that invention and return a coherent but irrelevant neighborhood.</p>
    <p>Evaluation should compare retrieval with and without HyDE on the same queries, then inspect both gains and regressions. The method earns its extra model call only when it improves access to real answer-bearing documents.</p>
  title: 'HyDE: Hypothetical Document Embeddings for Zero-Shot Retrieval'
  description: HyDE improves vector search by using an LLM to generate a fake perfect answer before searching
    the vector database.
  short_definition: A zero-shot retrieval technique where a user's question is first answered by an LLM
    (hallucinating a hypothetical document), and that hallucinated answer is embedded and used to search
    the vector database.
  long_definition: In standard vector search, you are comparing a short, interrogative user query ('How
    do I configure Redis?') against long, declarative document chunks. These two text formats live in
    different parts of the embedding space, causing low similarity scores. Hypothetical Document Embeddings
    (HyDE) fixes this asymmetry. When a user asks a question, an LLM is prompted to write a fake, hypothetical
    answer based purely on its internal weights. This hallucinated document is mathematically much closer
    to the actual, factual documents stored in the vector database. The system embeds the fake document,
    retrieves the factual documents, and then generates the final, grounded response.
  how_it_works: "<ul>\n  <li><strong>Generation:</strong> The user query is sent to an Instruct LLM.</li>\n\
    \  <li><strong>Hallucination:</strong> The LLM generates a hypothetical, plausible-sounding (but potentially\
    \ factually incorrect) document that answers the query.</li>\n  <li><strong>Embedding:</strong> The\
    \ hypothetical document is encoded into a dense vector.</li>\n  <li><strong>Retrieval:</strong> The\
    \ vector database retrieves the actual, factual documents that are semantically closest to the hallucinated\
    \ text.</li>\n</ul>"
  use_cases:
  - Searching dense technical documentation where the user's vocabulary doesn't match the documentation's
    vocabulary.
  - Zero-shot domain retrieval where the embedding model hasn't been fine-tuned on the specific jargon.
  related_terms:
  - name: Bi-Encoder Architecture
    slug: bi-encoder
  - name: Context Engineering
    slug: context-engineering
  last_updated: '2026-08-17'
- name: Self-Querying Retrieval
  slug: self-querying-retrieval
  opening_definition: Self-querying retrieval is a search pattern in which a model converts a natural-language request into a semantic query plus structured filters for a retrieval system. It applies when the collection has trustworthy metadata and users express constraints such as date, product, author, or region in ordinary language; it does not create metadata the index lacks.
  body_html: |
    <h2>The model translates intent into two search channels</h2>
    <p>A request can contain both a topic and exact constraints. Self-querying retrieval separates them: descriptive language becomes the vector or text query, while explicit constraints become fields in a filter expression.</p>
    <p>The pattern became common in retrieval frameworks as LLMs made natural-language parsing flexible, but the host must restrict the filter grammar and validate field names, operators, and values.</p>
    <h2>“EU incidents after July” should not be one embedding</h2>
    <p>For that request, “incidents” belongs in semantic retrieval, while region equals EU and date after July belong in structured filters. Embedding the entire sentence leaves exact constraints to vector geometry, which is not designed to enforce them.</p>
    <p>Metadata filtering written directly by application code is preferable when the UI already supplies exact fields. <a href="/glossary/tool-calling/">Tool calling</a> may carry the generated search request, but self-querying retrieval describes the translation step.</p>
    <h2>Schema quality sets the ceiling</h2>
    <p>The <a href="/articles/hybrid-search-bm25-vector-search/">hybrid search guide</a> explains how semantic and lexical retrieval can be combined after filtering. Self-querying does not apply when metadata is incomplete or access control is being delegated to model output.</p>
    <p>The common misuse is treating a generated filter as authorization rather than as untrusted input to a policy-enforcing search layer.</p>
    <h2>The allowed query language should be smaller than the database language</h2>
    <p>The model usually needs a restricted set of fields and operators, not arbitrary SQL or a vendor’s full filter syntax. A typed intermediate representation lets the host reject unknown fields and compile allowed expressions safely.</p>
    <p>Ambiguous dates, units, and names need an explicit policy. The system can ask for clarification rather than silently translating “recent” or “enterprise” into a filter that looks precise but was never specified.</p>
  title: 'Self-Querying Retrieval: Combining Metadata and Vector Search'
  description: Self-querying retrieval uses an LLM to dynamically write database filters (SQL/NoSQL) alongside
    generating a vector search query.
  short_definition: An intelligent retrieval mechanism where an LLM parses a user's natural language query
    to automatically extract exact metadata filters (like dates or authors) while simultaneously performing
    a semantic vector search.
  long_definition: Vector similarity is terrible at exact matches. If a user asks, 'Find me marketing
    reports from 2024 about AI,' a pure vector search might return a highly relevant AI report from 2022
    because '2024' is just a minor token. Self-Querying Retrieval solves this by placing an LLM in front
    of the database. The LLM reads the user's intent and translates it into a structured query. It strips
    out 'from 2024' to build a deterministic metadata filter (e.g., `WHERE year = 2024`) and uses the
    remaining phrase ('marketing reports about AI') to perform the semantic vector search. The results
    must pass both the hard filter and the semantic similarity threshold.
  how_it_works: "<ul>\n  <li><strong>Schema Injection:</strong> The LLM is provided with the exact schema\
    \ of the vector database's metadata (e.g., `year: int`, `department: string`).</li>\n  <li><strong>Parsing:</strong>\
    \ The LLM analyzes the user prompt and extracts relevant constraints based on the schema.</li>\n \
    \ <li><strong>Query Construction:</strong> The system builds a composite database query utilizing\
    \ both the structured filters and the dense vector representation of the semantic intent.</li>\n</ul>"
  use_cases:
  - E-commerce search where users mix semantic desires ('a comfortable shoe') with hard constraints ('under
    $100', 'size 10').
  - Enterprise document retrieval requiring strict access control and date-range filtering.
  related_terms:
  - name: Tool Calling
    slug: tool-calling
  - name: Agentic Engineering
    slug: agentic-engineering
  last_updated: '2026-08-17'
- name: Bi-Encoder Architecture
  slug: bi-encoder
  opening_definition: A bi-encoder is a retrieval architecture that encodes a query and each candidate document independently into vectors that can be compared with a distance or similarity function. It applies when a system must search many pre-encoded candidates quickly; it is less suitable when relevance depends on fine-grained interaction between every query token and document token.
  body_html: |
    <h2>Independent encoding makes large retrieval sets practical</h2>
    <p>Bi-encoders became central to semantic search through work such as Sentence-BERT, which adapted transformer representations for efficient similarity comparison. A document vector can be computed once and indexed.</p>
    <p>At query time, the system encodes only the query and searches the stored vectors.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">RETRIEVAL</span><strong>Separate encoders create comparable vectors</strong><small>The candidates do not pass through the model again for every query.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Search request arrives</strong><small>The document collection is already encoded.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">query</span><div class="flowchart-node"><strong>Query encoder</strong><small>Produces one vector at request time.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">documents</span><div class="flowchart-node"><strong>Document encoder</strong><small>Produces reusable vectors at index time.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">compare</span><div class="flowchart-node"><strong>Nearest neighbors</strong><small>A vector index returns a candidate set.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">refine</span><div class="flowchart-node"><strong>Optional reranker</strong><small>A slower model examines the best candidates together with the query.</small></div></div>
        </div>
        <p class="flowchart-note">Independent encoding buys reuse and speed by giving up token-level query-document interaction.</p>
      </div>
    </div>
    <h2>Bi-encoders retrieve; cross-encoders judge pairs</h2>
    <p>A <a href="/glossary/cross-encoder-reranking/">cross-encoder</a> reads a query and candidate together, so its attention layers can model their exact interaction. That usually makes it useful for reranking a small candidate set but too expensive for a first pass over a large corpus.</p>
    <p>HNSW is different again: it is an index that searches vectors, not the model that creates them.</p>
    <h2>The query and document may need different instructions</h2>
    <p>For the query “how do I rotate an API key?”, a bi-encoder can retrieve a credential-rotation guide even when that guide uses different wording. An asymmetric retrieval model may encode the short question and the longer document with different prefixes or encoders because they play different roles.</p>
    <p>The <a href="/articles/embedding-models-compared/">embedding model guide</a> explains the vector representation underneath this search. A bi-encoder is a poor final judge when a tiny qualifier changes relevance, and the common misuse is reading a high cosine similarity as a calibrated probability that a document answers the query.</p>
  title: What is a Bi-Encoder Architecture in NLP?
  description: A Bi-Encoder architecture embeds queries and documents separately, enabling massive, pre-computed
    vector searches.
  short_definition: A neural network architecture where two separate inputs (like a query and a document)
    are passed through an embedding model independently to create two distinct vectors that can be compared
    mathematically.
  long_definition: 'The foundation of modern semantic search is the Bi-Encoder. Unlike Cross-Encoders
    which process two texts together, a Bi-Encoder processes text in isolation. You pass a Wikipedia article
    through the model, and it outputs a vector. Months later, a user types a query; that query is passed
    through the same model to output a second vector. The system then calculates the cosine similarity
    between the two vectors. Because the document vectors can be pre-computed and stored offline in a
    database (like Pinecone or Milvus), Bi-Encoders can search through millions of documents in milliseconds.
    The trade-off is accuracy: because the query and document never ''see'' each other during the neural
    network processing, deep contextual relationships are lost.'
  how_it_works: "<ul>\n  <li><strong>Offline Indexing:</strong> Millions of documents are individually\
    \ passed through the Transformer model to generate dense vectors. These are stored in a vector index.</li>\n\
    \  <li><strong>Online Querying:</strong> A user query is passed through the same Transformer model\
    \ to generate a single vector.</li>\n  <li><strong>Distance Calculation:</strong> The database performs\
    \ Approximate Nearest Neighbor (ANN) search to find the document vectors with the highest cosine similarity\
    \ to the query vector.</li>\n</ul>"
  use_cases:
  - The primary retrieval mechanism (Stage 1) in almost all RAG applications.
  - Semantic deduplication of massive datasets.
  related_terms:
  - name: Cross-Encoder Reranking
    slug: cross-encoder-reranking
  - name: Matryoshka Representation Learning (MRL)
    slug: matryoshka-representation-learning
  last_updated: '2026-08-17'
- name: Product Quantization (PQ)
  slug: product-quantization
  opening_definition: Product quantization is a lossy vector-compression method that splits a vector into sub-vectors and represents each sub-vector by the identifier of a nearby learned centroid. It applies when storing or scanning full-precision embeddings is too expensive and approximate distance estimates are acceptable; the codebooks must be trained on representative vectors.
  body_html: |
    <h2>Subspace codebooks replace floating-point coordinates</h2>
    <p>Product quantization divides each vector into equal subspaces. A clustering step learns a codebook for each subspace, and an indexed vector stores the nearest centroid identifier from every codebook instead of all original coordinates.</p>
    <p>At search time, the system estimates distances through lookup tables built from the query and those centroids. Compression saves memory and bandwidth at the cost of quantization error.</p>
    <h2>A toy code shows the storage shape</h2>
    <p>If a vector is divided into four sub-vectors and each codebook has entries addressed by one byte, the compressed representation contains four centroid identifiers plus any index overhead. The example explains the shape, not a universal compression ratio, because production choices depend on dimension, codebook size, and metadata.</p>
    <h2>PQ compresses vectors; HNSW navigates neighbors</h2>
    <p><a href="/glossary/hierarchical-navigable-small-world-hnsw/">HNSW</a> is a graph index, while PQ is an encoding. Matryoshka representation learning trains useful vector prefixes, and scalar quantization reduces the precision of individual values.</p>
    <p>The <a href="/articles/embedding-models-compared/">embedding model guide</a> explains why dimension and model behavior must be evaluated together. Product quantization is unnecessary when full vectors fit comfortably in memory, and the common misuse is reporting space savings without measuring recall on the compressed index.</p>
    <h2>Codebooks inherit the distribution they learned</h2>
    <p>A codebook trained on one embedding model or domain may represent a changed distribution poorly. Replacing the embedding model, normalizing vectors differently, or adding a distinct document population can make the old centroids a worse approximation.</p>
    <p>Migration planning should therefore include codebook retraining and side-by-side recall checks. Keeping original vectors elsewhere may also be necessary when the system needs exact reranking or future re-encoding.</p>
  title: Product Quantization (PQ) for Vector Compression
  description: Product Quantization is an algorithmic technique used to compress dense vectors, reducing
    memory usage in large-scale databases.
  short_definition: A highly efficient lossy compression algorithm used in vector databases to drastically
    reduce the memory footprint of embeddings while maintaining fast nearest-neighbor search capabilities.
  long_definition: Storing 100 million dense vectors (like OpenAI's 1536-dimensional float32 arrays) requires
    hundreds of gigabytes of expensive RAM. Product Quantization (PQ) is the mathematical solution to
    this infrastructure bottleneck. Instead of storing the exact 1536-dimensional point in space, PQ splits
    the vector into smaller sub-vectors. It then runs a clustering algorithm (like k-means) on these sub-vectors
    to find a predefined set of 'centroids' (a codebook). Every vector is then replaced by the short ID
    of the centroid it is closest to. This reduces the memory footprint of a vector by up to 97%, allowing
    massive vector indexes to fit entirely in memory for millisecond retrieval times, at the cost of a
    slight drop in recall accuracy.
  how_it_works: "<ul>\n  <li><strong>Vector Splitting:</strong> A high-dimensional vector is divided into\
    \ equal-sized sub-vectors.</li>\n  <li><strong>Codebook Generation:</strong> The system trains a k-means\
    \ clustering model on the sub-vectors to create a 'codebook' of representative points.</li>\n  <li><strong>Quantization:</strong>\
    \ The actual vector values are discarded and replaced with the integer ID of the nearest codebook\
    \ entry.</li>\n  <li><strong>Asymmetric Distance Computation (ADC):</strong> During a search, the\
    \ uncompressed user query vector is compared against the compressed document vectors using a pre-calculated\
    \ distance lookup table, ensuring rapid execution.</li>\n</ul>"
  use_cases:
  - Scaling vector databases from millions to billions of documents without proportionally scaling RAM
    costs.
  - Deploying semantic search capabilities on edge devices or mobile phones.
  related_terms:
  - name: Matryoshka Representation Learning (MRL)
    slug: matryoshka-representation-learning
  - name: Hierarchical Navigable Small World (HNSW)
    slug: hierarchical-navigable-small-world-hnsw
  last_updated: '2026-08-17'
- name: Hierarchical Navigable Small World (HNSW)
  slug: hierarchical-navigable-small-world-hnsw
  opening_definition: Hierarchical Navigable Small World, or HNSW, is a graph-based approximate nearest-neighbor index for finding vectors close to a query vector. It applies when exact comparison against every stored vector is too costly and the system can trade some recall for faster search, additional index memory, and slower index construction.
  body_html: |
    <h2>HNSW turns vector search into graph navigation</h2>
    <p>Yury Malkov and Dmitry Yashunin <a href="https://arxiv.org/abs/1603.09320">introduced HNSW in their 2016 paper</a> as a multilayer proximity graph. The design addressed a scaling problem in nearest-neighbor search: comparing a query with every vector gives exact results, but the work grows directly with the collection.</p>
    <p>HNSW assigns some points to sparse upper layers and keeps progressively more points in lower layers. Search starts high, makes large moves toward the query, then descends and refines the candidate set in denser layers.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">SEARCH PATH</span><strong>Coarse navigation first, local search second</strong><small>The graph avoids a full scan but does not promise the exact nearest neighbor.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Enter at a sparse upper layer</strong><small>Begin from the graph entry point.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">better neighbor</span><div class="flowchart-node"><strong>Move across the layer</strong><small>Follow an edge closer to the query.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">local minimum</span><div class="flowchart-node"><strong>Descend one layer</strong><small>Continue from the best point found so far.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">narrow search</span><div class="flowchart-node"><strong>Lower recall, less work</strong><small>A smaller candidate beam explores fewer paths.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">wide search</span><div class="flowchart-node"><strong>Higher recall, more work</strong><small>A larger candidate beam explores more paths.</small></div></div>
        </div>
        <p class="flowchart-note">The operational choice is not “HNSW or accuracy.” It is where to set the recall, latency, memory, and build-time tradeoff.</p>
      </div>
    </div>
    <h2>The index is not the embedding model</h2>
    <p>A <a href="/glossary/bi-encoder/">bi-encoder</a> creates vectors; HNSW searches them. Product quantization compresses vectors and may be combined with an index, while exact k-nearest-neighbor search compares the query against the full collection.</p>
    <p>These components answer different questions and should not be presented as interchangeable vector databases.</p>
    <h2>A filtered support search exposes the tradeoff</h2>
    <p>Imagine an index of support articles where the query must match both semantic meaning and a product-version filter. If filtering leaves few eligible graph nodes, an aggressive search setting can miss the best valid result.</p>
    <p>Increasing search breadth may recover it, but the right setting must be measured on representative queries rather than copied from a vendor default.</p>
    <p>The <a href="/articles/local-wasm-vector-benchmarks/">browser vector-search analysis</a> discusses index choices without treating its earlier benchmark framing as proof. HNSW is unnecessary for a small collection that exact search handles comfortably, and its common misuse is quoting a latency number without the dataset, hardware, recall target, index parameters, and filter behavior that produced it.</p>
  title: 'HNSW Algorithm: Fast Vector Search Explained'
  description: HNSW is the dominant graph-based algorithm used by vector databases to perform fast approximate
    nearest neighbor (ANN) searches.
  short_definition: A graph-based algorithm that organizes vector embeddings into multiple layers, enabling
    sub-millisecond Approximate Nearest Neighbor (ANN) search across billions of data points.
  long_definition: Performing an exact search (k-NN) on a vector database requires comparing the user's
    query against every single document vector in the system. This 'brute force' approach does not scale.
    Hierarchical Navigable Small World (HNSW) is the algorithmic engine that powers almost every modern
    vector database (Pinecone, Weaviate, Qdrant). It builds a multi-layered graph where the bottom layer
    contains every single vector connected to its nearest neighbors. The higher layers contain progressively
    fewer vectors with longer links—acting like an express highway system. When a query is made, HNSW
    starts at the sparse top layer, quickly zooms into the general neighborhood of the query, and then
    drops down to the dense bottom layer to find the exact nearest neighbors.
  how_it_works: "<ul>\n  <li><strong>Graph Construction:</strong> Vectors are inserted into a multi-layered\
    \ graph. Short connections reside at the bottom (local roads), and long connections reside at the\
    \ top (highways).</li>\n  <li><strong>Routing Phase:</strong> A search begins at the top layer. The\
    \ algorithm traverses the graph to find the node closest to the query vector.</li>\n  <li><strong>Descent:</strong>\
    \ Once it can no longer get closer on the top layer, it drops down to the next layer and repeats the\
    \ process.</li>\n  <li><strong>Local Search:</strong> At the bottom layer, a localized search occurs\
    \ among the dense neighborhood to return the final 'Approximate' Nearest Neighbors.</li>\n</ul>"
  use_cases:
  - Powering low-latency semantic search in production RAG systems.
  - Real-time recommendation engines for e-commerce and streaming platforms.
  related_terms:
  - name: Product Quantization (PQ)
    slug: product-quantization
  - name: Bi-Encoder Architecture
    slug: bi-encoder
  last_updated: '2026-08-17'
- name: ReAct Prompting
  slug: react-prompting
  opening_definition: ReAct prompting is an agent pattern that interleaves reasoning steps with actions and observations from an external environment. It applies when a task cannot be completed from the initial prompt alone and the model must use new evidence to choose later steps; it does not describe every tool-using assistant or every hidden reasoning process.
  body_html: |
    <h2>ReAct joined reasoning traces to environmental feedback</h2>
    <p>Shunyu Yao and coauthors <a href="https://arxiv.org/abs/2210.03629">introduced ReAct in a 2022 paper</a> to combine two capabilities that had often been studied separately: reasoning over a task and acting to gather information. An action produces an observation, and that observation changes the next reasoning step.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">CONTROL LOOP</span><strong>A ReAct trajectory alternates decisions and evidence</strong><small>The observation must influence what happens next.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Task and current context</strong><small>The model decides whether it has enough evidence.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">enough</span><div class="flowchart-node"><strong>Answer</strong><small>Stop without another action.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">missing evidence</span><div class="flowchart-node"><strong>Choose an action</strong><small>Search, inspect, calculate, or call another allowed tool.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">observation</span><div class="flowchart-node"><strong>Update the task state</strong><small>Use the result in the next decision.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">failure</span><div class="flowchart-node"><strong>Recover or stop</strong><small>A bounded policy handles errors and limits.</small></div></div>
        </div>
        <p class="flowchart-note">A fixed sequence of calls is a workflow. ReAct specifically makes the next step depend on the latest observation.</p>
      </div>
    </div>
    <h2>ReAct is not a synonym for chain of thought or tool calling</h2>
    <p>Chain-of-thought prompting elicits intermediate reasoning but may never touch an external system. <a href="/glossary/tool-calling/">Tool calling</a> supplies an action interface but does not define the surrounding decision loop.</p>
    <p>Plan-and-Solve creates a plan before execution, whereas ReAct can revise its direction after each observation.</p>
    <h2>A documentation lookup shows when the loop earns its cost</h2>
    <p>Suppose an agent must identify the current authentication parameter in an API. It searches the official reference, observes two versioned pages, checks the version in the user’s configuration, then answers from the matching page.</p>
    <p>Each observation removes an ambiguity that the initial prompt could not resolve.</p>
    <p>The <a href="/articles/agent-loop-anatomy/">agent-loop anatomy</a> covers the production controls around this pattern. ReAct is unnecessary when one deterministic query returns the needed fact, and the common misuse is exposing verbose reasoning text as if it were an audit trail.</p>
    <p>Tool inputs, observations, and state transitions are the inspectable evidence.</p>
  title: 'ReAct Prompting: Reason and Act Framework'
  description: ReAct is a prompting paradigm that forces an LLM to explicitly output its reasoning trace
    before executing an action or tool call.
  short_definition: An agentic framework that strictly interleaves internal reasoning (Chain of Thought)
    with external actions (Tool Calling), allowing an LLM to solve complex, multi-step problems autonomously.
  long_definition: If you ask an LLM a complex question that requires an external tool, it will often
    hallucinate an answer immediately or execute the wrong tool. The ReAct (Reason + Act) paradigm, introduced
    by researchers at Princeton and Google, forces the model into a strict cognitive loop. The model is
    prompted to first output a `Thought:` detailing its current understanding of the problem and what
    it needs to do next. Only then does it output an `Action:` (like querying a database). Once the database
    returns an `Observation:`, the model loops back to `Thought:`. This explicit externalization of the
    planning process drastically reduces hallucinations and gives developers a clear trace of the agent's
    logic.
  how_it_works: "The agent is trapped in a loop until it outputs an answer:\n<ul>\n  <li><strong>Thought:</strong>\
    \ The agent assesses the current state. (e.g., 'I need to find the CEO's email. I should search the\
    \ directory.')</li>\n  <li><strong>Action:</strong> The agent calls a tool. (e.g., <code>search_directory(\"\
    CEO\")</code>)</li>\n  <li><strong>Observation:</strong> The system returns the tool's output. (e.g.,\
    \ 'Result: jane.doe@company.com')</li>\n  <li><strong>Thought:</strong> The agent evaluates the observation.\
    \ (e.g., 'I have the email. I can answer the user now.')</li>\n</ul>"
  use_cases:
  - Building autonomous web-research agents.
  - Creating conversational interfaces for complex internal databases.
  related_terms:
  - name: Agentic Engineering
    slug: agentic-engineering
  - name: Tool Calling
    slug: tool-calling
  last_updated: '2026-08-17'
- name: Plan-and-Solve Framework
  slug: plan-and-solve-framework
  opening_definition: Plan-and-Solve is a prompting framework that asks a language model to create a multi-step plan before carrying out the plan. It applies to tasks where omitted intermediate steps are a major source of error and the work can be decomposed in advance; it is weaker when new observations should continually change the route.
  body_html: |
    <h2>Plan-and-Solve targets missing-step errors</h2>
    <p>Lei Wang and coauthors <a href="https://arxiv.org/abs/2305.04091">introduced Plan-and-Solve prompting in 2023</a> as an extension of zero-shot chain-of-thought prompting. Their diagnosis was specific: a model can make calculation or semantic mistakes, but it can also fail simply because it leaves out a necessary reasoning step.</p>
    <p>Planning makes the intended decomposition explicit before execution begins.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">DECOMPOSITION</span><strong>Plan first when the task has dependent steps</strong><small>The plan is a checklist for execution, not evidence that the answer is correct.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Read the complete task</strong><small>Identify the required result and constraints.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">stable path</span><div class="flowchart-node"><strong>Write the subtask plan</strong><small>Order dependencies before solving them.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">unknown path</span><div class="flowchart-node"><strong>Gather evidence first</strong><small>Use an adaptive loop when observations determine the route.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">execute</span><div class="flowchart-node"><strong>Solve each subtask</strong><small>Carry forward the intermediate results.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">verify</span><div class="flowchart-node"><strong>Check the final result</strong><small>Compare the answer with the original constraints.</small></div></div>
        </div>
        <p class="flowchart-note">Planning reduces omission risk. It does not validate a false premise or repair a bad intermediate result by itself.</p>
      </div>
    </div>
    <h2>The framework differs from adaptive agent planning</h2>
    <p>ReAct alternates decisions with new observations and can change course during execution. Plan-and-Solve front-loads decomposition, so it fits stable problems better.</p>
    <p>A workflow engine goes further by encoding the steps in software rather than asking a model to invent them each time.</p>
    <h2>A migration checklist is a good fit; incident response is not</h2>
    <p>For an API migration, the model can first list the affected endpoints, authentication changes, compatibility checks, code edits, and tests, then work through that ordered plan. The plan makes a skipped compatibility check visible.</p>
    <p>An outage investigation is different because each log or metric changes the next question. The <a href="/articles/agentic-workflow-playbook/">agentic workflow playbook</a> shows where planning fits inside a broader delivery process.</p>
    <p>The common misuse is treating a polished plan as verification; every executed step still needs evidence.</p>
  title: Plan-and-Solve Architecture for AI Agents
  description: Plan-and-Solve is an agentic architecture that replaces the step-by-step ReAct loop with
    a comprehensive upfront planning phase.
  short_definition: An agentic architecture where a complex objective is broken down into a complete,
    sequential list of sub-tasks before any actual execution or tool calling begins.
  long_definition: While ReAct prompting is great for dynamic problems, it is inherently short-sighted.
    The agent decides its next action based only on its immediate observation, which often leads to infinite
    loops or losing track of the overarching goal. The Plan-and-Solve architecture splits cognitive labor
    into two distinct phases. First, a 'Planner' model receives the user's objective and outputs a rigid,
    step-by-step plan (often a Directed Acyclic Graph of dependencies). Second, a 'Worker' model simply
    executes those steps sequentially, passing the output of step 1 as the input to step 2. This significantly
    reduces API costs and prevents the agent from spiraling off-topic.
  how_it_works: "<ul>\n  <li><strong>Planning Phase:</strong> An LLM writes out a numbered list of sub-tasks\
    \ required to fulfill the user's request.</li>\n  <li><strong>Execution Loop:</strong> A separate\
    \ prompt (or separate specialized agent) is given Task 1 and the necessary tools.</li>\n  <li><strong>State\
    \ Management:</strong> The results of Task 1 are appended to the system memory. Task 2 is then executed\
    \ using the context gained from Task 1.</li>\n  <li><strong>Completion:</strong> Once all tasks in\
    \ the plan are crossed off, a final response is generated.</li>\n</ul>"
  use_cases:
  - Automated software engineering where file creation, coding, and testing must happen in a specific
    order.
  - Complex data analysis pipelines requiring multiple distinct API queries.
  related_terms:
  - name: Agentic Engineering
    slug: agentic-engineering
  - name: ReAct Prompting
    slug: react-prompting
  last_updated: '2026-08-17'
- name: Speculative Decoding
  slug: speculative-decoding
  opening_definition: Speculative decoding is an inference technique in which a faster draft process proposes several tokens and the target model verifies those proposals in parallel while preserving the target model’s output distribution. It applies when draft tokens are accepted often enough to offset proposal and verification overhead; it changes generation speed, not the model’s knowledge or reasoning ability.
  body_html: |
    <h2>Drafting turns one-token steps into candidate runs</h2>
    <p>Several research groups developed speculative decoding methods around 2022 and 2023 to reduce the sequential cost of autoregressive generation. A small model or another draft mechanism proposes a run of tokens.</p>
    <p>The target model evaluates that run in one pass, accepts a valid prefix under the decoding rule, and resumes from the first rejection.</p>
    <p>The method can be lossless with respect to the target distribution when the acceptance and correction procedure is implemented correctly. A plain small-model fallback does not provide that guarantee.</p>
    <h2>Acceptance rate determines whether the draft helps</h2>
    <p>A draft model that predicts common boilerplate well may advance several tokens per target-model verification. If the domain, language, or style makes its proposals diverge, frequent rejection can erase the benefit.</p>
    <p>Quantization reduces numeric precision, batching combines requests, and test-time compute spends more work to improve an answer. Speculative decoding instead tries to produce target-model tokens with fewer sequential target passes.</p>
    <h2>The benchmark needs the whole serving context</h2>
    <p>The <a href="/articles/speculative-decoding-explained/">speculative decoding guide</a> explains the mechanism and evaluation variables. The technique is a poor fit when the target model is already small or verification overhead dominates.</p>
    <p>The common misuse is publishing one speedup without the draft and target models, hardware, batch size, prompt and output lengths, acceptance behavior, and decoding settings.</p>
    <h2>Serving load can change the result</h2>
    <p>A technique that improves single-request latency may compete for compute that a busy server could use for batching other requests. Draft-model memory also reduces the capacity available to the target model and its KV cache.</p>
    <p>The relevant evaluation matches the production objective: time to first token, time per output token, total request latency, or throughput under load. “Faster” is incomplete until the metric and workload are named.</p>
  title: 'Speculative Decoding: Accelerating LLM Inference'
  description: Speculative decoding uses a tiny, fast model to guess the next tokens, which a massive
    model then verifies in parallel.
  short_definition: An inference optimization technique that accelerates text generation by using a small,
    fast 'draft' model to predict multiple upcoming tokens, which are then verified simultaneously by
    the main, larger model.
  long_definition: LLM generation is memory-bandwidth bound. Producing text token-by-token is incredibly
    slow because the GPU has to load the entire massive model's weights into memory just to calculate
    a single word. Speculative Decoding breaks this sequential bottleneck. A tiny, highly efficient 'draft'
    model (e.g., 1B parameters) rapidly guesses the next 5 to 10 tokens. These guessed tokens are then
    passed to the main, massive 'target' model (e.g., 70B parameters). The massive model evaluates all
    5 tokens in parallel in a single forward pass. If it agrees with the draft model's logic, it accepts
    the tokens instantly, essentially generating 5 words for the computational time of 1.
  how_it_works: "<ul>\n  <li><strong>Drafting:</strong> A fast, small model generates a sequence of <em>k</em>\
    \ speculative tokens.</li>\n  <li><strong>Verification:</strong> The large target model processes\
    \ these <em>k</em> tokens in parallel.</li>\n  <li><strong>Acceptance:</strong> The target model compares\
    \ the draft's probabilities against its own. It accepts tokens up to the point where the draft made\
    \ a mistake.</li>\n  <li><strong>Correction:</strong> At the point of the mistake, the target model\
    \ discards the remaining draft tokens and generates the correct token itself, then the loop restarts.</li>\n\
    </ul>"
  use_cases:
  - Reducing latency and Time to First Token (TTFT) in real-time conversational agents.
  - Increasing serving throughput for massive open-source models without sacrificing output quality.
  related_terms:
  - name: PagedAttention
    slug: pagedattention
  - name: Test-Time Compute (TTC)
    slug: test-time-compute
  last_updated: '2026-08-17'
- name: Agentic Router
  slug: agentic-router
  opening_definition: An agentic router is a decision layer that directs an incoming request to a model, agent, tool, workflow, or human path. It applies when destinations have meaningfully different capabilities, costs, permissions, or failure modes; it adds needless complexity when one destination can handle the full request set under the same policy.
  body_html: |
    <h2>Routing separates task selection from task execution</h2>
    <p>Agentic routing is an architectural pattern rather than a single named algorithm. It emerged as LLM systems gained specialized models, tools, and agents that should not all receive every request.</p>
    <p>The router solves selection; the chosen destination performs the work.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">ROUTING POLICY</span><strong>Send the request to the narrowest capable path</strong><small>Capability and permission matter before model preference.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Classify the request and risk</strong><small>Inspect intent, required data, and allowed actions.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">known path</span><div class="flowchart-node"><strong>Choose a specialist</strong><small>Use deterministic rules where the boundary is clear.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">ambiguous</span><div class="flowchart-node"><strong>Clarify or use a general path</strong><small>Do not hide uncertainty behind a confident label.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">allowed</span><div class="flowchart-node"><strong>Dispatch with scoped context</strong><small>Pass only the data and tools the destination needs.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">restricted</span><div class="flowchart-node"><strong>Escalate or refuse</strong><small>Routing must not bypass authorization.</small></div></div>
        </div>
        <p class="flowchart-note">A routing label is not a security decision unless the host enforces the corresponding permissions.</p>
      </div>
    </div>
    <h2>A router is not a planner or a mixture-of-experts gate</h2>
    <p>A planner decomposes one task into steps. A tool selector chooses an operation inside an agent loop.</p>
    <p>A mixture-of-experts gate activates internal model components, while an agentic router chooses among externally visible execution paths.</p>
    <h2>Support triage makes the failure cost visible</h2>
    <p>A billing question can go to a read-only account agent, while a refund request must take a path with stronger authentication and an approval step. Routing both to the same broad agent increases its permissions and makes failures harder to contain.</p>
    <p>The <a href="/articles/multi-agent-vs-single-agent-tradeoffs/">single-agent versus multi-agent analysis</a> helps decide whether those destinations should exist at all. The common misuse is adding an LLM classifier where a stable field or explicit user choice would route more reliably.</p>
  title: 'Agentic Routers: Optimizing Multi-Agent Workflows'
  description: An agentic router acts as a traffic controller, directing user queries to the cheapest
    or most specialized model in a compound AI system.
  short_definition: A lightweight classifier model or programmatic logic layer that analyzes an incoming
    user query and routes it to the specific AI agent, tool, or LLM best suited to handle it.
  long_definition: In a Compound AI System, sending every user query to the most expensive, massive model
    (like GPT-4 or Claude 3.5 Sonnet) is an architectural failure that destroys unit economics. An Agentic
    Router sits at the very edge of the application. When a user sends a prompt, the Router evaluates
    its complexity and intent. If the user asks 'Reset my password', the router sends it to a fast, cheap
    8B parameter model or a deterministic script. If the user asks 'Debug this Python memory leak', the
    router forwards it to the massive, expensive coding model. Routers ensure high system reliability
    while minimizing API costs and latency.
  how_it_works: "<ul>\n  <li><strong>Intent Classification:</strong> The router uses a fast embedding\
    \ model or a small LLM to classify the query into predefined categories.</li>\n  <li><strong>Semantic\
    \ Routing:</strong> If vector similarity is used, the query is routed based on its proximity to known\
    \ problem clusters in the database.</li>\n  <li><strong>Fallback Logic:</strong> If an invoked agent\
    \ fails to solve the problem, the router catches the failure and dynamically re-routes the task to\
    \ a stronger, slower agent.</li>\n</ul>"
  use_cases:
  - Managing multi-agent customer support systems to protect margins.
  - Building robust MoE (Mixture of Experts) style architectures at the application layer.
  related_terms:
  - name: Semantic Caching
    slug: semantic-caching
  last_updated: '2026-08-17'
- name: JSON Mode vs. Structured Outputs
  slug: json-mode-vs-structured-outputs
  opening_definition: >-
    JSON mode is a model setting intended to produce syntactically valid JSON, while structured outputs constrain a response to a supplied schema. The distinction applies when an application needs machine-readable model output: JSON mode addresses parsing, whereas structured outputs also address required fields, types, enums, and nesting defined by that schema.
  body_html: |
    <h2>Valid JSON can still be the wrong object</h2>
    <p>Provider APIs first offered JSON-focused generation to prevent prose around a machine-readable response. Schema-constrained structured outputs tightened the contract by limiting generation to shapes allowed by a developer-supplied schema.</p>
    <p>JSON mode can return <code>{"temperature":"warm"}</code> when the application expects a numeric Celsius field. The text parses, but it violates the application contract.</p>
    <p>A schema can require <code>temperature_c</code> as a number and reject undeclared fields.</p>
    <h2>Function calling adds an operation to the schema</h2>
    <p><a href="/glossary/tool-calling/">Tool calling</a> uses structured arguments to request a named operation. A structured response may simply be returned to the application without invoking anything.</p>
    <p>Validation after generation is another option, but it may require repair or retry when the model produces an invalid shape.</p>
    <h2>Schema compliance is not semantic correctness</h2>
    <p>A response can match every type and still contain the wrong customer identifier or an unsupported conclusion. The host must validate permissions, ranges, referential integrity, and business rules that JSON Schema does not prove.</p>
    <p>The <a href="/articles/structured-outputs-llms-json-mode-function-calling/">structured outputs guide</a> compares the API patterns in depth. JSON mode is enough when any valid JSON value is acceptable, while structured outputs fit stable contracts.</p>
    <p>The common misuse is presenting schema compliance as proof that the underlying facts are correct.</p>
    <h2>Refusals and incomplete generations need a separate path</h2>
    <p>An API may return a refusal or stop before completing a schema-constrained object. Application code should inspect the provider’s finish state and refusal representation before attempting to parse ordinary output.</p>
    <p>Schema versions also need coordination with consumers. Tightening an enum or making a field required can break a downstream client even when the model follows the new contract perfectly.</p>
  title: JSON Mode vs. Structured Outputs in LLMs
  description: Understanding the technical difference between requesting JSON from an LLM and enforcing
    guaranteed structured outputs via constrained decoding.
  short_definition: JSON Mode heavily biases an LLM to produce valid JSON syntax, whereas Structured Outputs
    mathematically constrain the model's token generation to guarantee the output perfectly matches a
    specific JSON Schema.
  long_definition: For years, engineers struggled to parse LLM text into backend systems. The first solution
    was 'JSON Mode'—a system prompt flag that heavily weighted the model's probability distribution toward
    generating brackets and quotes. While it rarely produced invalid syntax, JSON Mode offered no guarantees
    about the keys and values inside the object; the model could still invent its own schema. 'Structured
    Outputs' (or Constrained Decoding) is a lower-level architectural upgrade. The inference engine converts
    the developer's exact JSON Schema into a formal grammar or state machine. During generation, any token
    that would violate the schema (e.g., trying to output a string when an integer is required) is mathematically
    masked out. Structured Outputs guarantee 100% schema adherence.
  how_it_works: "<ul>\n  <li><strong>JSON Mode:</strong> The developer begs the model in the prompt to\
    \ return JSON. The model usually complies, but might inject conversational filler.</li>\n  <li><strong>Structured\
    \ Outputs:</strong> The developer provides a strict JSON Schema API object. The inference server compiles\
    \ this schema into a Finite State Machine. The LLM is physically incapable of generating tokens outside\
    \ the permitted grammar paths.</li>\n</ul>"
  use_cases:
  - Extracting clean data tables from messy, unstructured PDF invoices.
  - Feeding LLM decisions directly into rigid SQL databases or strongly-typed frontend components.
  related_terms:
  - name: Tool Calling
    slug: tool-calling
  - name: Context Engineering
    slug: context-engineering
  last_updated: '2026-08-17'
- name: DSPy
  slug: dspy
  opening_definition: DSPy is an open-source framework for expressing LLM programs as modules and optimizing their prompts or weights against examples and a metric. It applies when a task can be represented as a repeatable program and evaluated on a development set; it does not remove the need for representative data or a trustworthy objective.
  body_html: |
    <h2>Stanford NLP shifted prompt work into program optimization</h2>
    <p>Omar Khattab and collaborators <a href="https://arxiv.org/abs/2310.03714">introduced DSPy</a> to replace manual prompt tweaking with declarative modules and optimizers. A developer defines the input-output signature and composes operations, then a DSPy optimizer uses examples and a metric to produce instructions, demonstrations, or other parameters for that program.</p>
    <p>The framework addresses a maintenance problem: handwritten prompts become brittle when models, modules, or task requirements change. Recompiling against an evaluation set can adapt the program without editing every instruction by hand.</p>
    <h2>A support classifier needs a metric before an optimizer</h2>
    <p>A DSPy program might map a ticket to a category and urgency. The development examples provide expected labels, while the metric rewards correct category and applies a stronger penalty when urgent tickets are missed.</p>
    <p>The optimizer can only improve what that metric and dataset reveal.</p>
    <h2>DSPy is not an agent framework or automatic truth machine</h2>
    <p><a href="/glossary/flow-engineering/">Flow engineering</a> describes a staged system architecture, while DSPy supplies abstractions for composing and optimizing model calls within such a system. Fine-tuning changes model weights through training; many DSPy optimizers instead search instructions and demonstrations, though the framework can support weight optimization too.</p>
    <p>The <a href="/articles/rag-evaluation-metrics-what-actually-matters/">evaluation metrics guide</a> explains why the objective must reflect the real task. DSPy is unnecessary for a one-off prompt with no evaluation set, and the common misuse is celebrating a higher development score without checking held-out cases for overfitting.</p>
    <h2>Compilation is an experiment with dependencies</h2>
    <p>A compiled DSPy program depends on the optimizer, model, training examples, metric, and search budget used to produce it. Changing the model can change which demonstrations and instructions work, so the compiled artifact should be versioned with those inputs.</p>
    <p>Human review still matters when the metric captures only part of quality. A support answer can satisfy an exact-match label while using a tone, source, or explanation that the scoring function never examined.</p>
  title: 'DSPy: Programming AI Language Models'
  description: DSPy is a framework that treats LLM prompts as compiled code, using machine learning to
    optimize prompts automatically.
  short_definition: An open-source framework developed by Stanford that replaces manual prompt engineering
    with programmatic compilation, allowing developers to write declarative logic that automatically optimizes
    the prompts sent to an LLM.
  long_definition: Building complex LLM applications historically required developers to painstakingly
    tweak the wording of their prompts (e.g., 'Think step by step', 'You are an expert'). If the underlying
    model was changed, all the hardcoded prompts broke. DSPy shifts this paradigm by abstracting the prompt
    away entirely. Developers define modules (like `Retrieve`, `ChainOfThought`) and provide a small dataset
    of desired inputs and outputs. The DSPy 'Compiler' then runs hundreds of variations, scoring the outputs,
    and automatically discovering the mathematically optimal prompt instructions for that specific LLM
    and task. It treats prompting as an optimization problem, not an art form.
  how_it_works: "<ul>\n  <li><strong>Signatures:</strong> The developer defines the input/output behavior\
    \ without writing instructions (e.g., <code>question -> answer</code>).</li>\n  <li><strong>Modules:</strong>\
    \ The developer stitches together pre-built reasoning architectures.</li>\n  <li><strong>Teleprompters\
    \ (Optimizers):</strong> The developer provides a metric (like accuracy). DSPy automatically rewrites\
    \ the internal prompts and updates the system weights until the metric is maximized.</li>\n</ul>"
  use_cases:
  - Building highly robust RAG pipelines that survive underlying model deprecations.
  - Systematically improving the accuracy of complex extraction tasks without manually guessing prompt
    words.
  related_terms:
  - name: Context Engineering
    slug: context-engineering
  - name: Flow Engineering
    slug: flow-engineering
  last_updated: '2026-08-17'
