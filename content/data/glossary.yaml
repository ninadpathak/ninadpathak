- name: Agentic Engineering
  slug: agentic-engineering
  opening_definition: Agentic engineering is the software engineering discipline of building systems in which a language model can choose actions, use tools, inspect results, and continue toward a bounded goal. The term applies when model output changes program state or controls a multi-step workflow, not when an application merely sends a prompt and displays the response.
  body_html: |
    <h2>Agentic engineering begins where generation changes state</h2>
    <p>The label grew out of attempts to turn language models from response generators into components that can act through software. The engineering problem is not autonomy for its own sake.</p>
    <p>It is controlling a loop whose next step depends on a model judgment and whose actions may alter files, databases, tickets, or external services.</p>
    <p>A chatbot can answer a question without being an agent. An agentic system receives a goal, selects an action, observes the result, and decides whether to continue.</p>
    <p>That loop is the boundary between ordinary LLM application development and agentic engineering.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">BOUNDARY</span><strong>Does the model control the next action?</strong><small>Generation alone is not agency.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Model produces an output</strong><small>What can that output do?</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">display only</span><div class="flowchart-node"><strong>LLM application</strong><small>The host returns text or structured data.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">changes state</span><div class="flowchart-node"><strong>Agentic system</strong><small>The host executes an action and returns an observation.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">stop</span><div class="flowchart-node"><strong>One response</strong><small>No control loop is required.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">continue</span><div class="flowchart-node"><strong>Bounded loop</strong><small>Policy, permissions, and completion checks become engineering concerns.</small></div></div>
        </div>
        <p class="flowchart-note">The risk begins at execution, not at the number of models in the system.</p>
      </div>
    </div>
    <h2>The adjacent terms describe parts, not the whole discipline</h2>
    <p><a href="/glossary/tool-calling/">Tool calling</a> is the interface that lets a model request an operation. <a href="/glossary/flow-engineering/">Flow engineering</a> defines a controlled sequence of model and program steps, while an agentic router chooses among destinations.</p>
    <p>Agentic engineering covers the larger system: state, permissions, recovery, observability, evaluation, and the point at which a human must intervene.</p>
    <p>Multi-agent design is also not a requirement. One model with a shell tool and a verification loop is agentic; five models that only debate before returning text may not be.</p>
    <h2>A repository repair shows what the discipline changes</h2>
    <p>Consider a coding agent asked to rename an API. The model can search for call sites, edit the implementation, run tests, read a failure, and correct the missed fixture.</p>
    <p>The engineering work lies in limiting writable paths, preserving the test output as evidence, preventing an endless retry loop, and requiring a diff for review.</p>
    <p>The <a href="/articles/agentic-workflow-playbook/">agentic workflow playbook</a> develops that example into a shipped-work process. Agentic engineering does not apply when a deterministic script already knows every step, and the common misuse is adding a planner or extra agent where ordinary control flow would be cheaper and easier to test.</p>
  title: What is Agentic Engineering in AI?
  description: Agentic engineering is the discipline of orchestrating multiple AI agents to perform complex,
    multi-step tasks autonomously.
  short_definition: The discipline of designing, orchestrating, and evaluating systems where AI agents
    autonomously plan and execute multi-step workflows.
  long_definition: Agentic engineering represents a paradigm shift from using LLMs as single-turn answering
    machines to utilizing them as active participants in software architecture. Instead of relying on
    a single, massive prompt to output a final result, agentic engineering breaks complex objectives down
    into a Directed Acyclic Graph (DAG) of smaller tasks. The engineer's job shifts from writing code
    to building the orchestration layer—defining the agents, granting them specific tools (APIs, execution
    environments), setting up the communication protocols between them, and implementing robust error
    recovery and verification loops.
  how_it_works: "An agentic system is typically built using the following components:\n<ul>\n  <li><strong>The\
    \ Router:</strong> A lightweight classifier that receives a user query and routes it to the most capable\
    \ specialized agent.</li>\n  <li><strong>The Planner:</strong> An agent responsible solely for taking\
    \ an objective and breaking it down into a step-by-step sequential plan.</li>\n  <li><strong>Tool\
    \ Calling:</strong> Agents use structured outputs to execute external functions, such as running a\
    \ Python script, querying a database, or searching the web.</li>\n  <li><strong>Verification Loops:</strong>\
    \ Before declaring a task complete, a separate 'Critic' or 'Verifier' agent reviews the output against\
    \ the original constraints and sends it back if it fails.</li>\n</ul>"
  use_cases:
  - Automating complex CI/CD pipelines and code reviews (e.g., SWE-agent).
  - Building autonomous research assistants that can browse the web, synthesize data, and write reports.
  - Creating dynamic customer support systems capable of executing database transactions safely.
