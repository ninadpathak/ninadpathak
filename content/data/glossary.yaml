# Documentation Glossary
#
# STATUS: plumbing complete, prose NOT written.
#
# Every `short_definition`, `long_definition`, and `how_it_works` value below is a TODO
# placeholder. Ninad's Codex writer supplies the prose. Claude wrote the structure, the
# term list, the category grouping, and the article links only.
#
# RULES FOR WHOEVER WRITES THE DEFINITIONS
#
# 1. The definition must stand alone. A reader arriving from an AI assistant with no
#    surrounding page has to get a complete answer from `short_definition` by itself.
#    That standalone quality is the entire reason these pages exist.
# 2. `short_definition` is one or two sentences and becomes the DefinedTerm schema
#    description, the index blurb, and the llms.txt line. Write it as the answer to
#    "what is X", never as a teaser.
# 3. `long_definition` explains the mechanism. `how_it_works` is raw HTML and is
#    optional; omit it rather than padding.
# 4. House rules apply: no em dashes, no semicolons in prose, no more than two sentences
#    per paragraph, no sentence starting with a number, no banned starters
#    (in/this/by/finally/most/ever), no forbidden words (leverage/synergy/unlock).
#
# RULES FOR ARTICLE LINKS
#
# `related_articles` holds post slugs. build.py checks every slug against the posts the
# build actually emits and drops unknown ones with a warning, so this file cannot create
# another dead internal link. All slugs below were taken from the built output/llms.txt
# and verified present in output/sitemap.xml on 2026-08-17.
#
# `pending_articles` is documentation, not markup. The build ignores it. It records links
# that become valid only after a calendar piece ships, with the slot that unblocks them.

# The glossary section is on. Individual terms are held back automatically while their
# prose is still a TODO placeholder, so no switch has to be remembered: a term goes live
# the moment its short_definition and long_definition are real. See load_glossary in
# build.py. Run `python build.py --drafts` to render placeholder terms for review.
