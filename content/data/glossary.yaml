- name: Tool Calling
  slug: tool-calling
  opening_definition: Tool calling is an LLM application pattern in which a model selects a host-provided operation and returns structured arguments for that operation. It applies when the model must request data or an action outside its generated text; the application, not the model, remains responsible for validating the arguments, executing the tool, and returning the result.
  body_html: |
    <h2>A tool call is a request, not an execution</h2>
    <p>Tool calling became a common API capability when model providers exposed function descriptions and JSON Schema parameters alongside a prompt. The capability solved a concrete boundary problem: a model can propose an operation, but only application code has credentials, network access, and authority to perform it.</p>
    <p>The host sends the available tool names and schemas. The model returns a tool choice and arguments, the host validates and executes them, and the tool result enters the next model turn.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">HOST DECISION</span><strong>A tool request crosses an execution boundary</strong><small>The model proposes. The host decides.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Model returns a tool name and arguments</strong><small>The request is untrusted structured output.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">invalid or forbidden</span><div class="flowchart-node"><strong>Reject the request</strong><small>Return an error without executing the operation.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">valid and allowed</span><div class="flowchart-node"><strong>Execute through the host</strong><small>Record the policy decision and side effect.</small></div></div>
        </div>
        <p class="flowchart-note">Schema validity answers whether the request is shaped correctly. Host policy answers whether it may run.</p>
      </div>
    </div>
    <h3>Function calling, structured output, and MCP solve different boundaries</h3>
    <p>Function calling is a provider name for tool calling. <a href="/glossary/json-mode-vs-structured-outputs/">Structured output</a> constrains the shape of a response but does not imply that any function will run.</p>
    <p>The <a href="/glossary/model-context-protocol/">Model Context Protocol</a> standardizes how clients discover and invoke tools across a connection; it does not replace the tool-call loop inside the host.</p>
    <h3>Tool selection and argument generation are separate failures</h3>
    <p>A model can choose the wrong tool with perfectly valid arguments, or choose the right tool with a malformed identifier. Logs and evaluations should preserve both decisions so a routing failure is not mistaken for a schema failure.</p>
    <p>The host can also remove tools that are irrelevant to the current step. A smaller allowed set reduces accidental selection and prevents a later prompt from reaching capabilities the task never needed.</p>
    <h2>The host owns safety after the model chooses a tool</h2>
    <p>The same tool schema can serve a harmless lookup and a destructive operation, so syntax alone cannot set the policy. The host needs rules for identity, argument ranges, side effects, confirmation, retries, and result handling.</p>
    <p>Those rules should be enforced before execution and recorded with the request. A model explanation of why an action seems safe is not a substitute for the policy decision.</p>
    <h3>A safe weather lookup has two validation layers</h3>
    <p>Suppose a model returns <code>{"city":"Pune","units":"metric"}</code> for a <code>get_weather</code> tool. Schema validation can reject an unknown unit, while application policy can reject a location the user is not authorized to query.</p>
    <p>A valid JSON object is not proof that the request is safe.</p>
    <p>The <a href="/articles/model-context-protocol-explained/">MCP architecture guide</a> shows how this boundary extends across clients and servers. Tool calling is unnecessary for facts already present in context, and its common misuse is treating a schema-valid request as permission to execute it.</p>
    <h3>Retries must account for side effects</h3>
    <p>A timed-out weather lookup can usually be repeated. A timed-out payment or ticket-creation call may already have succeeded, so a blind retry can duplicate the action.</p>
    <p>Mutation tools need an idempotency strategy or a read-after-write check that resolves an uncertain result. Returning the tool error to the model without that protection shifts a distributed-systems problem into generated text.</p>
    <h3>Tool results are untrusted context too</h3>
    <p>A tool can return malformed data, stale records, or text containing instructions that should never override the host policy. The application should label the result as data, validate the expected shape, and limit what the next model turn may do with it.</p>
  title: Tool Calling (Function Calling) in LLMs
  description: Tool calling allows LLMs to interact with external APIs by reliably outputting structured
    JSON arguments.
  related_terms:
