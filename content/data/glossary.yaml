- name: Test-Time Compute (TTC)
  slug: test-time-compute
  opening_definition: Test-time compute is the computation spent after a trained model receives an input in order to improve or select its answer. It applies when an inference system can spend extra tokens, samples, search steps, verification passes, or tool calls on harder requests; it is distinct from the compute used to train or fine-tune model weights.
  body_html: |
    <h2>Inference became a scaling axis of its own</h2>
    <p>Model development long emphasized training compute, but researchers also found gains from spending more work on a particular problem after training. Test-time compute covers several mechanisms, so it should not be reduced to one product’s hidden reasoning tokens.</p>
    <p>A system might sample several candidate answers and select one, search a tree of partial solutions, run a verifier, or allocate a larger reasoning budget. Each method spends extra resources at request time and needs a rule for when to stop.</p>
    <h3>More compute is useful only when the selection signal is useful</h3>
    <p>For a code-generation task, producing four candidates helps only if compilation, tests, or another credible evaluator can distinguish them. Sampling four answers and choosing the most confident wording may multiply cost without adding evidence.</p>
    <p>Test-time compute differs from fine-tuning because the weights do not change, and from speculative decoding because speculative decoding aims to produce the same distribution faster rather than reason longer. The <a href="/articles/llm-inference-optimization/">LLM inference optimization guide</a> places both techniques on the same serving stack.</p>
    <h3>Routine requests should not inherit the hardest budget</h3>
    <p>Test-time compute applies to tasks where additional search or verification can change the outcome. It does not justify routing every request through the maximum budget, and the common misuse is reporting more generated tokens as if they were proof of better reasoning.</p>
    <h3>A compute policy needs a difficulty signal</h3>
    <p>A practical system can begin with a modest budget, escalate after a failed verifier, and stop when the expected benefit no longer justifies another attempt. The signal might be a deterministic test, disagreement among candidates, or an explicit uncertainty condition.</p>
    <p>Latency and cost belong in the policy alongside answer quality. Without a representative evaluation set, there is no evidence that the extra branch, sample, or reasoning pass improves the task that users actually submit.</p>
  title: What is Test-Time Compute in AI Reasoning?
  description: Test-Time Compute (TTC) refers to dynamically allocating more computational resources to
    an AI model during inference to improve complex reasoning.
  related_terms: []
  last_updated: '2026-08-17'
- name: Model Context Protocol (MCP)
  slug: model-context-protocol
  opening_definition: Model Context Protocol, or MCP, is an open protocol for connecting AI applications to servers that expose tools, resources, and reusable prompts. It applies when a host needs a standard way to discover and invoke capabilities across process or network boundaries; MCP does not grant trust, authorization, or safe execution by itself.
  body_html: |
    <h2>Anthropic introduced MCP to reduce bespoke integrations</h2>
    <p>Anthropic released <a href="https://modelcontextprotocol.io/docs/getting-started/intro">MCP in 2024 as an open protocol</a> for connecting AI assistants to data and tools. Before a shared protocol, each host and integration could require its own discovery format, transport assumptions, and invocation code.</p>
    <p>An MCP host manages the user-facing application. A client inside that host maintains a connection to a server, and the server advertises capabilities such as tools and resources through the protocol.</p>
    <h3>Protocol compatibility does not create a trust boundary</h3>
    <p><a href="/glossary/tool-calling/">Tool calling</a> describes how a model requests an operation. MCP can carry the tool descriptions and requests, but the host still decides which server to connect to, what credentials it receives, and whether a proposed action may run.</p>
    <p>A REST API exposes application endpoints; MCP exposes model-oriented capabilities and discovery conventions.</p>
    <h3>A read-only repository server makes the boundary concrete</h3>
    <p>An IDE host can connect to an MCP server that exposes <code>search_files</code> and <code>read_file</code>. The host may approve that server for one repository and withhold write tools entirely.</p>
    <p>The protocol describes the exchange, while operating-system permissions and host policy enforce the limit.</p>
    <p>The <a href="/articles/model-context-protocol-explained/">MCP architecture guide</a> explains the roles, and the <a href="/articles/mcp-server-setup-guide/">practical MCP setup</a> covers implementation and guardrails. The common misuse is calling MCP a universal security layer or assuming a compatible server is therefore trustworthy.</p>
    <h3>Resources and tools carry different risk</h3>
    <p>A resource supplies context for the host to read, while a tool asks the server to perform an operation. Reading can still expose sensitive data, but a tool may also mutate state or trigger an external side effect.</p>
    <p>That distinction should shape consent, logging, and credential scope. A host that displays every capability as an equivalent menu item hides the most important fact about an integration: what can change when the model selects it.</p>
  title: 'Model Context Protocol (MCP): The USB Port for AI'
  description: MCP is an open protocol for connecting AI applications to servers that expose tools, resources, and prompts.
