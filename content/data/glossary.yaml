- name: Speculative Decoding
  slug: speculative-decoding
  opening_definition: Speculative decoding is an inference technique in which a faster draft process proposes several tokens and the target model verifies those proposals in parallel while preserving the target model’s output distribution. It applies when draft tokens are accepted often enough to offset proposal and verification overhead; it changes generation speed, not the model’s knowledge or reasoning ability.
  body_html: |
    <h2>Drafting turns one-token steps into candidate runs</h2>
    <p>Several research groups developed speculative decoding methods around 2022 and 2023 to reduce the sequential cost of autoregressive generation. A small model or another draft mechanism proposes a run of tokens.</p>
    <p>The target model evaluates that run in one pass, accepts a valid prefix under the decoding rule, and resumes from the first rejection.</p>
    <p>The method can be lossless with respect to the target distribution when the acceptance and correction procedure is implemented correctly. A plain small-model fallback does not provide that guarantee.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">DRAFT AND VERIFY</span><strong>The target model verifies a proposed token run in parallel</strong><small>Acceptance advances the sequence; rejection returns control to the target.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>A faster process drafts several tokens</strong><small>The draft is a proposal, not final output.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">target accepts prefix</span><div class="flowchart-node"><strong>Commit accepted tokens</strong><small>Advance by more than one sequential target step.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">target rejects token</span><div class="flowchart-node"><strong>Stop at the first rejection</strong><small>Discard the unsupported remainder of the draft.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">sequence continues</span><div class="flowchart-node"><strong>Draft the next run</strong><small>Repeat from the updated prefix.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">correction required</span><div class="flowchart-node"><strong>Use the target-model token</strong><small>Resume drafting from the corrected prefix.</small></div></div>
        </div>
        <p class="flowchart-note">The verification rule preserves the target distribution. A faster draft alone does not.</p>
      </div>
    </div>
    <h3>Acceptance rate determines whether the draft helps</h3>
    <p>A draft model that predicts common boilerplate well may advance several tokens per target-model verification. If the domain, language, or style makes its proposals diverge, frequent rejection can erase the benefit.</p>
    <p>Quantization reduces numeric precision, batching combines requests, and test-time compute spends more work to improve an answer. Speculative decoding instead tries to produce target-model tokens with fewer sequential target passes.</p>
    <h3>The benchmark needs the whole serving context</h3>
    <p>The <a href="/articles/speculative-decoding-explained/">speculative decoding guide</a> explains the mechanism and evaluation variables. The technique is a poor fit when the target model is already small or verification overhead dominates.</p>
    <p>The common misuse is publishing one speedup without the draft and target models, hardware, batch size, prompt and output lengths, acceptance behavior, and decoding settings.</p>
    <h3>Serving load can change the result</h3>
    <p>A technique that improves single-request latency may compete for compute that a busy server could use for batching other requests. Draft-model memory also reduces the capacity available to the target model and its KV cache.</p>
    <p>The relevant evaluation matches the production objective: time to first token, time per output token, total request latency, or throughput under load. “Faster” is incomplete until the metric and workload are named.</p>
  title: 'Speculative Decoding: Accelerating LLM Inference'
  description: Speculative decoding proposes draft tokens and verifies them with the target model to reduce sequential generation steps.
  related_terms:
