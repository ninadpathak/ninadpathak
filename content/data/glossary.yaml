status: published
terms:
- name: Context Engineering
  slug: context-engineering
  opening_definition: Context engineering is the discipline of selecting, structuring, ordering, and updating the information an LLM receives while completing a task. It applies when model behavior depends on more than one instruction, including retrieved documents, tool results, conversation state, examples, and system constraints that must fit within a finite context window.
  body_html: |
    <h2>The context became a system, not a prompt</h2>
    <p>The phrase gained currency as LLM applications moved beyond one prompt and one response. Once an application retrieves documents, records tool observations, carries state across turns, and applies permission rules, prompt wording is only one input among several.</p>
    <p>Context engineering names the work of assembling that complete input environment.</p>
    <p>The problem is selection, not merely capacity. A larger context window can hold more tokens, but irrelevant history, conflicting instructions, stale state, and badly ordered evidence can still make the model less reliable.</p>
    <h3>Prompt engineering controls instructions; context engineering controls evidence</h3>
    <p>Prompt engineering focuses on how a task is expressed. Retrieval-augmented generation selects outside documents, while memory decides what persists across interactions.</p>
    <p>Context engineering coordinates those pieces and determines what the model sees for this specific step.</p>
    <p>The <a href="/articles/context-windows-vs-memory/">context windows versus memory guide</a> explains why capacity and persistence are separate concerns. The <a href="/articles/how-anthropics-contextual-retrieval-changes-rag-architecture/">contextual retrieval analysis</a> shows one index-time technique for giving retrieved chunks enough surrounding meaning.</p>
    <h3>Assembly needs provenance and a deletion rule</h3>
    <p>Each context item should have a source, a reason for inclusion, and a condition that makes it stale. Tool results may last for one step, account preferences may persist across sessions, and system constraints may apply to every turn.</p>
    <p>When inputs conflict, the application should not rely on the model to infer which one is authoritative. It should resolve version and permission conflicts before assembly, then preserve source labels so the answer can be checked.</p>
    <h3>A support answer fails when two true facts collide</h3>
    <p>Suppose a customer asks how to cancel a subscription. Retrieval returns the current cancellation policy and an older enterprise contract with different terms.</p>
    <p>Good context assembly filters by account plan and effective date, labels the source, and places the applicable policy next to the task.</p>
    <p>Context engineering applies when the answer depends on choosing and combining inputs. It does not apply to every formatting preference, and its common misuse is filling the window because space is available.</p>
    <p>More context is useful only when each added item has a reason to influence the answer.</p>
  title: 'Context Engineering: Structuring LLM Data Environments'
  description: Context engineering is the systematic discipline of designing, structuring, and managing
    the information provided to an LLM to maximize reasoning accuracy.
  related_terms:
