    slug: cross-encoder-reranking
  last_updated: '2026-08-17'
- name: Hypothetical Document Embeddings (HyDE)
  slug: hypothetical-document-embeddings-hyde
  opening_definition: Hypothetical Document Embeddings, or HyDE, is a zero-shot retrieval method that asks a language model to draft a hypothetical answer-like document, embeds that draft, and uses its vector to retrieve real documents. It applies when a short query and relevant passages occupy different language or detail levels; the generated document is a search representation, not evidence.
  body_html: |
    <h2>HyDE bridges the query-document language gap</h2>
    <p>Luyu Gao and coauthors <a href="https://arxiv.org/abs/2212.10496">introduced HyDE in 2022</a> for zero-shot dense retrieval. A user query may be too short or phrased unlike the documents that answer it.</p>
    <p>Generating a plausible document gives the encoder a richer representation that may sit closer to relevant corpus passages.</p>
    <p>The system embeds the generated text, retrieves real documents, and answers from those sources. The hypothetical text has done its job once it has improved the search query.</p>
    <h3>Acronym-heavy documentation creates a useful case</h3>
    <p>For “why does my login expire?”, a hypothetical passage might mention session lifetime, refresh tokens, and token revocation. Those terms can retrieve the correct authentication documentation even when the original question contains none of them.</p>
    <p>The hypothetical passage should resemble the kind of document the index contains. Generating a conversational answer for a corpus of terse reference entries can create a new representation mismatch instead of closing the old one.</p>
    <h3>Query expansion may generate terms; HyDE generates a document</h3>
    <p>Traditional query expansion adds related words or alternate queries. HyDE generates answer-shaped prose and embeds it.</p>
    <p>Self-querying retrieval instead extracts structured filters and a semantic query from the request.</p>
    <p>The <a href="/articles/hybrid-search-bm25-vector-search/">hybrid search guide</a> covers another way to handle vocabulary mismatch. HyDE is a poor fit when invented specifics can pull retrieval toward the wrong domain, and the common misuse is quoting the hypothetical document as though a source had said it.</p>
    <h3>The generated text must remain outside the evidence set</h3>
    <p>A safe implementation labels the hypothetical document internally and keeps it separate from retrieved sources. If the generation invents a product name or technical term, retrieval may follow that invention and return a coherent but irrelevant neighborhood.</p>
    <p>Evaluation should compare retrieval with and without HyDE on the same queries, then inspect both gains and regressions. The method earns its extra model call only when it improves access to real answer-bearing documents.</p>
  title: 'HyDE: Hypothetical Document Embeddings for Zero-Shot Retrieval'
  description: HyDE improves vector search by using an LLM to generate a fake perfect answer before searching
    the vector database.
  related_terms:
  - name: Bi-Encoder Architecture
    slug: bi-encoder
  - name: Context Engineering
    slug: context-engineering
  last_updated: '2026-08-17'
- name: Self-Querying Retrieval
  slug: self-querying-retrieval
  opening_definition: Self-querying retrieval is a search pattern in which a model converts a natural-language request into a semantic query plus structured filters for a retrieval system. It applies when the collection has trustworthy metadata and users express constraints such as date, product, author, or region in ordinary language; it does not create metadata the index lacks.
  body_html: |
    <h2>The model translates intent into two search channels</h2>
    <p>A request can contain both a topic and exact constraints. Self-querying retrieval separates them: descriptive language becomes the vector or text query, while explicit constraints become fields in a filter expression.</p>
    <p>The pattern became common in retrieval frameworks as LLMs made natural-language parsing flexible, but the host must restrict the filter grammar and validate field names, operators, and values.</p>
    <h3>“EU incidents after July” should not be one embedding</h3>
    <p>For that request, “incidents” belongs in semantic retrieval, while region equals EU and date after July belong in structured filters. Embedding the entire sentence leaves exact constraints to vector geometry, which is not designed to enforce them.</p>
    <p>Metadata filtering written directly by application code is preferable when the UI already supplies exact fields. <a href="/glossary/tool-calling/">Tool calling</a> may carry the generated search request, but self-querying retrieval describes the translation step.</p>
    <h3>Schema quality sets the ceiling</h3>
    <p>The <a href="/articles/hybrid-search-bm25-vector-search/">hybrid search guide</a> explains how semantic and lexical retrieval can be combined after filtering. Self-querying does not apply when metadata is incomplete or access control is being delegated to model output.</p>
    <p>The common misuse is treating a generated filter as authorization rather than as untrusted input to a policy-enforcing search layer.</p>
    <h3>The allowed query language should be smaller than the database language</h3>
    <p>The model usually needs a restricted set of fields and operators, not arbitrary SQL or a vendor’s full filter syntax. A typed intermediate representation lets the host reject unknown fields and compile allowed expressions safely.</p>
    <p>Ambiguous dates, units, and names need an explicit policy. The system can ask for clarification rather than silently translating “recent” or “enterprise” into a filter that looks precise but was never specified.</p>
  title: 'Self-Querying Retrieval: Combining Metadata and Vector Search'
  description: Self-querying retrieval uses an LLM to dynamically write database filters (SQL/NoSQL) alongside
    generating a vector search query.
  related_terms:
  - name: Tool Calling
    slug: tool-calling
  - name: Agentic Engineering
    slug: agentic-engineering
  last_updated: '2026-08-17'
- name: Bi-Encoder Architecture
  slug: bi-encoder
  opening_definition: A bi-encoder is a retrieval architecture that encodes a query and each candidate document independently into vectors that can be compared with a distance or similarity function. It applies when a system must search many pre-encoded candidates quickly; it is less suitable when relevance depends on fine-grained interaction between every query token and document token.
  body_html: |
    <h2>Independent encoding makes large retrieval sets practical</h2>
    <p>Bi-encoders became central to semantic search through work such as Sentence-BERT, which adapted transformer representations for efficient similarity comparison. A document vector can be computed once and indexed.</p>
    <p>At query time, the system encodes only the query and searches the stored vectors.</p>
    <h3>Bi-encoders retrieve; cross-encoders judge pairs</h3>
    <p>A <a href="/glossary/cross-encoder-reranking/">cross-encoder</a> reads a query and candidate together, so its attention layers can model their exact interaction. That usually makes it useful for reranking a small candidate set but too expensive for a first pass over a large corpus.</p>
    <p>HNSW is different again: it is an index that searches vectors, not the model that creates them.</p>
    <table>
      <thead><tr><th>Decision</th><th>Bi-encoder</th><th>Cross-encoder</th></tr></thead>
      <tbody>
        <tr><td>How inputs are read</td><td>Query and document are encoded separately</td><td>Query and document are read together</td></tr>
        <tr><td>What can be reused</td><td>Document vectors can be stored in an index</td><td>Each query-document pair needs a new model pass</td></tr>
        <tr><td>Where it fits</td><td>First-stage retrieval over many candidates</td><td>Reranking a small retrieved set</td></tr>
        <tr><td>Primary failure</td><td>The relevant document never enters the candidate set</td><td>The reranker cannot recover a candidate it never received</td></tr>
      </tbody>
    </table>
    <h3>Pre-encoding moves document work out of the request path</h3>
    <p>The document side can be encoded when content enters the index and reused across many searches. Query latency then includes one query encoding, index search, and any later reranking rather than one model pass for every document.</p>
    <p>That reuse is the bi-encoder’s scaling advantage. It also means a model or preprocessing change requires re-encoding the collection before query and document vectors are comparable again.</p>
    <h2>Retrieval quality depends on the role of each input</h2>
    <p>Queries and documents often have different lengths and purposes. A retrieval setup should preserve that asymmetry during encoding and evaluate the ranking on the question types the application actually receives.</p>
    <p>Model documentation may prescribe distinct query and passage prefixes or separate encoders. Omitting that contract can make a capable model look weak because the deployment no longer matches its training setup.</p>
    <h3>The query and document may need different instructions</h3>
    <p>For the query “how do I rotate an API key?”, a bi-encoder can retrieve a credential-rotation guide even when that guide uses different wording. An asymmetric retrieval model may encode the short question and the longer document with different prefixes or encoders because they play different roles.</p>
    <p>The <a href="/articles/embedding-models-compared/">embedding model guide</a> explains the vector representation underneath this search. A bi-encoder is a poor final judge when a tiny qualifier changes relevance, and the common misuse is reading a high cosine similarity as a calibrated probability that a document answers the query.</p>
    <h3>Hard negatives teach the boundary the retriever keeps missing</h3>
    <p>A random unrelated document is easy to rank below a relevant one. A versioned page for the wrong release or a guide that discusses API keys when the query excludes them is a harder and more useful negative.</p>
    <p>Evaluation should include those near misses and report whether the answer-bearing document enters the candidate set. A reranker cannot repair a document that the bi-encoder never retrieves.</p>
  title: What is a Bi-Encoder Architecture in NLP?
  description: A bi-encoder embeds queries and documents independently so document vectors can be indexed and reused.
  related_terms:
  - name: Cross-Encoder Reranking
    slug: cross-encoder-reranking
  - name: Matryoshka Representation Learning (MRL)
    slug: matryoshka-representation-learning
  last_updated: '2026-08-17'
- name: Product Quantization (PQ)
  slug: product-quantization
  opening_definition: Product quantization is a lossy vector-compression method that splits a vector into sub-vectors and represents each sub-vector by the identifier of a nearby learned centroid. It applies when storing or scanning full-precision embeddings is too expensive and approximate distance estimates are acceptable; the codebooks must be trained on representative vectors.
  body_html: |
    <h2>Subspace codebooks replace floating-point coordinates</h2>
    <p>Product quantization divides each vector into equal subspaces. A clustering step learns a codebook for each subspace, and an indexed vector stores the nearest centroid identifier from every codebook instead of all original coordinates.</p>
    <p>At search time, the system estimates distances through lookup tables built from the query and those centroids. Compression saves memory and bandwidth at the cost of quantization error.</p>
    <h3>A toy code shows the storage shape</h3>
    <p>If a vector is divided into four sub-vectors and each codebook has entries addressed by one byte, the compressed representation contains four centroid identifiers plus any index overhead. The example explains the shape, not a universal compression ratio, because production choices depend on dimension, codebook size, and metadata.</p>
    <h3>PQ compresses vectors; HNSW navigates neighbors</h3>
    <p><a href="/glossary/hierarchical-navigable-small-world-hnsw/">HNSW</a> is a graph index, while PQ is an encoding. Matryoshka representation learning trains useful vector prefixes, and scalar quantization reduces the precision of individual values.</p>
    <p>The <a href="/articles/embedding-models-compared/">embedding model guide</a> explains why dimension and model behavior must be evaluated together. Product quantization is unnecessary when full vectors fit comfortably in memory, and the common misuse is reporting space savings without measuring recall on the compressed index.</p>
    <h3>Codebooks inherit the distribution they learned</h3>
    <p>A codebook trained on one embedding model or domain may represent a changed distribution poorly. Replacing the embedding model, normalizing vectors differently, or adding a distinct document population can make the old centroids a worse approximation.</p>
    <p>Migration planning should therefore include codebook retraining and side-by-side recall checks. Keeping original vectors elsewhere may also be necessary when the system needs exact reranking or future re-encoding.</p>
  title: Product Quantization (PQ) for Vector Compression
  description: Product Quantization is an algorithmic technique used to compress dense vectors, reducing
    memory usage in large-scale databases.
  related_terms:
  - name: Matryoshka Representation Learning (MRL)
    slug: matryoshka-representation-learning
  - name: Hierarchical Navigable Small World (HNSW)
    slug: hierarchical-navigable-small-world-hnsw
  last_updated: '2026-08-17'
- name: Hierarchical Navigable Small World (HNSW)
  slug: hierarchical-navigable-small-world-hnsw
  opening_definition: Hierarchical Navigable Small World, or HNSW, is a graph-based approximate nearest-neighbor index for finding vectors close to a query vector. It applies when exact comparison against every stored vector is too costly and the system can trade some recall for faster search, additional index memory, and slower index construction.
  body_html: |
    <h2>HNSW turns vector search into graph navigation</h2>
    <p>Yury Malkov and Dmitry Yashunin <a href="https://arxiv.org/abs/1603.09320">introduced HNSW in their 2016 paper</a> as a multilayer proximity graph. The design addressed a scaling problem in nearest-neighbor search: comparing a query with every vector gives exact results, but the work grows directly with the collection.</p>
    <p>HNSW assigns some points to sparse upper layers and keeps progressively more points in lower layers. Search starts high, makes large moves toward the query, then descends and refines the candidate set in denser layers.</p>
    <div class="flowchart">
      <div class="flowchart-caption"><span class="flowchart-caption-label">LAYERED SEARCH</span><strong>HNSW descends from sparse shortcuts into dense local neighbors</strong><small>Each layer narrows the region explored at the next one.</small></div>
      <div class="flowchart-body">
        <div class="flowchart-root"><div class="flowchart-node"><strong>Enter at a sparse upper layer</strong><small>Start from the graph's entry point.</small></div></div>
        <div class="flowchart-root"><div class="flowchart-node"><strong>Follow links toward the query</strong><small>Use long-range edges to cross the vector space.</small></div></div>
        <div class="flowchart-root"><div class="flowchart-node"><strong>Descend into a denser layer</strong><small>Carry the nearest current candidate downward.</small></div></div>
        <div class="flowchart-branches">
          <div class="flowchart-branch"><span class="flowchart-edge-label">closer neighbor found</span><div class="flowchart-node"><strong>Continue graph traversal</strong><small>Expand the candidate neighborhood.</small></div></div>
          <div class="flowchart-branch"><span class="flowchart-edge-label">local minimum reached</span><div class="flowchart-node"><strong>Finish the layer</strong><small>Keep the strongest candidates found so far.</small></div></div>
        </div>
        <div class="flowchart-outcomes">
          <div class="flowchart-outcome"><span class="flowchart-edge-label">more layers remain</span><div class="flowchart-node"><strong>Descend again</strong><small>Refine the search in a denser graph.</small></div></div>
          <div class="flowchart-outcome"><span class="flowchart-edge-label">base layer reached</span><div class="flowchart-node"><strong>Return approximate neighbors</strong><small>Rank the explored candidate set by distance.</small></div></div>
        </div>
        <p class="flowchart-note">The hierarchy reduces the region searched. It does not guarantee the exact nearest neighbors.</p>
      </div>
    </div>
    <h3>The index is not the embedding model</h3>
    <p>A <a href="/glossary/bi-encoder/">bi-encoder</a> creates vectors; HNSW searches them. Product quantization compresses vectors and may be combined with an index, while exact k-nearest-neighbor search compares the query against the full collection.</p>
    <p>These components answer different questions and should not be presented as interchangeable vector databases.</p>
    <h3>Graph construction creates the routes search will later follow</h3>
    <p>When a vector enters the index, HNSW searches for nearby existing points and connects the new node according to construction settings and neighbor-selection rules. Those choices determine which shortcuts remain available at query time.</p>
    <p>A weakly built graph cannot always be repaired by exploring more candidates during search. Construction quality, insertion order, deleted nodes, and later updates belong in the evaluation when the index changes over time.</p>
    <h2>Choosing HNSW means choosing a recall budget</h2>
    <p>HNSW exposes construction and search controls that change graph density, build work, memory use, and the number of candidates explored. Their names vary by implementation, but no setting can be interpreted without a recall target and a representative query set.</p>
    <h3>A filtered support search exposes the tradeoff</h3>
    <p>Imagine an index of support articles where the query must match both semantic meaning and a product-version filter. If filtering leaves few eligible graph nodes, an aggressive search setting can miss the best valid result.</p>
    <p>Increasing search breadth may recover it, but the right setting must be measured on representative queries rather than copied from a vendor default.</p>
    <p>The <a href="/articles/local-wasm-vector-benchmarks/">browser vector-search analysis</a> discusses index choices without treating its earlier benchmark framing as proof. HNSW is unnecessary for a small collection that exact search handles comfortably, and its common misuse is quoting a latency number without the dataset, hardware, recall target, index parameters, and filter behavior that produced it.</p>
    <h3>Exact search supplies the baseline HNSW needs</h3>
    <p>Before tuning an approximate index, run exact search on the evaluation queries and record the true nearest neighbors. HNSW recall is the share of those neighbors recovered under a particular search setting.</p>
    <p>Exact search can also be the production choice for a collection that fits the latency and cost budget. An approximate index adds build time, memory, and operational settings, so scale alone does not make it necessary.</p>
  title: 'HNSW Algorithm: Fast Vector Search Explained'
  description: HNSW is a multilayer graph index for approximate nearest-neighbor search over vectors.
  related_terms:
