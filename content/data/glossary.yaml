- name: Matryoshka Representation Learning (MRL)
  slug: matryoshka-representation-learning
  opening_definition: Matryoshka Representation Learning is a training method that makes prefixes of one embedding vector useful at several dimensionalities. It applies when a model was trained with nested representation objectives and a system needs flexible storage or multi-stage retrieval; arbitrary truncation of a conventional embedding is not Matryoshka representation learning.
  body_html: |
    <h2>One vector is trained to contain nested resolutions</h2>
    <p>Aditya Kusupati and coauthors <a href="https://arxiv.org/abs/2205.13147">introduced Matryoshka Representation Learning in 2022</a>. The method trains predictive representations at multiple prefix lengths, borrowing its name from nesting dolls.</p>
    <p>Earlier dimensions must carry a useful coarse representation while later dimensions add detail.</p>
    <p>A system can index a shorter prefix for a broad candidate search and retain the longer vector for a more precise second pass. That flexibility comes from the training objective, not from the array-slicing operation itself.</p>
    <h3>Truncation, quantization, and dimensionality reduction are not interchangeable</h3>
    <p>Truncation discards trailing dimensions. <a href="/glossary/product-quantization/">Product quantization</a> compresses vector subspaces into codebook identifiers, while a separately learned dimensionality-reduction transform maps vectors into a new space.</p>
    <p>Each changes storage and retrieval behavior differently.</p>
    <p>An MRL prefix remains in the coordinate system the model was trained to organize. That training property is why prefix truncation can be evaluated as a deliberate operating point rather than an arbitrary loss of dimensions.</p>
    <h3>A two-stage catalog search shows the intended use</h3>
    <p>A catalog can search compact prefixes to retrieve a broad candidate set, then rescore those candidates with longer embeddings from the same MRL model. The design makes sense only after recall is evaluated at both stages on representative queries.</p>
    <p>The <a href="/articles/embedding-models-compared/">embedding model guide</a> covers model selection and vector dimensions. The common misuse is chopping any embedding to a convenient size and assuming the result preserves meaning because an MRL-trained model could do so.</p>
    <h3>The prefix length becomes a deployment parameter</h3>
    <p>Choosing a shorter prefix can reduce index storage and distance-computation work, but the effect depends on the model, corpus, and retrieval task. A product-name lookup may tolerate a compact representation that loses distinctions needed for legal or scientific search.</p>
    <p>The useful comparison holds the model and evaluation queries constant, then measures recall as dimensions are removed. A smaller vector is not automatically cheaper end to end if lower recall forces a much larger candidate set or reranking stage.</p>
  title: Matryoshka Representation Learning (MRL) in Vector Search
  description: MRL trains useful embedding prefixes so one vector can support retrieval at several evaluated dimensionalities.
  related_terms:
