# Retired URLs — write-offs, recorded as decisions
#
# Read by tools/url_inventory.py. A URL listed here is one the site deliberately no
# longer serves and does not intend to redirect. Listing it stops the guard reporting it
# forever; omitting it means the guard keeps asking, which is the point.
#
# EVERY ENTRY NEEDS A REASON. A write-off with no stated reason is indistinguishable from
# an accident, which is exactly the failure this file exists to prevent.
#
# Two entry shapes:
#   - path:   one exact URL. Use this at the site root.
#   - prefix: a whole directory family. Only safe where the site will never publish under
#             that prefix again.
#
# There is deliberately no regex form. A pattern at the site root would silently swallow a
# future page we do care about: `^/ticktick.*` would absorb a real /ticktick-integration/
# article the day it shipped. Root-level URLs are therefore listed one by one, however
# long that makes this file.
#
# THE EVIDENCE FOR THIS SEED
#
# Search Console span 2025-04-21 to 2026-08-14. Every URL below had
# ZERO impressions in the 84 days ending 2026-08-14. Google has dropped them, so
# restoring the URLs now would start from zero rather than recover anything. That is the
# basis for writing them off rather than redirecting them, and it is a measurement, not an
# assumption — see planning/url-inventory.json.
#
# What this was: a WordPress productivity-software review site that occupied this domain
# before the March 2026 rebuild. 896 URLs, 26,072 impressions and about 119 clicks across
# the whole recorded span. It converted at roughly 0% CTR on the comparison pages: the
# largest, /todoist-vs-any-do/, took 2,489 impressions and zero clicks. Off-niche for
# everything this site now does.
#
# The one genuine loss is /guides/css-grid-layouts-webflow-table/ — 5,542 impressions and
# 66 clicks, the single best-performing URL this domain has ever had. It is still written
# off, because it has had zero impressions in 84 days and it is a CSS tutorial with no
# relationship to technical documentation, developer experience, or AI search.

