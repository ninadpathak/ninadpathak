name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q build.py check_rules.py rule_checker.py seo_audit.py tests

      # MUST RUN BEFORE THE TESTS. Several tests read the built site — tool schema,
      # tool end-to-end, cluster and link integrity — and they SKIP when output/ is
      # absent rather than fail. Running them first meant four tool-schema tests were
      # silently skipping in CI while passing locally off a stale build, so a tool could
      # have shipped with no structured data and CI would have stayed green. A test that
      # silently skips is a test that is not running.
      - name: Build and audit site
        run: python build.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      # Fail on regressions, not on inherited debt. Running rule_checker over a changed
      # post and failing on any error turned CI red the moment anyone touched an older
      # article, because ~250 pre-existing errors are spread across the archive. Hermes
      # publishes daily and edits posts daily, so the gate was red by default, and a gate
      # that cannot go green stops being read. campaign-90d.md's publish gate has always
      # said "no new errors added to the pre-existing" — this makes CI match it.
      - name: Check changed published writing for regressions
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- 'content/posts/*.md')
          if [ -z "$changed" ]; then
            echo "No changed blog posts to audit."
            exit 0
          fi

          echo "== findings on the new versions =="
          python rule_checker.py $changed || true

          count() { python rule_checker.py --summary "$@" 2>/dev/null \
            | sed -n 's/^TOTAL: \([0-9]*\) errors.*/\1/p' | head -1; }

          after=$(count $changed); after=${after:-0}

          # Read the previous versions out of git into a scratch tree rather than
          # checking them out, so the working tree is never disturbed. A newly added
          # post has no prior version, so its baseline is zero and all of its errors
          # are new.
          base=$(mktemp -d)
          befores=""
          for f in $changed; do
            if git cat-file -e "HEAD^:$f" 2>/dev/null; then
              mkdir -p "$base/$(dirname "$f")"
              git show "HEAD^:$f" > "$base/$f"
              befores="$befores $base/$f"
            fi
          done
          # No `cd` into the scratch tree: rule_checker.py lives at the repo root, and
          # running it from elsewhere made python fail, the sed match come back empty, and
          # ${before:-0} swallow the error as a baseline of zero. That reported "errors
          # increased from 0 to 100" on a commit that REMOVED errors. The paths in
          # $befores are absolute, so the repo root is the correct cwd.
          if [ -n "$befores" ]; then
            before=$(count $befores)
            if [ -z "$before" ]; then
              echo "::error::could not compute a baseline for $changed — refusing to guess"
              exit 1
            fi
          else
            before=0
          fi

          echo "rule_checker errors on changed posts: before=$before after=$after"
          if [ "$after" -gt "$before" ]; then
            echo "::error::rule_checker errors increased from $before to $after on changed posts"
            exit 1
          fi
          echo "No new rule_checker errors introduced."

      # The defect class that has dominated this campaign is a first-person claim or a
      # measurement the site cannot evidence. 116 candidates sit across 54 of 89 posts, so
      # this cannot gate on an absolute count. It gates on regressions, same as the writing
      # check above: a changed post may not introduce more candidates than it had before.
      # Hermes publishes daily and pushes straight to main, so this is the only automatic
      # check standing between a new article and production.
      - name: Check changed posts for new unevidenced claims
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- 'content/posts/*.md')
          if [ -z "$changed" ]; then
            echo "No changed blog posts to audit."
            exit 0
          fi

          claims() { python tools/audit_claims.py --paths "$@" 2>/dev/null \
            | sed -n 's/^\([0-9]*\) candidate claim.*/\1/p' | head -1; }

          after=$(claims $changed); after=${after:-0}

          base=$(mktemp -d)
          befores=""
          for f in $changed; do
            if git cat-file -e "HEAD^:$f" 2>/dev/null; then
              mkdir -p "$base/$(dirname "$f")"
              git show "HEAD^:$f" > "$base/$f"
              befores="$befores $base/$f"
            fi
          done
          if [ -n "$befores" ]; then
            before=$(claims $befores)
            if [ -z "$before" ]; then
              echo "::error::could not compute a claim baseline — refusing to guess"
              exit 1
            fi
          else
            before=0
          fi

          echo "unevidenced-claim candidates on changed posts: before=$before after=$after"
          python tools/audit_claims.py --paths $changed || true
          if [ "$after" -gt "$before" ]; then
            echo "::error::unevidenced claim candidates rose from $before to $after. Each is a candidate, not a verdict — classify KEEP, REWRITE or CUT per CHARTER 2c."
            exit 1
          fi
          echo "No new unevidenced claim candidates introduced.

      # MUST RUN AFTER build.py. This reads output/ to count inbound links that come
      # from templates rather than article bodies — the homepage cluster nav, the tool
      # pages. Without a build, output/ does not exist, every page looks orphaned, and the
      # gate fails for a reason that has nothing to do with the commit. It passed locally
      # only because a stale build was sitting there, which is exactly the kind of gate
      # this campaign has learned not to trust.
      #
      # Orphans and thin-outbound pages are both at zero now that the retrofit in
      # planning/internal-link-retrofit.md has landed, so this can gate. It fails on a
      # post with no declared cluster or no inbound link. It does NOT fail on a
      # cross-cluster link: the one legitimate exception is when the link is the subject
      # of the sentence, which cannot be judged mechanically, so those are reported for a
      # reviewer rather than blocked.
      - name: Guard cluster isolation and inbound linking
        run: python tools/audit_clusters.py --strict

      # MUST RUN AFTER build.py, like the cluster guard, because it reads output/.
      # 25 glossary pages shipped with perfect flowchart markup and no flowcharts.css, so
      # every span and strong rendered inline and ran together. Source review passed it:
      # only a rendered page shows a missing stylesheet. This is the cheap deterministic
      # half of that check and it catches exactly this failure.
      - name: Guard stylesheet coverage
        run: python tools/audit_stylesheets.py --strict

      # Reported, not gated, until the glossary diagram rework lands. All 25 glossary
      # entries currently share ONE diagram skeleton — 5 nodes, 2 branches, 2 outcomes —
      # so --strict fails today, and adding a gate that cannot go green is the mistake
      # this repo has made three times. Promote to --strict once the rework is in.
      - name: Report diagram structural convergence
        run: python tools/audit_structure.py


      # `output/` is untracked and .gitignored — Cloudflare Pages generates it at build
      # time — so the old "verify generated output is committed" step diffed nothing and
      # passed unconditionally. Removed rather than left in place looking like a check.

