name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q build.py check_rules.py rule_checker.py seo_audit.py tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check published writing rules
        run: python rule_checker.py --summary

      - name: Build and audit site
        run: python build.py

      - name: Verify generated output is committed
        run: git diff --exit-code -- output
