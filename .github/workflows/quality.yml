name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q build.py check_rules.py rule_checker.py seo_audit.py tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check changed published writing
        run: |
          changed_posts=$(git diff --name-only HEAD^ HEAD -- 'content/posts/*.md')
          if [ -n "$changed_posts" ]; then
            python rule_checker.py $changed_posts
          else
            echo "No changed blog posts to audit."
          fi

      - name: Build and audit site
        run: python build.py

      - name: Verify generated output is committed
        run: git diff --exit-code -- output
