name: Refresh page dates

# Dates every article from git history after each push to main and commits
# content/lastmod.json when it changed. Hermes publishes straight to main without
# running lastmod.py, and Cloudflare Pages builds from a shallow clone that cannot
# date anything itself, so without this a new or edited post would keep its
# frontmatter date and CI would warn on every publish.
#
# Loop guards, any one of which is enough:
# - paths-ignore: a push whose only change is the manifest does not start a run;
# - the bot's commit message carries [lastmod-bot], and a run for it exits at once;
# - pushes made with GITHUB_TOKEN do not trigger workflows in the first place.
# Cloudflare Pages still builds the bot's commit, which is the point.

on:
  push:
    branches: [main]
    paths-ignore:
      - content/lastmod.json

permissions:
  contents: write

concurrency:
  group: refresh-page-dates
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lastmod-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A push can land between our checkout and our push. Then start again from the
      # new main, recompute, and retry, rather than merging two manifests.
      - name: Refresh and commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python lastmod.py
            if git diff --quiet -- content/lastmod.json; then
              echo "content/lastmod.json is current."
              exit 0
            fi
            git add content/lastmod.json
            git commit -m "Refresh page dates in content/lastmod.json [lastmod-bot]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the refresh (attempt $attempt); starting again."
          done
          echo "::error::could not push the refreshed manifest after 3 attempts"
          exit 1
