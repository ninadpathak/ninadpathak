[site]
title = "Ninad Pathak"
tagline = "Developer Relations Content for DevTools & SaaS"
description = "Developer relations content, documentation, tutorials, and technical articles that help developer products earn trust and adoption."
url = "https://ninadpathak.com"
author = "Ninad Pathak"

[content]
# Set this to the full path of your Obsidian blog posts folder
# Example: obsidian_path = "/Users/ninad/Obsidian/Blog Posts"
obsidian_path = ""
posts_per_page = 20

# THE TOOLS INVENTORY, and the single source of truth for it.
#
# The footer used to list all five tools individually, which is an inventory rather than a
# set of destinations, and it would only dilute further with every tool shipped. One
# `Tools` link now points at /tools/, which concentrates link equity on one rankable page
# and finally gives the tools cluster an owner page.
#
# `name` and `description` are each tool page's own reviewed title and meta description,
# reused verbatim rather than rewritten, so the index cannot drift from the pages it lists.
# Order is by strategic priority: the AI Overviews checker leads because `ai overviews
# checker` is 700/mo at KD 0 with no AI Overview on its SERP, and no build-a-tool keyword
# in this niche carries one while all 15 top keywords do.

[[content.tools]]
slug = "ai-overviews-checker"
name = "AI Overviews Checker"
description = "Check a page with nine sourced structural checks for snippet eligibility and extractability. Runs in your browser and never predicts AI Overview placement."

[[content.tools]]
slug = "ai-crawler-checker"
name = "AI Crawler Access Checker"
description = "Check whether your robots.txt lets AI assistants cite you, separately from whether it lets them train on you. Runs in the browser. No signup."

[[content.tools]]
slug = "llms-txt-validator"
name = "llms.txt Validator"
description = "Validate llms.txt against the v2 proposal. Paste a file or fetch one from a domain, then separate spec requirements from conventions in your browser."

[[content.tools]]
slug = "llms-txt-generator"
name = "llms.txt Generator"
description = "Scan your sitemap, review page titles and descriptions, and generate an editable llms.txt file. Free, fast, and no signup required."

[[content.tools]]
slug = "linter"
name = "Technical Writing Linter"
description = "Paste a technical article. Get a linter report: condescension words, AI writing signals, buzzwords, passive voice, readability score. Free. No signup."

# CLUSTER OWNER PAGES
#
# One category per cluster in campaign-90d.md section 3, and each one renders a real
# page at /articles/<slug>/ with its own title, description, canonical, and
# CollectionPage schema. That page is the cluster's owner.
#
# Before this, all twelve topic pillars were anchors on one URL (/articles/#<slug>),
# which meant twelve clusters shared one ranking surface and none of them could own a
# head term. The ai-memory category was also removed on 2026-08-17 for matching zero
# published posts while still emitting an empty page into the sitemap. That was the
# right call for an empty category and the wrong conclusion about the niche; the niche
# was widened the same day. See CHARTER.md section 2c-bis.
#
# ORDER MATTERS: build.py takes the first category whose tag_matches intersect a post's
# tags, so the most specific cluster comes first. Tag matching is only the fallback.
# Cluster isolation requires every piece to declare exactly one cluster, so posts carry
# an explicit `category:` in their frontmatter and that always wins.
#
# TODO (copy, for the Codex writer): `description` and `intro` below are scope
# definitions written by the director to set the cluster boundary, not finished page
# copy, and they are visible on each owner page. Rewrite them so each one states the
# reader's job in that cluster and reads like the rest of the site. House rules apply.

[[content.categories]]
slug = "ai-search-optimization"
title = "AI Search and Citation"
description = "Getting technical content found and cited by AI Overviews, ChatGPT, and other answer engines."
intro = "How answer engines pick sources, and what a documentation site can control."
tag_matches = ["ai-search", "ai-overviews", "llms-txt", "answer-engines", "documentation-seo", "generative-engine-optimization"]

[[content.categories]]
slug = "ai-engineering"
title = "AI Agents, Memory, and Retrieval"
description = "Agent architecture, agent memory, retrieval-augmented generation, and LLM inference, with the benchmarks behind them."
intro = "How production AI systems store, retrieve, and forget, and where each layer breaks."
tag_matches = ["ai-agents", "ai agents", "agents", "agent-memory", "agent-architecture", "agent architecture", "agent design", "multi-agent", "multi-agent systems", "rag", "retrieval", "memory", "memory-hierarchy", "memory-management", "memory-optimization", "vector-search", "llm", "llm-architecture", "inference", "kv-cache", "context-window", "context-windows", "transformers", "fine-tuning", "mcp", "ai reasoning", "voice-ai", "agentic-cli", "infrastructure"]

# Distribution. Merged 2026-08-17 from three separate clusters: reddit-marketing,
# community-building and technical-events. No topic was dropped and the settled scope in
# CHARTER 2c-bis is unchanged; only the container changed.
#
# The isolation rule's own logic forced this. It requires every cluster to have one owner
# page covering the whole job, and three clusters of 3, 4 and 5 rows cannot each have an
# owner page that owns anything. Merging makes the rule satisfiable rather than aspirational,
# and it REMOVES a cross-cluster exception instead of adding one.
#
# The empirical tell: a brief for the community owner page needed a stop instruction, because
# it opened a cluster with no publishable siblings and could not meet the two-outbound minimum
# honestly. That is a structural failure surfacing in the work, not a theory about it.
#
# None of the three old slugs ever rendered. Verified 2026-08-17: no directory in output/, no
# sitemap entry, and zero commits in the entire history placed any of them in a built sitemap.
# No post ever declared them. So no redirect is needed and nothing was indexed.
#
# Distribution is a CREDIBILITY cluster, not a traffic cluster. Twelve rows is its ceiling,
# not a starting allocation, and it must not grow on the strength of a floor figure.
[[content.categories]]
slug = "distribution"
title = "Reaching Developers"
description = "Getting a technical product in front of the developers who would use it, through Reddit, forums, communities, and events."
intro = "Where technical audiences already gather, and how to show up without being ejected."
tag_matches = ["reddit", "reddit-marketing", "community", "community-building", "forums", "discord", "events", "meetups", "workshops", "conferences", "distribution"]

[[content.categories]]
slug = "developer-experience"
title = "Developer Experience and DevRel"
description = "Content, positioning, and developer-facing craft for DevTools and B2B SaaS companies."
intro = "Why developers trust some technical content and bounce off the rest."
tag_matches = ["developer-experience", "devtools", "developer-tools", "developer-marketing", "developer-productivity", "content-strategy", "engineering-culture", "career"]

[[content.categories]]
slug = "technical-documentation"
title = "Technical Documentation"
description = "Technical documentation systems, developer education, and documentation operations."
intro = "Practical guidance for documentation that helps developers reach a working result."
tag_matches = ["documentation", "technical-writing", "api-documentation", "docs-as-code", "documentation-workflow", "information-architecture", "accessibility"]

