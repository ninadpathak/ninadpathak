[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdoutline"
version = "0.2.0"
description = "Print the heading outline of a Markdown file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
mdoutline = "mdoutline:main"

[tool.setuptools]
py-modules = ["mdoutline"]
