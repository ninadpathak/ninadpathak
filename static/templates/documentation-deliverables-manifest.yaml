product: Example webhook API
version: 1
deliverables:
  - deliverable: orientation
    reader: evaluator
    reader_task: decide whether the API fits an event-delivery workflow
    must_include: product boundary, supported events, authentication model, and a link to the quickstart
    success_signal: the reader can name the supported event and the first integration step
    owner: product documentation
    update_trigger: supported-event or authentication change
    defer_if: the product has not reached external evaluation
  - deliverable: quickstart
    reader: new integrator
    reader_task: receive one signed webhook locally
    must_include: prerequisites, one supported setup path, a complete request or command, expected output, and a failure link
    success_signal: a local endpoint records a verified test event
    owner: developer experience
    update_trigger: SDK, signing, or setup change
    defer_if: there is no safe first integration path
  - deliverable: concept
    reader: integrator
    reader_task: understand delivery, signing, retry, and event ordering
    must_include: the system model, relevant terminology, and boundaries that change implementation choices
    success_signal: the reader can explain why signature verification precedes processing
    owner: platform engineering
    update_trigger: delivery-guarantee or event-model change
    defer_if: concepts are fully explained beside one small task without obscuring it
  - deliverable: task-guide
    reader: existing integrator
    reader_task: add verification and replay protection
    must_include: starting state, procedure, observable result, failure signal, and safe recovery
    success_signal: the integration rejects an invalid signature and accepts a valid replay-safe event
    owner: developer experience
    update_trigger: verification-library or security-policy change
    defer_if: no supported task exists beyond the quickstart
  - deliverable: reference
    reader: implementer
    reader_task: look up an event field or signature-header behavior
    must_include: stable names, types, required fields, constraints, and exceptions
    success_signal: the reader can resolve one exact implementation question without guessing
    owner: API platform
    update_trigger: schema or API-contract change
    defer_if: there is no stable public interface
  - deliverable: troubleshooting
    reader: integrator with a failed delivery
    reader_task: diagnose a missing or rejected event
    must_include: symptom, likely cause, diagnostic check, safe recovery, and escalation boundary
    success_signal: the reader can classify the failure and take the next safe action
    owner: support engineering
    update_trigger: recurring support issue or incident finding
    defer_if: the quickstart has no meaningful failure path
  - deliverable: release-note
    reader: existing integrator
    reader_task: determine whether a product change requires action
    must_include: change, impact, required action, version or date, and migration link
    success_signal: the reader can decide whether to change their integration
    owner: product documentation
    update_trigger: shipped behavior, deprecation, or breaking change
    defer_if: no externally visible product change has shipped
