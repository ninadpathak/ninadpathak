<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM VDB Latency</title>
    <link rel="stylesheet" href="/static/css/visual-embed.css">
    <style>


        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            background: var(--bg-1); 
            font-family: var(--sans); 
            color: var(--text-1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container { 
            width: 100%; 
            height: 100%;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 100%;
            overflow: visible;
        }

        .bar-label { font-family: var(--mono); font-size: 22px; fill: var(--text-2); font-weight: 600; text-transform: uppercase; }
        .bar-val { font-family: var(--mono); font-size: 24px; fill: var(--accent); font-weight: 700; }
        .tick-label { font-family: var(--mono); font-size: 18px; fill: var(--text-3); }
        .chart-title { font-family: var(--mono); font-size: 26px; fill: var(--text-1); font-weight: 700; text-transform: uppercase; }
        
        .axis { stroke: var(--text-1); stroke-width: 2; vector-effect: non-scaling-stroke; }
        .grid { stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4; vector-effect: non-scaling-stroke; }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet">
            <line x1="250" y1="80" x2="250" y2="300" class="axis" />
            <line x1="250" y1="300" x2="950" y2="300" class="axis" />
            
            <g transform="translate(250, 0)">
                <line x1="250" y1="80" x2="250" y2="300" class="grid" />
                <text x="250" y="330" text-anchor="middle" class="tick-label">5ms</text>
                
                <line x1="500" y1="80" x2="500" y2="300" class="grid" />
                <text x="500" y="330" text-anchor="middle" class="tick-label">10ms</text>
                
                <line x1="700" y1="80" x2="700" y2="300" class="grid" />
                <text x="700" y="330" text-anchor="middle" class="tick-label">15ms</text>
            </g>

            <g>
                <text x="240" y="145" text-anchor="end" class="bar-label">PGlite (HNSW Index)</text>
                <rect x="250" y="110" width="600" height="50" fill="var(--bg-2)" />
                <text x="860" y="145" class="bar-val">12ms</text>
            </g>

            <g>
                <text x="240" y="245" text-anchor="end" class="bar-label">SQLite-vec (Binary)</text>
                <rect x="250" y="210" width="200" height="50" fill="var(--accent)" />
                <text x="460" y="245" class="bar-val">4ms</text>
            </g>

            <text x="500" y="40" text-anchor="middle" class="chart-title">p99 Query Latency</text>
        </svg>
    </div>
</body>
</html>
