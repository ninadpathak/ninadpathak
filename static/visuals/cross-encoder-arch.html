<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Encoder Architecture</title>
    <link rel="stylesheet" href="/static/css/visual-embed.css">
    <style>
        body { margin: 0; height: 100vh; height: 100vh; background: var(--bg-1); font-family: var(--sans); color: var(--text-1);  display: flex; align-items: center; justify-content: center; min-  overflow: hidden; }
        .container { width: 100%; max-width: 600px; padding: 2rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 2rem; }
        .box { border: 1px solid var(--border); padding: 1rem; background: var(--bg-1); text-align: center; }
        .mono { font-family: var(--mono); font-size: 0.85rem; }
        .accent { color: var(--accent); }
        .text-3 { color: var(--text-3); }
        .flex-row { display: flex; gap: 1rem; justify-content: space-between; align-items: center; width: 100%; }
        .flex-col { display: flex; flex-direction: column; gap: 1rem; }
        .arrow { color: var(--text-3); font-family: var(--mono); text-align: center; }
        @media (max-width: 600px) { .flex-row { flex-direction: column; } .arrow { transform: rotate(90deg); } .no-rotate { transform: none !important; } }
</style>
</head>
<body>
    <div class="container" id="root">
        
<div class="flex-row" style="align-items: stretch;">
    <div class="box mono" style="flex:1; display:flex; align-items:center; justify-content:center;">Query</div>
    <div class="mono" style="color:var(--text-3); display:flex; align-items:center; justify-content:center;">+</div>
    <div class="box mono" style="flex:1; display:flex; align-items:center; justify-content:center;">Document</div>
</div>
<div class="arrow no-rotate">↓</div>
<div class="box mono" style="background: var(--bg-2); padding: 2rem;">Cross-Encoder Transformer<br><span style="font-size: 0.7rem; color: var(--text-3); display: block; margin-top: 0.5rem">Full Self-Attention Between All Tokens</span></div>
<div class="arrow no-rotate">↓</div>
<div class="box mono accent" style="font-size: 1.5rem; font-weight:bold;">0.942</div>

    </div>
</body>
</html>
