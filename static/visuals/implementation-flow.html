<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementation Flow</title>
    <link rel="stylesheet" href="/static/css/visual-embed.css">
    <link rel="stylesheet" href="/static/css/visual-utilities.css">
    <style>
        body { margin: 0; height: 100vh; height: 100vh; background: var(--bg-1); font-family: var(--sans); color: var(--text-1);  display: flex; align-items: center; justify-content: center; min-  overflow: hidden; }
        .container { width: 100%; max-width: 600px; padding: 2rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 2rem; }
        .box { border: 1px solid var(--border); padding: 1rem; background: var(--bg-1); text-align: center; }
        .mono { font-family: var(--mono); font-size: 0.85rem; }
        .accent { color: var(--accent); }
        .text-3 { color: var(--text-3); }
        .flex-row { display: flex; gap: 1rem; justify-content: space-between; align-items: center; width: 100%; }
        .flex-col { display: flex; flex-direction: column; gap: 1rem; }
        .arrow { color: var(--text-3); font-family: var(--mono); text-align: center; }
        @media (max-width: 600px) { .flex-row { flex-direction: column; } .arrow { transform: rotate(90deg); } .no-rotate { transform: none !important; } }

        /* Former inline styles as classes. A selector is repeated where a matching rule would otherwise win. */
        .u-width-100pct--gap-0-5rem { width: 100%; gap: 0.5rem; }
        .u-align-left--bg-bg-2--border-none--border-left-2px-solid-text-3 { text-align: left; background: var(--bg-2); border: none; border-left: 2px solid var(--text-3); }
        .u-align-left--bg-bg-2--border-none--border-left-2px-solid-accent { text-align: left; background: var(--bg-2); border: none; border-left: 2px solid var(--accent); }
        .u-align-left--bg-bg-2--border-none--border-left-2px-solid-text-1 { text-align: left; background: var(--bg-2); border: none; border-left: 2px solid var(--text-1); }
</style>
</head>
<body>
    <div class="container" id="root">
        
<div class="flex-col u-width-100pct--gap-0-5rem">
    <div class="box mono u-align-left--bg-bg-2--border-none--border-left-2px-solid-text-3">
        <span class="u-color-text-3">1.</span> docs = vector_db.search(query, k=100)
    </div>
    <div class="arrow no-rotate u-m-0">↓</div>
    <div class="box mono u-align-left--bg-bg-2--border-none--border-left-2px-solid-accent">
        <span class="u-color-text-3">2.</span> pairs = [[query, doc.text] for doc in docs]
    </div>
    <div class="arrow no-rotate u-m-0">↓</div>
    <div class="box mono u-align-left--bg-bg-2--border-none--border-left-2px-solid-accent">
        <span class="u-color-text-3">3.</span> scores = reranker.predict(pairs)
    </div>
    <div class="arrow no-rotate u-m-0">↓</div>
    <div class="box mono u-align-left--bg-bg-2--border-none--border-left-2px-solid-text-1">
        <span class="u-color-text-3">4.</span> final_docs = sort(docs, scores)[:5]
    </div>
</div>

    </div>
</body>
</html>
