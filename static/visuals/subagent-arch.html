<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Subagent Architecture</title>
    <link rel="stylesheet" href="/static/css/visual-embed.css">
    <link rel="stylesheet" href="/static/css/visual-utilities.css">
    <style>
        :root {
            --bg: #ffffff;
            --text: #0e0e0e;
            --text-dim: #888888;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111111;
                --text: #f0f0f0;
                --text-dim: #6a6a6a;
            }
        }

        body {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { width: 95%; max-width: 1000px; max-width: 800px; padding: 40px; background: var(--bg); }
        svg { width: 100%; height: auto; overflow: visible; }
        .node-box { fill: var(--bg); stroke: var(--border); stroke-width: 3.0; }
        .node-label { font-family: var(--mono); font-size: 22px; fill: var(--text); font-weight: 600; text-transform: uppercase; }
        .line { stroke: var(--border); stroke-width: 3.0; marker-end: url(#arrow); }

        /* Former inline styles as classes. A selector is repeated where a matching rule would otherwise win. */
        .u-fs-19px--fill-text-dim { font-size: 19px; fill: var(--text-dim); }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="-300 -80 1200 650">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--border)" />
                </marker>
            </defs>

            <!-- Lead Agent -->
            <rect x="325" y="20" width="150" height="60" rx="4" class="node-box u-stroke-accent" />
            <text x="400" y="55" text-anchor="middle" class="node-label">Lead Agent</text>
            <text class="u-fs-19px--fill-text-dim" x="400" y="72" text-anchor="middle">PLANNING & DELEGATION</text>

            <!-- Lines -->
            <path d="M 400 80 L 150 150" class="line" />
            <path d="M 400 80 L 400 150" class="line" />
            <path d="M 400 80 L 650 150" class="line" />

            <!-- Subagents -->
            <g transform="translate(50, 150)">
                <rect width="200" height="80" rx="4" class="node-box" />
                <text x="100" y="35" text-anchor="middle" class="node-label">Analyst Agent</text>
                <text class="u-fs-19px--fill-text-dim" x="100" y="55" text-anchor="middle">REPO-SCALE ANALYSIS</text>
                <text class="u-fs-19px--fill-text-dim" x="100" y="68" text-anchor="middle">DEPENDENCY GRAPHING</text>
            </g>

            <g transform="translate(300, 150)">
                <rect width="200" height="80" rx="4" class="node-box" />
                <text x="100" y="35" text-anchor="middle" class="node-label">Coder Agent</text>
                <text class="u-fs-19px--fill-text-dim" x="100" y="55" text-anchor="middle">ATOMIC FILE EDITS</text>
                <text class="u-fs-19px--fill-text-dim" x="100" y="68" text-anchor="middle">LINT & FORMAT</text>
            </g>

            <g transform="translate(550, 150)">
                <rect width="200" height="80" rx="4" class="node-box" />
                <text x="100" y="35" text-anchor="middle" class="node-label">Verifier Agent</text>
                <text class="u-fs-19px--fill-text-dim" x="100" y="55" text-anchor="middle">TEST SUITE EXECUTION</text>
                <text class="u-fs-19px--fill-text-dim" x="100" y="68" text-anchor="middle">FAILURE TRIAGE</text>
            </g>

            <!-- Output -->
            <path d="M 150 230 L 400 300" class="line" />
            <path d="M 400 230 L 400 300" class="line" />
            <path d="M 650 230 L 400 300" class="line" />

            <rect x="325" y="300" width="150" height="60" rx="4" class="node-box u-stroke-0088ff" />
            <text x="400" y="335" text-anchor="middle" class="node-label">Merged PR</text>
            <text class="u-fs-19px--fill-text-dim" x="400" y="352" text-anchor="middle">VERIFIED REFECTORED CODE</text>
        </svg>
    </div>
</body>
</html>
