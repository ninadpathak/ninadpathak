<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matryoshka truncation: keep the head of the vector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        /* Plate tokens from tools/image-brand/brand.tokens.json. The page follows the site's
           data-theme when the parent exposes it, and prefers-color-scheme otherwise. */
        :root {
            --np-canvas: #f8f8f6; --np-surface: #ffffff; --np-surface-2: #efefed; --np-rule: #c8c8c4; --np-hairline: #e0e0dc;
            --np-line: #7d7d79; --np-ink: #0e0e0e; --np-ink-2: #3a3a3a; --np-muted: #6b6b6b;
            --np-accent: #c23b00; --np-accent-wash: #fdf1ec;
            --np-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --np-mono: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --np-canvas: #090909; --np-surface: #111111; --np-surface-2: #1a1a1a; --np-rule: #2c2c2c; --np-hairline: #1e1e1e;
                --np-line: #6f6f6f; --np-ink: #f0f0f0; --np-ink-2: #c2c2c2; --np-muted: #8a8a8a;
                --np-accent: #ff5f1f; --np-accent-wash: #1a0d07;
            }
        }
        :root[data-theme="dark"] {
            --np-canvas: #090909; --np-surface: #111111; --np-surface-2: #1a1a1a; --np-rule: #2c2c2c; --np-hairline: #1e1e1e;
            --np-line: #6f6f6f; --np-ink: #f0f0f0; --np-ink-2: #c2c2c2; --np-muted: #8a8a8a;
            --np-accent: #ff5f1f; --np-accent-wash: #1a0d07;
        }
        html, body { margin: 0; height: 100%; background: var(--np-canvas); color: var(--np-ink); font-family: var(--np-sans); }
        body { display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
        .stage { flex: 1 1 auto; min-height: 0; display: flex; padding: 12px 16px 0; }
        svg { width: 100%; height: 100%; display: block; }
        .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 20px 16px; border-top: 1px solid var(--np-hairline); }
        .readout { font: 500 13px var(--np-mono); color: var(--np-ink-2); white-space: nowrap; }
        .readout b { font-weight: 500; color: var(--np-accent); }
        label { font: 500 9.5px var(--np-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--np-muted); }
        input[type=range] { flex: 1 1 160px; min-width: 140px; accent-color: var(--np-accent); cursor: pointer; }
        .js-only { display: none; }
        .js .js-only { display: revert; }

        .cell { fill: var(--np-ink-2); stroke: var(--np-rule); stroke-width: 0.75; }
        .cell.cut { fill: var(--np-canvas); fill-opacity: 1; stroke-dasharray: 2 2; }
        .bracket { fill: none; stroke: var(--np-accent); stroke-width: 1.5; }
        .kicker { font: 500 9.5px var(--np-mono); letter-spacing: 0.1em; fill: var(--np-muted); }
        .kept-text { font: 500 9.5px var(--np-mono); letter-spacing: 0.1em; fill: var(--np-accent); }
        .slab { fill: var(--np-surface); stroke: var(--np-rule); stroke-width: 1; }
        .fill-ram { fill: var(--np-accent); }
        .fill-disk { fill: var(--np-line); }
        .slab-label { font: 500 13px var(--np-sans); fill: var(--np-ink); }
        .axis { stroke: var(--np-rule); stroke-width: 0.75; }
        /* Phones: larger SVG text keeps the drawing over the 12 px sans / 8.5 px mono floor. */
        @media (max-width: 480px) {
            .slab-label { font-size: 15px; }
            .kicker, .kept-text { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- Complete without JavaScript: it shows the first 256 of 1536 dimensions kept. -->
        <svg id="plot" viewBox="0 0 360 196" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mt-title mt-desc">
            <title id="mt-title">Matryoshka truncation</title>
            <desc id="mt-desc">An embedding drawn as a row of dimensions, darkest at the front because a Matryoshka model stores the most important information in the first dimensions. Truncating keeps a prefix of the vector. The kept head is what stays in RAM for the first retrieval stage, while the full vector stays on disk.</desc>
            <text class="kicker" x="20" y="24">DIMENSIONS</text>
            <g id="cells">
                <rect class="cell" x="20.00" y="40" width="5.20" height="28" rx="1" fill-opacity="0.85"/>
                <rect class="cell" x="26.70" y="40" width="5.20" height="28" rx="1" fill-opacity="0.82"/>
                <rect class="cell" x="33.40" y="40" width="5.20" height="28" rx="1" fill-opacity="0.79"/>

                <rect class="cell" x="60.19" y="40" width="5.20" height="28" rx="1" fill-opacity="0.69"/>
                <rect class="cell" x="66.89" y="40" width="5.20" height="28" rx="1" fill-opacity="0.66"/>
                <rect class="cell cut" x="73.58" y="40" width="5.20" height="28" rx="1"/>

                <rect class="cell cut" x="93.68" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="100.38" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="107.07" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="113.77" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="120.47" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="127.17" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="133.86" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="140.56" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="147.26" y="40" width="5.20" height="28" rx="1"/>

                <rect class="cell cut" x="207.54" y="40" width="5.20" height="28" rx="1"/>
                <rect class="cell cut" x="214.24" y="40" width="5.20" height="28" rx="1"/>

            </g>
            <path id="bracket" class="bracket" d="M20,76 V82 H74 V76"/>
            <text id="kept-label" class="kept-text" x="20" y="96">KEPT</text>
            <line class="axis" x1="20" y1="114" x2="340" y2="114"/>
            <text class="slab-label" x="20" y="140">RAM</text>
            <rect class="slab" x="64" y="128" width="276" height="16" rx="1"/>
            <rect id="ram" class="fill-ram" x="64" y="128" width="46" height="16" rx="1"/>
            <text class="slab-label" x="20" y="176">Disk</text>
            <rect class="slab" x="64" y="164" width="276" height="16" rx="1"/>
            <rect class="fill-disk" x="64" y="164" width="276" height="16" rx="1"/>
        </svg>
    </div>
    <div class="controls">
        <span class="readout"><b id="dim-val">256</b> of 1536 dims</span>
        <span class="readout"><b id="pct-val">17</b>% of full size</span>
        <label class="js-only" for="dims">Keep</label>
        <input class="js-only" type="range" id="dims" min="64" max="1536" step="64" value="256" aria-label="Dimensions kept from the front of the vector">
    </div>
    <script>
        (function () {
            var N = 48, MAX = 1536, X0 = 20, GAP = 1.5;
            var cells = Array.prototype.slice.call(document.querySelectorAll('#cells rect'));
            var cw = Number(cells[0].getAttribute('width'));
            document.documentElement.classList.add('js');
            try {
                var root = window.parent.document.documentElement;
                var sync = function () {
                    var t = root.getAttribute('data-theme');
                    if (t) document.documentElement.setAttribute('data-theme', t);
                };
                sync();
                new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
            } catch (e) { /* standalone or cross-origin: prefers-color-scheme applies */ }

            var slider = document.getElementById('dims');
            var bracket = document.getElementById('bracket'), keptLabel = document.getElementById('kept-label');
            var ram = document.getElementById('ram');
            var dimVal = document.getElementById('dim-val'), pctVal = document.getElementById('pct-val');

            function draw(dims) {
                var kept = Math.round(dims / MAX * N);
                for (var i = 0; i < N; i++) {
                    // Information is front-loaded: earlier dimensions are drawn darker.
                    var w = 1 - i / N;
                    if (i < kept) {
                        cells[i].setAttribute('class', 'cell');
                        cells[i].style.fillOpacity = (0.15 + 0.7 * w * w).toFixed(2);
                    } else {
                        cells[i].setAttribute('class', 'cell cut');
                        cells[i].style.fillOpacity = ''; cells[i].removeAttribute('fill-opacity');
                    }
                }
                var right = X0 + kept * (cw + GAP) - GAP;
                bracket.setAttribute('d', 'M' + X0 + ',76 V82 H' + right.toFixed(2) + ' V76');
                keptLabel.setAttribute('x', X0);
                ram.setAttribute('width', (276 * dims / MAX).toFixed(2));
                dimVal.textContent = dims;
                pctVal.textContent = Math.round(dims / MAX * 100);
            }
            slider.addEventListener('input', function () { draw(Number(slider.value)); });
            draw(Number(slider.value));
            // The article page reveals this frame only once this flag is set (static/js/main.js).
            window.npVisualReady = true;
        })();
    </script>
</body>
</html>
