<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models and Providers</title>
    <link rel="stylesheet" href="/static/css/visual-embed.css">
    <style>
        body { margin: 0; height: 100vh; height: 100vh; background: var(--bg-1); font-family: var(--sans); color: var(--text-1);  display: flex; align-items: center; justify-content: center; min-  overflow: hidden; }
        .container { width: 100%; max-width: 600px; padding: 2rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 2rem; }
        .box { border: 1px solid var(--border); padding: 1rem; background: var(--bg-1); text-align: center; }
        .mono { font-family: var(--mono); font-size: 0.85rem; }
        .accent { color: var(--accent); }
        .text-3 { color: var(--text-3); }
        .flex-row { display: flex; gap: 1rem; justify-content: space-between; align-items: center; width: 100%; }
        .flex-col { display: flex; flex-direction: column; gap: 1rem; }
        .arrow { color: var(--text-3); font-family: var(--mono); text-align: center; }
        @media (max-width: 600px) { .flex-row { flex-direction: column; } .arrow { transform: rotate(90deg); } .no-rotate { transform: none !important; } }

        /* Former inline styles as classes. A selector is repeated where a matching rule would otherwise win. */
        .u-align-items-stretch--gap-1rem { align-items: stretch; gap: 1rem; }
        .u-flex-1--align-left--justify-content-flex-start { flex: 1; text-align: left; justify-content: flex-start; }
        .u-fs-1-1rem--border-bottom-1px-solid-border--padding-bottom-0-5rem { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .u-fs-0-75rem--padding-left-1-2rem--line-height-2--color-text-2--m-0 { font-size: 0.75rem; padding-left: 1.2rem; line-height: 2; color: var(--text-2); margin: 0; }
        .u-flex-1--align-left--justify-content-flex-start--border-color-accent { flex: 1; text-align: left; justify-content: flex-start; border-color: var(--accent); }
</style>
</head>
<body>
    <div class="container" id="root">
        
<div class="flex-row u-align-items-stretch--gap-1rem">
    <div class="box flex-col u-flex-1--align-left--justify-content-flex-start">
        <div class="mono text-3">// Commercial API</div>
        <div class="mono u-fs-1-1rem--border-bottom-1px-solid-border--padding-bottom-0-5rem">Cohere Rerank v3</div>
        <ul class="mono u-fs-0-75rem--padding-left-1-2rem--line-height-2--color-text-2--m-0">
            <li>Zero infrastructure</li>
            <li>Multilingual support</li>
            <li>Network latency cost</li>
            <li>Per-request pricing</li>
        </ul>
    </div>
    <div class="box flex-col u-flex-1--align-left--justify-content-flex-start--border-color-accent">
        <div class="mono accent">// Open Source</div>
        <div class="mono u-fs-1-1rem--border-bottom-1px-solid-border--padding-bottom-0-5rem">bge-reranker-large</div>
        <ul class="mono u-fs-0-75rem--padding-left-1-2rem--line-height-2--color-text-2--m-0">
            <li>Hosted locally</li>
            <li>No network latency</li>
            <li>Requires GPU/compute</li>
            <li>Fixed infra cost</li>
        </ul>
    </div>
</div>

    </div>
</body>
</html>
